<script>

_ps.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";

<script>
try{(function(){
var C=document.getElementById("gc"),X=C.getContext("2d"),W=800,H=500,GND=H-60;
C.width=W;C.height=H;
function rs(){var s=Math.min(innerWidth/W,innerHeight/H)*0.95;C.style.width=W*s+"px";C.style.height=H*s+"px"}
rs();onresize=rs;
var keys={},just={};
onkeydown=function(e){if(!keys[e.code])just[e.code]=true;keys[e.code]=true;e.preventDefault()};
onkeyup=function(e){keys[e.code]=false};
function jp(k){if(just[k]){just[k]=false;return true}return false}
function R(a,b){return Math.random()*(b-a)+a}
function CL(v,a,b){return v<a?a:v>b?b:v}
function dF(a,b){return b>a?1:-1}
var _knM={"KeyA":"A","KeyB":"B","KeyD":"D","KeyJ":"J","KeyK":"K","KeyL":"L","KeyS":"S","KeyW":"W","KeyX":"X","KeyZ":"Z","ArrowLeft":"<","ArrowRight":">","ArrowUp":"^","ArrowDown":"v","Space":"Spc","Enter":"Ent","Comma":",","Period":".","Slash":"/","Digit1":"1","Digit2":"2","Digit3":"3","Digit4":"4","Digit5":"5","Digit6":"6","Tab":"TAB","Delete":"Del","Backspace":"Bksp"};
function kn(c){return _knM[c]||c}

var CTRL=[{left:"KeyA",right:"KeyD",jump:"KeyW",shoot:"KeyJ",dash:"KeyK",swap:"KeyL"},{left:"ArrowLeft",right:"ArrowRight",jump:"ArrowUp",shoot:"Period",dash:"Comma",swap:"Slash"}];
var ctrlP=0,ctrlA=0,ctrlR=false;
var cActs=["left","right","jump","shoot","dash","swap"],cLbls=["Esquerda","Direita","Pular","Atirar","Dash","Trocar"];
function saveCtrl(){try{localStorage.setItem("pip_ctrl",JSON.stringify(CTRL))}catch(e){}}
function loadCtrl(){try{var d=localStorage.getItem("pip_ctrl");if(d)CTRL=JSON.parse(d)}catch(e){}}
loadCtrl();

var saves=[null,null,null],curSave=-1,saveSel=0;
function loadSaves(){for(var i=0;i<3;i++){try{var d=localStorage.getItem("pip_s"+i);saves[i]=d?JSON.parse(d):null}catch(e){saves[i]=null}}}
loadSaves();
function saveGame(){if(curSave<0)return;saves[curSave]={coins:coins,bc:bCoins.slice(),bl:bClear.slice(),wp:WPNS.map(function(w){return w.own}),eq:equipped.slice(),fp:firstPlay,pb:postB1};try{localStorage.setItem("pip_s"+curSave,JSON.stringify(saves[curSave]))}catch(e){}}
function loadSave(idx){curSave=idx;var s=saves[idx];if(s){coins=s.coins||0;bCoins=s.bc?[]:[];bClear=s.bl?[]:[];for(var i=0;i<16;i++){bCoins[i]=s.bc&&s.bc[i]?s.bc[i]:0;bClear[i]=s.bl&&s.bl[i]?s.bl[i]:0}for(var i=0;i<WPNS.length;i++)WPNS[i].own=s.wp?s.wp[i]:0;equipped=s.eq||[0,0];firstPlay=s.fp!==undefined?s.fp:true;postB1=s.pb||false}else{resetSave();saveGame()}}
function resetSave(){coins=0;bCoins=[];bClear=[];for(var i=0;i<16;i++){bCoins[i]=0;bClear[i]=0}for(var i=0;i<WPNS.length;i++)WPNS[i].own=WPNS[i].cost===0?1:0;equipped=[0,0];firstPlay=true;postB1=false}
function delSave(i){saves[i]=null;try{localStorage.removeItem("pip_s"+i)}catch(e){}}

var CFG={pHP:3,pSpd:5,pJf:11,pJS:6.5,pDD:160,pDS:16,pDC:800,pInv:1500,wD:[1,2,1,2,10,2],wR:[140,220,170,300,480,320]};
var state="title",coins=0,bossI=0,fDmg=0,fTime=0,shake=0,fadeA=0;
var bCoins=[],bClear=[];for(var i=0;i<16;i++){bCoins[i]=0;bClear[i]=0}
var rN=0,shSel=0,bsSel=0,secSel=0,modeSel=0,admin=false;
var tg=[],overlay=null,ovSel=0,grpId=0,spreadG={};
var firstPlay=true,postB1=false;
var numPlayers=1,players=[],localPID=0,equipped=[0,0];
var WPNS=[{n:"Manifestacao",cost:0,own:1,c:"#4CAF50",tp:"pea"},{n:"Boomerang",cost:2,own:0,c:"#2196F3",tp:"boom"},{n:"Spread",cost:3,own:0,c:"#FF5722",tp:"spr"},{n:"Lightning",cost:3,own:0,c:"#FFEB3B",tp:"bolt"},{n:"Bomb",cost:3,own:0,c:"#FF9800",tp:"bomb"},{n:"Homing",cost:4,own:0,c:"#E91E63",tp:"home"}];
var SECS=[{n:"TERRA",c:"#4CAF50",bosses:[0,1,2,3,4]},{n:"MONTANHA",c:"#78909C",bosses:[5,6,7,8,9]},{n:"CEU",c:"#42A5F5",bosses:[10,11,12,13,14]},{n:"FINAL",c:"#FFD700",bosses:[15]}];
function secOk(s){if(s===0)return true;var p=SECS[s-1].bosses;for(var i=0;i<p.length;i++)if(!bClear[p[i]])return false;return true}
function bossOk(idx){var s=BDATA[idx].s,bl=SECS[s].bosses;for(var i=0;i<bl.length;i++){if(bl[i]===idx)return i===0?secOk(s):!!bClear[bl[i-1]]}return false}

var pts=[];
function burst(x,y,n,c,ss,se,sz,sze,lf){for(var i=0;i<n;i++){var a=R(0,6.283),sp=R(ss,se);pts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:c,s:R(sz,sze),l:lf,ml:lf})}}
function uPts(dt){for(var i=pts.length-1;i>=0;i--){var p=pts[i];p.l-=dt;p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;if(p.l<=0)pts.splice(i,1)}}
function dPts(){for(var i=0;i<pts.length;i++){var p=pts[i];X.globalAlpha=CL(p.l/p.ml,0,1);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s*(p.l/p.ml),0,6.283);X.fill()}X.globalAlpha=1}
function getMB(){var f=0;for(var i=0;i<16;i++)if((bCoins[i]&7)===7)f++;return f}

function mkP(id){return{id:id,binds:CTRL[id]||CTRL[0],x:100+id*80,y:GND-44,w:32,h:44,vx:0,vy:0,spd:CFG.pSpd,jf:-CFG.pJf,hp:CFG.pHP,mhp:CFG.pHP,gnd:false,face:1,inv:0,anim:0,jc:0,jH:false,dash:false,dT:0,dCD:0,dDir:1,pullX:0,pullStr:0,pullDur:0,alive:true,deadT:0,equipped:equipped[id]||0,lsht:0,pk:{}}}
function pH(p,a){return !!keys[p.binds[a]]}
function pJ(p,a){var k=p.binds[a],dn=!!keys[k],was=!!p.pk[a];p.pk[a]=dn;return dn&&!was}
function nearP(tx,ty){var best=null,bd=99999;for(var i=0;i<players.length;i++){if(!players[i].alive)continue;var d=Math.hypot(players[i].x+16-tx,players[i].y+22-ty);if(d<bd){bd=d;best=players[i]}}return best}
function anyAl(){for(var i=0;i<players.length;i++)if(players[i].alive)return true;return false}
function allDe(){for(var i=0;i<players.length;i++)if(players[i].alive)return false;return true}
function wrapX(x){if(x>W)x-=W+32;if(x+32<0)x+=W+32;return x}
function wrapBX(x){if(x>W+15)x-=W+30;if(x<-15)x+=W+30;return x}
function hitC(x,y,tx,ty,tw,th,r){return Math.hypot(x-CL(x,tx,tx+tw),y-CL(y,ty,ty+th))<r}

// BULLET HELPERS
function eb(x,y,vx,vy,sz,c,lf,gr,hm){return{x:x,y:y,vx:vx,vy:vy,sz:sz,c:c,life:lf,grav:!!gr,home:!!hm}}
function mkB(x,y,vx,vy,sz,c,lf,gr){eB.push(eb(x,y,vx,vy,sz,c,lf,gr))}
function mkTg(x,y,r,d,col,fn){tg.push({x:x,y:y,r:r,t:0,dur:d,col:col,tp:"circ",cb:fn})}
function mkTgR(x,y,w,h,d,col,fn){tg.push({x:x,y:y,w:w,h:h,t:0,dur:d,col:col,tp:"rect",cb:fn})}
function mkRing(cx,cy,n,spd,sz,c,lf){for(var i=0;i<n;i++){var a=6.283/n*i;mkB(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,sz,c,lf)}}
function mkAimed(bx,by,n,spd,spread,sz,c,lf){var t=tgtP(),ang=Math.atan2(t.y+22-by,t.x+16-bx);if(n<2){mkB(bx,by,Math.cos(ang)*spd,Math.sin(ang)*spd,sz,c,lf);return}for(var i=0;i<n;i++){var a=ang+(i/(n-1)-0.5)*spread;mkB(bx,by,Math.cos(a)*spd,Math.sin(a)*spd,sz,c,lf)}}
function mkWave(bx,by,n,spd,sz,c,lf,delay){var t=tgtP(),ang=Math.atan2(t.y+22-by,t.x+16-bx);for(var i=0;i<n;i++){(function(ii){setTimeout(function(){if(boss&&boss.alive)mkB(bx,by,Math.cos(ang)*spd*(1+ii*0.2),Math.sin(ang)*spd*(1+ii*0.2),sz,c,lf)},ii*delay)})(i)}}
function mkRainN(n,sz,c,lf){for(var i=0;i<n;i++)mkB(R(50,W-50),-10,R(-1,1),R(3,7),sz,c,lf,1)}

// NETWORK
var netMode="local",netConn=null,netPeer=null,netRI=null,lastRI={};
var lobbyCode="",lobbyStatus="",lobbyType="",lobbyDigs=[0,0,0,0],lobbyCur=0,netSkip=0;
function hasPeer(){return typeof Peer!=="undefined"&&_pl}
function netClean(){try{if(netPeer)netPeer.destroy()}catch(e){}netPeer=null;netConn=null;netMode="local";netRI=null;lastRI={};lobbyStatus=""}
function netCreate(){if(!hasPeer()){lobbyStatus="Carregando...";setTimeout(function(){if(hasPeer())netCreate();else lobbyStatus="Indisponivel"},2000);return}var c=""+Math.floor(1000+Math.random()*9000);lobbyCode=c;lobbyType="host";lobbyStatus="waiting";try{netPeer=new Peer("pip-"+c,{debug:0});netPeer.on("open",function(){lobbyStatus="waiting"});netPeer.on("connection",function(conn){netConn=conn;netMode="host";numPlayers=2;localPID=0;lobbyStatus="connected";conn.on("data",function(d){if(d.t==="inp")netRI=d});conn.on("close",function(){netClean()});setTimeout(function(){if(state==="lobby"){try{netConn.send({t:"init",coins:coins})}catch(e){}startCS("cutscene_inicial","shop")}},1500)});netPeer.on("error",function(e){lobbyStatus="Erro: "+e.type})}catch(e){lobbyStatus="Erro"}}
function netJoin(code){if(!hasPeer()){lobbyStatus="Carregando...";setTimeout(function(){if(hasPeer())netJoin(code);else lobbyStatus="Indisponivel"},2000);return}lobbyType="join";lobbyStatus="connecting";try{netPeer=new Peer("pip-c-"+Math.floor(Math.random()*9999),{debug:0});netPeer.on("open",function(){var c=netPeer.connect("pip-"+code,{reliable:true});netConn=c;c.on("open",function(){netMode="client";numPlayers=2;localPID=1;lobbyStatus="connected"});c.on("data",function(d){if(d.t==="init"){coins=d.coins;saveGame()}if(d.t==="br"){coins+=d.rN;bCoins=d.bc;bClear=d.bl;saveGame()}if(d.t==="gs")netApply(d.d);if(d.t==="sc"){state=d.s;bossI=d.bi||0;if(d.s==="fight")startFight()}});c.on("close",function(){netClean();state="title";shSel=0})});netPeer.on("error",function(e){lobbyStatus="Erro: "+e.type})}catch(e){lobbyStatus="Erro"}}
function netNotify(st){if(netMode!=="host"||!netConn)return;try{netConn.send({t:"sc",s:st,bi:bossI})}catch(e){}}
function netSendBR(){if(netMode!=="host"||!netConn)return;try{netConn.send({t:"br",rN:rN,bc:bCoins.slice(),bl:bClear.slice()})}catch(e){}}
function netSendGS(){if(netMode!=="host"||!netConn)return;try{netConn.send({t:"gs",d:{gs:state,ft:fTime,fd:fDmg,bi:bossI,rN:rN,pl:players.map(function(p){return{x:p.x,y:p.y,vx:p.vx,vy:p.vy,hp:p.hp,mhp:p.mhp,face:p.face,alive:p.alive,dash:p.dash,inv:p.inv,anim:p.anim,gnd:p.gnd,equipped:p.equipped,jc:p.jc,deadT:p.deadT}}),bo:boss?{x:boss.x,y:boss.y,hp:boss.hp,mhp:boss.mhp,alive:boss.alive,phase:boss.phase,fl:boss.fl,n:boss.n,idx:boss.idx}:null,ba:bAtk,pt:phTr,pb:pB.map(function(b){return{x:b.x,y:b.y,vx:b.vx,vy:b.vy,ext:b.ext,ang:b.ang,life:b.life,pid:b.pid,elap:b.elap}}),eb:eB.map(function(b){return{x:b.x,y:b.y,vx:b.vx,vy:b.vy,sz:b.sz,c:b.c,life:b.life}})}})}catch(e){}}
function netApply(s){if(s.pl)for(var i=0;i<s.pl.length;i++){if(!players[i])players[i]=mkP(i);var p=players[i],sp=s.pl[i];for(var k in sp)p[k]=sp[k]}if(s.bo){if(!boss)boss={};for(var k in s.bo)boss[k]=s.bo[k]}else boss=null;if(s.ba)bAtk=s.ba;if(s.pt)phTr=s.pt;pB=s.pb||[];eB=s.eb||[];fTime=s.ft||fTime;fDmg=s.fd||fDmg;rN=s.rN||0;if(s.gs&&s.gs!==state)state=s.gs}
function mergeRI(){if(!netRI||!netRI.k)return;for(var a in CTRL[1]){var k=CTRL[1][a],dn=!!netRI.k[k],was=!!lastRI[k];keys[k]=dn;if(dn&&!was)just[k]=true}lastRI={};for(var kk in netRI.k)lastRI[kk]=netRI.k[kk];if(netRI.eqW!==undefined&&players[1])players[1].equipped=netRI.eqW}
function fadeTo(st,cb){fadeA=1;setTimeout(function(){state=st;if(cb)cb();netNotify(st)},80)}

// CUTSCENES
var cs=null,csNxt="";
var introSc=[{dur:2500,d:function(){X.fillStyle="#0a1a0a";X.fillRect(0,0,W,H);X.fillStyle="#2a6a1a";X.fillRect(0,320,W,180);X.fillStyle="#FFF";X.font="bold 22px monospace";X.textAlign="center";X.fillText("Numa fazenda pacifica...",W/2,100);X.textAlign="left"}},{dur:2000,d:function(p){X.fillStyle="#0a1a0a";X.fillRect(0,0,W,H);if(p>0.4){X.fillStyle="#FF0";X.font="bold 40px monospace";X.textAlign="center";X.fillText("BAM!",W/2,250)}X.fillStyle="#FFF";X.font="bold 18px monospace";X.textAlign="center";X.fillText("O mindinho do pe!",W/2,80);X.textAlign="left"}},{dur:2500,d:function(p){X.fillStyle="#1a1a4a";X.fillRect(0,0,W,H);if(p>0.55){X.fillStyle="#FF0";X.font="bold 48px monospace";X.textAlign="center";X.fillText("BONK!",W/2,130)}X.fillStyle="#FFF";X.font="bold 18px monospace";X.textAlign="center";X.fillText("A beterraba acertou Zeus!",W/2,H-40);X.textAlign="left"}},{dur:3000,d:function(p){X.fillStyle="#1a0a2a";X.fillRect(0,0,W,H);X.fillStyle="#CCC";X.beginPath();X.ellipse(W/2,200,60,80,0,0,6.283);X.fill();var t="INSETO! Voce pagara!",n=Math.floor(t.length*CL((p-0.2)*2,0,1));X.fillStyle="#FF5252";X.font="bold 22px monospace";X.textAlign="center";X.fillText(t.substring(0,n),W/2,60);X.textAlign="left"}},{dur:2500,d:function(p){X.fillStyle="#0a0a1a";X.fillRect(0,0,W,H);var sz=30+p*40;X.fillStyle="#8B2252";X.beginPath();X.ellipse(W/2,H/2,sz,sz*0.9,0,0,6.283);X.fill();if(p>0.6){X.fillStyle="#FF0";X.font="bold 20px monospace";X.textAlign="center";X.fillText("Baron Von Beet nasceu!",W/2,H-40)}X.textAlign="left"}}];
var postSc=[{dur:3000,d:function(){X.fillStyle="#1a0a0a";X.fillRect(0,0,W,H);X.fillStyle="#FFF";X.font="bold 20px monospace";X.textAlign="center";X.fillText("A fazenda foi destruida...",W/2,80);X.textAlign="left"}},{dur:2500,d:function(p){X.fillStyle="#0a0a2a";X.fillRect(0,0,W,H);if(p>0.5){X.fillStyle="#FFD700";X.font="bold 22px monospace";X.textAlign="center";X.fillText("Minha hora vai chegar!",W/2,H/2+80)}X.textAlign="left"}}];
function startCS(name,nxt){csNxt=nxt;cs={i:0,t:0,sc:name==="cutscene_inicial"?introSc:postSc}}
function uCS(dt){if(!cs)return;cs.t+=dt;if(jp("Enter")||jp("Space")){cs=null;fadeTo(csNxt);return}if(cs.t>=cs.sc[cs.i].dur){cs.i++;cs.t=0;if(cs.i>=cs.sc.length){cs=null;fadeTo(csNxt)}}}
function dCS(){if(!cs||!cs.sc[cs.i])return;cs.sc[cs.i].d(CL(cs.t/cs.sc[cs.i].dur,0,1));X.fillStyle="#555";X.font="bold 11px monospace";X.textAlign="center";X.fillText("ENTER pular",W/2,H-15);X.textAlign="left"}

// PLAYER
function uP(p,dt){
  if(!p.alive){if(numPlayers>=2){p.deadT+=dt;if(p.deadT>15000&&anyAl()){p.alive=true;p.hp=1;p.inv=3000;p.deadT=0;p.x=100;p.y=GND-44}}return}
  p.anim+=dt;if(p.dCD>0)p.dCD-=dt;if(admin){p.hp=p.mhp;p.inv=999999}
  if(p.pullDur>0){p.pullDur-=dt;p.x+=dF(p.x+16,p.pullX)*p.pullStr}
  if(p.dash){p.dT-=dt;p.x+=p.dDir*CFG.pDS;if(p.dT<=0){p.dash=false;p.dCD=CFG.pDC}}
  else{var mx=0;if(pH(p,"left")){mx=-1;p.face=-1}if(pH(p,"right")){mx=1;p.face=1}p.vx=mx*p.spd;p.x+=p.vx;
    if(pJ(p,"jump")&&p.jc<2){p.vy=-CFG.pJS;p.jc++;p.gnd=false;p.jH=true}
    if(pH(p,"jump")&&p.jH&&p.vy<0){p.vy-=0.65;if(p.vy<p.jf)p.vy=p.jf}
    if(!pH(p,"jump")&&p.vy<-3){p.vy=-3;p.jH=false}
    if(pJ(p,"dash")&&p.dCD<=0){p.dash=true;p.dT=CFG.pDD;p.dDir=p.face;p.vy=0}
    if(p.id===localPID&&pJ(p,"swap")){for(var n=0;n<6;n++){p.equipped=(p.equipped+1)%6;if(WPNS[p.equipped].own)break}}}
  p.vy+=0.55;p.y+=p.vy;if(p.y+p.h>=GND){p.y=GND-p.h;p.vy=0;p.gnd=true;p.jc=0;p.jH=false}
  p.x=wrapX(p.x);if(p.inv>0)p.inv=Math.max(0,p.inv-dt);
  if(p.id===localPID)for(var i=1;i<=6;i++)if(jp("Digit"+i)&&WPNS[i-1].own)p.equipped=i-1;
}
function drawBody(p,ox){var cx=p.x+16+ox,cy=p.y+22,b=p.gnd?Math.sin(p.anim*0.008)*2:0,pc=p.id===0?"#E87C3A":"#4FC3F7";
  X.fillStyle=p.dash?"#FFD700":pc;X.strokeStyle="#1a1a1a";X.lineWidth=2.5;X.beginPath();X.ellipse(cx,cy+4+b,16,18,0,0,6.283);X.fill();X.stroke();
  X.fillStyle=p.id===0?"#3A7CE8":"#E87C3A";X.beginPath();X.moveTo(cx-22,cy-8+b);X.lineTo(cx+22,cy-8+b);X.lineTo(cx+13,cy-26+b);X.lineTo(cx-13,cy-26+b);X.closePath();X.fill();X.stroke();
  X.fillStyle="#FFD700";X.fillRect(cx-22,cy-12+b,44,5);var eo=p.face*3;X.fillStyle="#FFF";X.lineWidth=2;
  X.beginPath();X.ellipse(cx-6+eo,cy+b,4.5,5.5,0,0,6.283);X.fill();X.stroke();
  X.beginPath();X.ellipse(cx+6+eo,cy+b,4.5,5.5,0,0,6.283);X.fill();X.stroke();
  X.fillStyle="#1a1a1a";X.beginPath();X.arc(cx-6+eo+p.face*2,cy+b,2.2,0,6.283);X.fill();X.beginPath();X.arc(cx+6+eo+p.face*2,cy+b,2.2,0,6.283);X.fill();
  var la=p.gnd?Math.sin(p.anim*0.008)*4:0;X.fillStyle="#C0392B";X.strokeStyle="#1a1a1a";X.lineWidth=2;X.fillRect(cx-10,p.y+p.h-10+b,8,10+la);X.fillRect(cx+2,p.y+p.h-10+b,8,10-la);
  X.fillStyle="#555";X.fillRect(cx+p.face*16-2,cy+12+b,10*p.face,4)}
function dP(p){
  if(!p.alive){X.globalAlpha=0.3;X.fillStyle="#888";X.font="bold 12px monospace";X.textAlign="center";X.fillText("P"+(p.id+1),p.x+16,p.y-5);X.textAlign="left";X.globalAlpha=1;return}
  if(p.dash)X.globalAlpha=0.5;else if(p.inv>0&&p.inv<999&&Math.floor(p.inv/80)%2===0)return;
  X.save();drawBody(p,0);X.restore();X.globalAlpha=1;

var trans={type:0,phase:0,t:0,progress:0,px:0,py:0,php:0,entities:[],warnings:[],miniBoss:null,lss:0};

function uTrans(dt){trans.t+=dt;var P=players[0];if(!P)return;
  if(trans.type===0){
    trans.progress+=dt*(0.008+trans.t*0.000003);if(trans.progress>=100){fadeTo("shop");return}
    var spd=2+trans.t*0.0005;
    for(var i=trans.entities.length-1;i>=0;i--){trans.entities[i].y+=spd;if(trans.entities[i].y>H+20)trans.entities.splice(i,1)}
    if(trans.t%Math.max(400,1200-trans.t*0.5)<dt)trans.entities.push({x:R(60,W-60),y:-20,w:R(60,120),h:14});

X.font="bold 9px monospace";if(!avail){X.fillStyle="#553333";X.fillText("TRANCADO",x+cw2/2,y+260)}else if(bClear[idx]){X.fillStyle="#4CAF50";X.fillText("REPLAY",x+cw2/2,y+260)}else{X.fillStyle="#2196F3";X.fillText("LUTAR!",x+cw2/2,y+260)}}}
X.textAlign="center";X.font="bold 11px monospace";X.fillStyle="#666";X.fillText("< > S | ^ v Boss | Enter | Esc",W/2,H-12);X.textAlign="left"}

function dHUD(){for(var pi=0;pi<players.length;pi++){var p=players[pi],ox=pi*(numPlayers>=2?200:0);X.fillStyle=p.id===0?"#4CAF50":"#2196F3";X.font="bold 9px monospace";X.fillText("P"+(p.id+1),16+ox,12);for(var i=0;i<p.mhp;i++){X.fillStyle=i<p.hp?"#E53935":"#333";X.font="bold 18px monospace";X.fillText("\u2665",16+ox+i*22,30)}if(!p.alive&&numPlayers>=2){X.fillStyle="#FF5252";X.font="bold 8px monospace";X.fillText("REV:"+Math.ceil((15000-p.deadT)/1000)+"s",16+ox,40)}var w=WPNS[p.equipped];X.fillStyle="rgba(0,0,0,0.5)";X.fillRect(6+ox,H-32,150,26);X.fillStyle=w.c;X.font="bold 9px monospace";X.fillText(w.n,10+ox,H-16)}var sec=Math.floor(fTime/1000),mn=Math.floor(sec/60);X.fillStyle=sec<240?"#4CAF50":"#E53935";X.font="bold 14px monospace";X.textAlign="right";X.fillText(mn+":"+String(sec%60).padStart(2,"0"),W-16,H-22);X.fillStyle="#FFD700";X.fillText(coins+"/15",W-16,24);X.textAlign="left"}

function dResult(){dBG();X.fillStyle="rgba(0,0,0,0.65)";X.fillRect(0,0,W,H);X.textAlign="center";X.font="bold 36px monospace";X.fillStyle="#4CAF50";X.fillText("BOSS DERROTADO!",W/2,78);X.font="bold 18px monospace";X.fillStyle="#FFD700";X.fillText(boss?boss.n:"",W/2,110);var by=140;X.font="bold 13px monospace";X.fillStyle="#FFF";X.textAlign="left";X.fillText("Moedas: +"+rN,W/2-140,by);var bc=bCoins[bossI]||0;X.fillStyle=(bc&1)?"#FFD700":"#444";X.fillText("Base: "+((bc&1)?"OK":"-"),W/2-140,by+25);X.fillStyle=(bc&2)?"#FFD700":"#444";X.fillText("NoHit: "+((bc&2)?"OK":"-"),W/2-140,by+45);X.fillStyle=(bc&4)?"#FFD700":"#444";X.fillText("Speed: "+((bc&4)?"OK":"-"),W/2-140,by+65);X.fillStyle="#888";X.font="bold 12px monospace";X.textAlign="center";X.fillText(Math.floor(fTime/60000)+":"+String(Math.floor(fTime/1000)%60).padStart(2,"0")+" Dano:"+fDmg,W/2,by+100);X.font="bold 18px monospace";X.fillStyle="#FFD700";X.fillText(coins+"/15",W/2,by+130);if(Math.sin(Date.now()*0.005)>0){X.font="bold 13px monospace";X.fillStyle="#FFF";X.fillText("ENTER:Proximo | ESC:Arsenal",W/2,by+170)}X.textAlign="left"}

function dOver(){dBG();X.fillStyle="rgba(0,0,0,0.6)";X.fillRect(0,0,W,H);X.textAlign="center";X.font="bold 46px monospace";X.fillStyle="#E53935";X.fillText("DERROTADO!",W/2,130);X.font="bold 14px monospace";X.fillStyle="#888";X.fillText("ENTER: Tentar | ESC: Menu",W/2,200);X.textAlign="left"}

function dVictory(){X.fillStyle="#0B0B1a";X.fillRect(0,0,W,H);X.textAlign="center";X.font="bold 48px monospace";X.fillStyle="#FFD700";X.fillText("VITORIA TOTAL!",W/2,105);X.font="bold 14px monospace";X.fillStyle="#888";X.fillText("ENTER: Jogar novamente",W/2,300);X.textAlign="left"}

function dOv(){X.fillStyle="rgba(0,0,0,0.65)";X.fillRect(0,0,W,H);var ip=overlay.opts[0]==="Continuar";X.font="bold 36px monospace";X.textAlign="center";X.fillStyle=ip?"#FFD700":"#E53935";X.fillText(ip?"PAUSADO":"MENU",W/2,120);for(var i=0;i<overlay.opts.length;i++){X.font="bold 18px monospace";X.fillStyle=i===ovSel?"#FFD700":"#555";X.fillText((i===ovSel?"> ":"   ")+overlay.opts[i],W/2,195+i*42)}X.font="bold 11px monospace";X.fillStyle="#444";X.fillText("W/S | Enter | ESC",W/2,H-25);X.textAlign="left"}

function startFight(){players=[];for(var i=0;i<numPlayers;i++)players.push(mkP(i));initBoss(bossI);fDmg=0;fTime=0;pB=[];eB=[];pts=[];tg=[]}

// MAIN LOOP
var lastT=0;
function frame(t){
var dt=Math.min(t-lastT,32);lastT=t;
if(fadeA>0.01)fadeA*=0.88;else fadeA=0;shake*=0.88;if(shake<0.3)shake=0;

if(state==="ctrlcfg"&&ctrlR){for(var k in just){if(just[k]){if(k!=="Escape"){CTRL[ctrlP][cActs[ctrlA]]=k;saveCtrl()}ctrlR=false;just[k]=false;break}}}
if(cs){uCS(dt);for(var k in just)just[k]=false;X.save();dBG();dCS();X.restore();if(fadeA>0.01){X.fillStyle="rgba(0,0,0,"+CL(fadeA,0,1)+")";X.fillRect(0,0,W,H)}requestAnimationFrame(frame);return}
if(overlay){if(jp("ArrowUp")||jp("KeyW"))ovSel=Math.max(0,ovSel-1);if(jp("ArrowDown")||jp("KeyS"))ovSel=Math.min(overlay.opts.length-1,ovSel+1);if(jp("Escape"))overlay=null;if(jp("Enter")){var opt=overlay.opts[ovSel];overlay=null;if(opt==="Continuar"){}else if(opt==="Tentar"){fadeTo("fight",startFight)}else if(opt==="Boss"){fadeTo("bsel",function(){secSel=BDATA[bossI]?BDATA[bossI].s:0;bsSel=SECS[secSel].bosses.indexOf(bossI)})}else if(opt==="Menu"){admin=false;netClean();localPID=0;fadeTo("title");shSel=0}}}
else if(state==="title"){var items=["JOGAR","CONTROLES"];if(jp("ArrowUp")||jp("KeyW"))shSel=Math.max(0,shSel-1);if(jp("ArrowDown")||jp("KeyS"))shSel=Math.min(items.length-1,shSel+1);if(jp("Enter")){if(shSel===0){saveSel=curSave>=0?curSave:0;loadSaves();fadeTo("savesel")}else{ctrlP=0;ctrlA=0;ctrlR=false;fadeTo("ctrlcfg")}}}
else if(state==="savesel"){if(jp("ArrowLeft")||jp("KeyA"))saveSel=Math.max(0,saveSel-1);if(jp("ArrowRight")||jp("KeyD"))saveSel=Math.min(2,saveSel+1);if(jp("Enter")){loadSave(saveSel);equipped=[0,0];modeSel=0;fadeTo("modeselect")}if(jp("Delete")||jp("Backspace")){if(saves[saveSel]){delSave(saveSel);loadSaves()}}if(jp("Escape"))fadeTo("title")}
else if(state==="modeselect"){var hp=hasPeer();var mI=["1P","2P LOCAL"];if(hp){mI.push("CRIAR SALA");mI.push("ENTRAR SALA")}mI.push("VOLTAR");if(jp("ArrowUp")||jp("KeyW"))modeSel=Math.max(0,modeSel-1);if(jp("ArrowDown")||jp("KeyS"))modeSel=Math.min(mI.length-1,modeSel+1);if(jp("Enter")){if(modeSel===0){numPlayers=1;netMode="local";localPID=0;if(firstPlay){firstPlay=false;startCS("cutscene_inicial","shop")}else fadeTo("shop")}else if(modeSel===1){numPlayers=2;netMode="local";localPID=0;if(firstPlay){firstPlay=false;startCS("cutscene_inicial","shop")}else fadeTo("shop")}else if(hp&&modeSel===2){lobbyType="host";lobbyStatus="";localPID=0;netCreate();fadeTo("lobby")}else if(hp&&modeSel===3){lobbyType="join";lobbyStatus="";lobbyDigs=[0,0,0,0];lobbyCur=0;fadeTo("lobby")}else{fadeTo("savesel")}}if(jp("Escape"))fadeTo("savesel")}
else if(state==="ctrlcfg"&&!ctrlR){if(jp("ArrowUp")||jp("KeyW"))ctrlA=Math.max(0,ctrlA-1);if(jp("ArrowDown")||jp("KeyS"))ctrlA=Math.min(cActs.length-1,ctrlA+1);if(jp("Tab"))ctrlP=1-ctrlP;if(jp("Enter"))ctrlR=true;if(jp("Escape"))fadeTo("title")}
else if(state==="lobby"){if(lobbyType==="join"){for(var d=0;d<=9;d++){if(jp("Digit"+d)){lobbyDigs[lobbyCur]=d;lobbyCur=Math.min(3,lobbyCur+1)}}if(jp("Backspace")&&lobbyCur>0){lobbyCur--;lobbyDigs[lobbyCur]=0}if(jp("Enter"))netJoin(""+lobbyDigs[0]+lobbyDigs[1]+lobbyDigs[2]+lobbyDigs[3])}if(jp("Escape")){netClean();localPID=0;fadeTo("modeselect")}}
else if(state==="shop"){if(jp("ArrowRight")||jp("KeyD"))shSel=Math.min(5,shSel+1);if(jp("ArrowLeft")||jp("KeyA"))shSel=Math.max(0,shSel-1);if(jp("ArrowDown")||jp("KeyS"))shSel=Math.min(5,shSel+3);if(jp("ArrowUp")||jp("KeyW"))shSel=Math.max(0,shSel-3);if(jp("Enter")){var w=WPNS[shSel];if(!w.own&&coins>=w.cost){coins-=w.cost;w.own=1;equipped[localPID]=shSel;saveGame()}else if(w.own)equipped[localPID]=shSel}if(jp("Space")){secSel=0;for(var s=0;s<SECS.length;s++){if(secOk(s)){var ac=true;for(var j=0;j<SECS[s].bosses.length;j++)if(!bClear[SECS[s].bosses[j]]){ac=false;break}if(!ac){secSel=s;break}}}bsSel=0;fadeTo("bsel")}if(jp("Escape")){shSel=0;fadeTo("modeselect")}}
else if(state==="bsel"){if(jp("ArrowLeft")||jp("KeyA")){var ns=secSel-1;if(ns>=0&&secOk(ns)){secSel=ns;bsSel=0}}if(jp("ArrowRight")||jp("KeyD")){var ns=secSel+1;if(ns<SECS.length&&secOk(ns)){secSel=ns;bsSel=0}}if(secOk(secSel)){var bosses=SECS[secSel].bosses;if(jp("ArrowUp")||jp("KeyW"))bsSel=Math.max(0,bsSel-1);if(jp("ArrowDown")||jp("KeyS"))bsSel=Math.min(bosses.length-1,bsSel+1);if(jp("Enter")){var idx=bosses[bsSel];if(bossOk(idx)){bossI=idx;fadeTo("fight",startFight)}}}if(jp("Escape"))fadeTo("shop")}
else if(state==="fight"){if(netMode==="host")mergeRI();if(netMode!=="client"){if(jp("Escape")){overlay={opts:["Continuar","Boss","Menu"]};ovSel=0}fTime+=dt;for(var j=0;j<players.length;j++)uP(players[j],dt);for(var j=0;j<players.length;j++)shootP(players[j]);uBoss(dt);uBul(dt);uTg(dt);uPts(dt);if(netMode==="host"){netSkip++;if(netSkip>=3){netSkip=0;netSendGS()}}}else{try{if(netConn)netConn.send({t:"inp",k:keys,eqW:players[localPID]?players[localPID].equipped:0})}catch(e){}uPts(dt)}}
else if(state==="trans"){if(netMode!=="client")uTrans(dt)}
else if(state==="result"){uPts(dt);if(netMode!=="client"){if(jp("Enter")||jp("Space")){var s=BDATA[bossI]?BDATA[bossI].s:0;secSel=s;bsSel=Math.min(SECS[s].bosses.indexOf(bossI)+1,SECS[s].bosses.length-1);fadeTo("bsel")}if(jp("Escape"))fadeTo("shop")}}
else if(state==="over"){if(netMode!=="client"){if(jp("Enter")||jp("Space"))fadeTo("fight",startFight);if(jp("Escape")){overlay={opts:["Tentar","Boss","Menu"]};ovSel=0}}}
else if(state==="victory"){if(jp("Enter")||jp("Space")){resetSave();netClean();localPID=0;saveGame();fadeTo("title")}}
for(var k in just)just[k]=false;

X.save();if(shake>1)X.translate(R(-shake,shake),R(-shake,shake));
if(state==="title")dTitle();
else if(state==="savesel")dSaveSel();
else if(state==="modeselect")dModeSel();
else if(state==="ctrlcfg")dCtrlCfg();
else if(state==="lobby")dLobby();
else if(state==="shop")dShop();
else if(state==="bsel")dBSel();
else if(state==="fight"){dBG();drawBoss();dTg();dBul();for(var j=0;j<players.length;j++)dP(players[j]);dPts();dHUD()}
else if(state==="trans")dTrans();
else if(state==="result")dResult();
else if(state==="over")dOver();
else if(state==="victory")dVictory();
X.restore();
if(overlay)dOv();
if(fadeA>0.01){X.fillStyle="rgba(0,0,0,"+CL(fadeA,0,1)+")";X.fillRect(0,0,W,H)}
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})()}catch(e){document.body.innerHTML="<pre style='color:#F00;background:#000;padding:20px;font-size:14px;line-height:1.4'>"+e.message+"\n\n"+e.stack+"</pre>"}
</script>
