<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dread Blade</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000}body{display:flex;justify-content:center;align-items:center}canvas{display:block;cursor:crosshair;touch-action:none}</style>
</head>
<body>
<canvas id="jogo"></canvas>
<script>
// ═══════════════════════════════════════
//  CONFIGURAÇÃO DOS PERSONAGENS
// ═══════════════════════════════════════
const PERSONAGENS={
  guerreiro:{nome:'Guerreiro',descricao:'Segure para combo de 3 golpes.',vidaMaxima:6,velocidade:185,dano:1,alcance:46,arco:Math.PI*0.82,cooldown:0.30,duracaoSwing:0.15,velAtaqueMult:0.55,chargeTime:0.5,comboMax:3,comboInterval:0.18,especialCarga:16,especialDuracao:5,especialMultDano:2,especialMultCooldown:0.45,tipoAtaque:'melee',cor:'#4a6fa5',corTrail:'#2a1848'},
  mago:{nome:'Mago',descricao:'Clique=energia. Segure=pancada no chão.',vidaMaxima:5,velocidade:170,dano:1,alcance:300,cooldown:0.45,velAtaqueMult:0.4,projetilVel:420,projetilRaio:6,projetilCor:'#60a0ff',chargeTime:0.6,chargeDano:0.5,chargeAlcance:70,chargeKb:650,duracaoSwing:0.30,tipoAtaque:'projetil',especialCarga:16,especialAlvos:3,especialStun:2.0,cor:'#4a2a7a',corTrail:'#1a1838'},
  assassino:{nome:'Assassino',descricao:'Clique=corte. Segure=combo.',vidaMaxima:5,velocidade:220,dano:2,alcance:30,arco:Math.PI*0.82,cooldown:0.25,duracaoSwing:0.12,velAtaqueMult:0.6,chargeTime:0.4,stabDano:3,comboInterval:0.20,especialCarga:12.8,especialMultDano:3,especialDuracao:5,especialVelMult:1.2,tipoAtaque:'melee',cor:'#2a2a34',corTrail:'#12121a'},
  barbaro:{nome:'Bárbaro',descricao:'Clique=machado. Segure=girar.',vidaMaxima:7,velocidade:150,dano:3,alcance:50,arco:Math.PI*0.82,cooldown:0.45,duracaoSwing:0.22,velAtaqueMult:0.4,chargeTime:1.5,spinDuracao:2.0,spinHitInterval:0.45,spinVelMult:0.5,chargeVelMult:0.6,tipoAtaque:'melee',especialCarga:16,especialEscudo:3,maxEscudo:6,escudoVelPerPt:6.667,escudoTamPerPt:0.04,cor:'#6a3020',corTrail:'#3a1808'},
  arqueiro:{nome:'Arqueiro',descricao:'Clique=flecha. Segure=rajada tripla.',vidaMaxima:5,velocidade:185,dano:0.8,alcance:350,cooldown:0.25,velAtaqueMult:0.7,projetilVel:500,projetilRaio:3,projetilCor:'#a0d860',chargeTime:0.7,chargeArrowCount:3,chargeSpread:0.25,especialCarga:16,especialDuracao:6,tipoAtaque:'projetil',cor:'#3a6a30',corTrail:'#1a2a10'}
};

// ═══════════════════════════════════════
//  CONSTANTES DO JOGO
// ═══════════════════════════════════════
const DASH_VEL=850,DASH_DUR=0.12,DASH_CD=0.65,DASH_TRAIL=5;
const INIMIGO_CONFIG={
  SLIME:{vida:3,velocidade:55,dano:1,raioHitbox:12,resistenciaKnockback:0.35,pontos:10,corParticula:'#4a8a3a',intervaloPulo:1.1,duracaoPulo:0.35,multPulo:3.2,moedas:[1,3]},
  ESQUELETO:{vida:4,velocidade:78,dano:1,raioHitbox:10,resistenciaKnockback:0.2,pontos:20,corParticula:'#d8d0c0',moedas:[2,4]},
  MORCEGO:{vida:2,velocidade:125,dano:1,raioHitbox:9,resistenciaKnockback:0.65,pontos:15,corParticula:'#6a3a7a',amplitudeErratica:0.9,frequenciaAsas:16,moedas:[1,3]}
};
const CHEFE_CONFIG={CAVALEIRO_NEGRO:{vida:28,velocidade:62,dano:2,raioHitbox:20,resistenciaKnockback:0.04,pontos:250,corParticula:'#5a2a3a',duracaoPreparando:2.0,duracaoAtacando:0.35,duracaoRecuperacao:1.5,raioSmash:55,danoSmash:3,moedas:[15,25]}};
const ROCHA_BASE=0.6,ROCHA_ESP=0.9,ROCHA_QTD=7,ROCHA_R=30,ROCHA_DANO=2,ROCHA_QUEDA=0.35;
const SALAS_CONFIG=[
  {nome:'Portão de Entrada',waves:[[{tipo:'SLIME',quantidade:3}],[{tipo:'SLIME',quantidade:2},{tipo:'ESQUELETO',quantidade:1}]]},
  {nome:'Corredor Esquecido',waves:[[{tipo:'ESQUELETO',quantidade:3}],[{tipo:'MORCEGO',quantidade:3},{tipo:'SLIME',quantidade:2}]]},
  {nome:'Câmara dos Ecos',waves:[[{tipo:'MORCEGO',quantidade:4}],[{tipo:'ESQUELETO',quantidade:2},{tipo:'MORCEGO',quantidade:3}],[{tipo:'SLIME',quantidade:3},{tipo:'ESQUELETO',quantidade:3}]]},
  {nome:'Salão do Trono Negro',chefe:true,waves:[[{tipo:'CAVALEIRO_NEGRO',quantidade:1,chefe:true}]]}
];
const SALAO={tabelaX:220,tabelaY:250,tabelaL:360,tabelaA:80,npcs:[{tipo:'guerreiro',x:240,y:360},{tipo:'assassino',x:300,y:210},{tipo:'arqueiro',x:400,y:185},{tipo:'mago',x:500,y:210},{tipo:'barbaro',x:560,y:360}],spawnX:400,spawnY:460,interRaio:60,upgX:140,upgY:300,upgRaio:55};
const CFUNDO='#0c1018',CCA='#171f2d',CCB='#131a27',CPB='#283548',CPT='#3a4f68',CPORTA='#c8a040',TTILE=32;
const HITLAG=0.045,TREM_F=4.5,TREM_D=0.14,CAM_LERP=9,FLASH_D=0.1,MAX_P=250;
const SL=800,SA=600,SP=24,PL=60;
const MOEDA_VEL=350,MOEDA_MAGNET=100,MOEDA_RAIO=5;
const UPGRADE_CUSTOS=[0,15,35,60,100];
const ESP2_CONFIG={
  guerreiro:{nome:'Tornado',carga:40,duracao:4},
  mago:{nome:'Tempestade',carga:45,duracao:5},
  assassino:{nome:'Clone das Sombras',carga:40,duracao:30},
  barbaro:{nome:'Terremoto',carga:35},
  arqueiro:{nome:'Chuva de Flechas',carga:40,duracao:5,nivelReq:3,arrowInterval:0.22,arrowCount:10}
};

// ═══════════════════════════════════════
//  SETUP CANVAS
// ═══════════════════════════════════════
const canvas=document.getElementById('jogo'),ctx=canvas.getContext('2d');
canvas.width=SL;canvas.height=SA;
function redim(){const rJ=SL/SA,rT=innerWidth/innerHeight,s=rT>rJ?innerHeight/SA:innerWidth/SL;canvas.style.width=SL*s+'px';canvas.style.height=SA*s+'px';}
addEventListener('resize',redim);redim();

// ═══════════════════════════════════════
//  UTILITÁRIOS
// ═══════════════════════════════════════
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function dst(a,b,c,d){return Math.sqrt((c-a)**2+(d-b)**2);}
function normAng(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+0.999));}
function rAr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

// ═══════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════
const kl={},cl={};let mx=SL/2,my=0,mAct=false;
addEventListener('keydown',e=>{if(!kl[e.code])cl[e.code]=true;kl[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{kl[e.code]=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mousemove',e=>{mAct=true;const r=canvas.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*SL;my=(e.clientY-r.top)/r.height*SA;});
canvas.addEventListener('mousedown',e=>{if(!e.button){kl.Mouse0=true;cl.Mouse0=true;}if(e.button===2){kl.Mouse2=true;cl.Mouse2=true;}});
canvas.addEventListener('mouseup',e=>{if(!e.button)kl.Mouse0=false;if(e.button===2)kl.Mouse2=false;});
function kp(c){return!!kl[c];}
function ck(c){return!!cl[c];}
function lc(){for(const k in cl)delete cl[k];}

// ═══════════════════════════════════════
//  ESTADO DO JOGO
// ═══════════════════════════════════════
let eJogo='menu',score=0,hitT=0,fadeA=1,sI=0,wI=0,eSala='trans',tTrans=0,tNome=0,npcPerto=null,upgradePerto=false;
let moedasJogador=0;
const moedasEnt=[],niveis={guerreiro:1,mago:1,assassino:1,barbaro:1,arqueiro:1};
const ini=[],part=[],rochas=[],proj=[],raios=[],rachaduras=[],sombras=[];
let esp2Carga=0,esp2Ativo=false,esp2Timer=0;
const cam={x:SL/2,y:SA/2,ox:0,oy:0,skT:0,skD:0,skF:0};
const J={x:SALAO.spawnX,y:SALAO.spawnY,dx:0,dy:0,angEsp:-Math.PI/2,vida:6,atkT:0,atkCD:0,invT:0,stunT:0,kbX:0,kbY:0,anim:0,mov:false,atSet:null,vivo:true,pTipo:'guerreiro',
  attacking:false,espCarga:0,espAtivo:false,espTimer:0,invis:false,proxAtkMult:1,escudo:0,
  charging:false,chargeTimer:0,spinning:false,spinT:0,spinAng:0,spinHT:0,
  comboActive:false,comboIndex:0,comboTimer:0,comboTypes:null,dmgMult:1,narrowArc:false,
  shockwaveT:0,esp2SubT:0,
  dashCD:0,dashT:0,dashDX:0,dashDY:0,dashTr:[]};

function cfg(){const b=PERSONAGENS[J.pTipo],lv=niveis[J.pTipo];return{...b,vidaMaxima:b.vidaMaxima+(lv>=2?1:0)+(lv>=4?1:0),velocidade:b.velocidade+(lv>=2?5:0)+(lv>=4?10:0),dano:b.dano+(lv>=2?0.2:0)+(lv>=4?0.3:0)};}
function baseVel(){let v=cfg().velocidade;if(J.pTipo==='barbaro')v-=J.escudo*(cfg().escudoVelPerPt||0);if(J.invis&&J.pTipo==='assassino')v*=cfg().especialVelMult;return Math.max(60,v);}
function nivelReq(t){const c=ESP2_CONFIG[t];return c?(c.nivelReq||5):5;}

// ═══════════════════════════════════════
//  PARTÍCULAS
// ═══════════════════════════════════════
function cP(x,y,q,c){for(let i=0;i<q&&part.length<MAX_P;i++){const a=rand(0,6.283),v=rand(c.vMin||40,c.vMax||130),vd=rand(c.vidaMin||0.2,c.vidaMax||0.45);part.push({x:x+rand(-2,2),y:y+rand(-2,2),vx:Math.cos(a)*v,vy:Math.sin(a)*v,vida:vd,vidaM:vd,cor:c.cor||'#fff',t:rand(c.tMin||2,c.tMax||4),fr:c.fric||0.93,gv:c.grav||0});}}
function uP(dt){for(let i=part.length-1;i>=0;i--){const p=part[i];p.vy+=p.gv*dt;p.vx*=p.fr;p.vy*=p.fr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vida-=dt;if(p.vida<=0)part.splice(i,1);}}
function dP(){for(const p of part){const al=clamp(p.vida/p.vidaM,0,1),s=p.t*al;ctx.globalAlpha=al;ctx.fillStyle=p.cor;ctx.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),Math.ceil(s),Math.ceil(s));}ctx.globalAlpha=1;}

// ═══════════════════════════════════════
//  MOEDAS
// ═══════════════════════════════════════
function spawnMoedas(x,y,qtd){for(let i=0;i<qtd;i++)moedasEnt.push({x:x+rand(-12,12),y:y+rand(-12,12),vx:rand(-90,90),vy:rand(-130,-50),vida:6,grav:220,magnet:false,anim:rand(0,10)});}
function uMoedas(dt){
  for(let i=moedasEnt.length-1;i>=0;i--){
    const m=moedasEnt[i];m.anim+=dt;m.vida-=dt;
    if(m.vida<=0){moedasEnt.splice(i,1);continue;}
    if(!m.magnet&&dst(m.x,m.y,J.x,J.y)<MOEDA_MAGNET&&J.vivo)m.magnet=true;
    if(m.magnet){
      const a=Math.atan2(J.y-m.y,J.x-m.x),d=dst(m.x,m.y,J.x,J.y),spd=Math.min(MOEDA_VEL,MOEDA_VEL*(1-d/200)+80);
      m.vx=Math.cos(a)*spd;m.vy=Math.sin(a)*spd;m.grav=0;
      if(d<12){moedasJogador++;moedasEnt.splice(i,1);continue;}
    }else{m.vy+=m.grav*dt;m.vx*=0.96;m.vy*=0.96;}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    const bnd=SP+MOEDA_RAIO;m.x=clamp(m.x,bnd,SL-bnd);m.y=clamp(m.y,bnd,SA-bnd);
    if(!m.magnet&&m.y>SA-bnd){m.y=SA-bnd;m.vy*=-0.4;m.vx*=0.7;}
  }
}
function dMoedas(){
  for(const m of moedasEnt){
    const bn=Math.sin(m.anim*6)*1.5;
    ctx.save();ctx.translate(Math.round(m.x),Math.round(m.y+bn));
    ctx.globalAlpha=clamp(m.vida<1?m.vida:1,0,1);
    ctx.fillStyle='#d4a843';ctx.beginPath();ctx.arc(0,0,MOEDA_RAIO,0,6.283);ctx.fill();
    ctx.fillStyle='#a08020';ctx.beginPath();ctx.arc(0,0,MOEDA_RAIO*0.5,0,6.283);ctx.fill();
    ctx.globalAlpha=0.3;
    const gr=ctx.createRadialGradient(0,0,0,0,0,MOEDA_RAIO*2);
    gr.addColorStop(0,'#d4a843');gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,MOEDA_RAIO*2,0,6.283);ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════════
//  RACHADURAS (mago)
// ═══════════════════════════════════════
function addRachaduras(ox,oy,qtd){
  for(let i=0;i<qtd;i++){
    const ang=rand(0,Math.PI*2),pts=[{x:ox,y:oy}];let cx=ox,cy=oy;
    for(let j=0,segs=randInt(3,6);j<segs;j++){const a=ang+rand(-0.5,0.5),d=rand(15,30);cx+=Math.cos(a)*d;cy+=Math.sin(a)*d;pts.push({x:cx,y:cy});}
    rachaduras.push({pts,vida:2.5,vidaM:2.5});
  }
}
function uRachaduras(dt){for(let i=rachaduras.length-1;i>=0;i--){rachaduras[i].vida-=dt;if(rachaduras[i].vida<=0)rachaduras.splice(i,1);}}
function dRachaduras(){for(const r of rachaduras){const al=clamp(r.vida/r.vidaM,0,1);ctx.save();ctx.globalAlpha=al*0.5;ctx.strokeStyle='#5a4a3a';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(r.pts[0].x,r.pts[0].y);for(let i=1;i<r.pts.length;i++)ctx.lineTo(r.pts[i].x,r.pts[i].y);ctx.stroke();ctx.restore();}}

// ═══════════════════════════════════════
//  SOMBRA (Assassino Esp2)
// ═══════════════════════════════════════
function spawnSombra(){sombras.length=0;sombras.push({x:J.x,y:J.y,timer:ESP2_CONFIG.assassino.duracao,dano:cfg().dano,atkCD:0,anim:0,raio:10});cP(J.x,J.y,12,{cor:'#4a0a4a',vMin:50,vMax:150,vidaMin:0.2,vidaMax:0.5,tMin:1,tMax:3});}
function uSombras(dt){
  for(let i=sombras.length-1;i>=0;i--){
    const s=sombras[i];s.timer-=dt;s.anim+=dt;s.atkCD=Math.max(0,s.atkCD-dt);
    if(s.timer<=0){sombras.splice(i,1);continue;}
    let near=null,nd=Infinity;
    for(const e of ini){const d=dst(s.x,s.y,e.x,e.y);if(d<nd){near=e;nd=d;}}
    if(near&&J.vivo){
      const a=Math.atan2(near.y-s.y,near.x-s.x);s.x+=Math.cos(a)*200*dt;s.y+=Math.sin(a)*200*dt;
      if(nd<35+s.raio&&s.atkCD<=0){near.vida-=s.dano;near.flash=FLASH_D;const kf=220*(1-near.kbR);near.kbX=Math.cos(a)*kf;near.kbY=Math.sin(a)*kf;s.atkCD=0.35;cP(near.x,near.y,5,{cor:'#4a0a4a',vMin:40,vMax:100,vidaMin:0.1,vidaMax:0.3});}
    }else{const a=Math.atan2(J.y-s.y,J.x-s.x);s.x+=Math.cos(a)*80*dt;s.y+=Math.sin(a)*80*dt;}
    const bnd=SP+s.raio;s.x=clamp(s.x,bnd,SL-bnd);s.y=clamp(s.y,bnd,SA-bnd);
  }
}
function dSombraSprite(s){
  ctx.save();ctx.translate(Math.round(s.x),Math.round(s.y));
  ctx.globalAlpha=0.5+Math.sin(s.anim*6)*0.1;
  const bob=Math.sin(s.anim*13)*1.5;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,15,10,5,0,0,6.283);ctx.fill();
  ctx.fillStyle='#1a0a2a';ctx.fillRect(-9,-5+bob,18,19);
  ctx.fillStyle='#2a0a3a';ctx.fillRect(-7,-3+bob,14,8);
  ctx.fillStyle='#1a0a2a';ctx.beginPath();ctx.arc(0,-10+bob,9,0,6.283);ctx.fill();
  ctx.fillStyle='#ff2020';ctx.fillRect(-3,-11+bob,2.5,1.5);ctx.fillRect(1.5,-11+bob,2.5,1.5);
  ctx.globalAlpha=0.12+Math.sin(s.anim*5)*0.05;
  const gr=ctx.createRadialGradient(0,0,5,0,0,25);gr.addColorStop(0,'#4a0a4a');gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,25,0,6.283);ctx.fill();
  ctx.globalAlpha=0.6;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(-12,-30,24,3);
  ctx.fillStyle='#8a2a8a';ctx.fillRect(-12,-30,24*(s.timer/ESP2_CONFIG.assassino.duracao),3);
  ctx.restore();
}

// ═══════════════════════════════════════
//  CÂMERA
// ═══════════════════════════════════════
function uCam(dt){cam.x+=(J.x-cam.x)*CAM_LERP*dt;cam.y+=(J.y-cam.y)*CAM_LERP*dt;if(cam.skT>0){cam.skT-=dt;const f=cam.skF*(cam.skT/cam.skD);cam.ox=(Math.random()-0.5)*2*f;cam.oy=(Math.random()-0.5)*2*f;}else{cam.ox=0;cam.oy=0;}}
function aCam(){ctx.translate(Math.round(cam.ox),Math.round(cam.oy));}
function trem(f,d){cam.skF=f||TREM_F;cam.skD=d||TREM_D;cam.skT=cam.skD;}

// ═══════════════════════════════════════
//  PROJÉTEIS
// ═══════════════════════════════════════
function uProj(dt){
  for(let i=proj.length-1;i>=0;i--){
    const p=proj[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.dist+=Math.sqrt(p.vx*p.vx+p.vy*p.vy)*dt;
    if(p.dist>=p.distM){proj.splice(i,1);continue;}
    const m=SP+p.r;
    if(p.x<m||p.x>SL-m||p.y<m||p.y>SA-m){cP(p.x,p.y,3,{cor:p.cor,vMin:20,vMax:50,vidaMin:0.1,vidaMax:0.2});proj.splice(i,1);continue;}
    if(p.isArrow&&Math.random()<0.4)cP(p.x,p.y,1,{cor:p.cor,vMin:5,vMax:15,vidaMin:0.04,vidaMax:0.12,tMin:1,tMax:2,fric:0.95});
    let hit=false;
    for(const e of ini){
      if(p.atSet.has(e))continue;
      if(dst(p.x,p.y,e.x,e.y)<p.r+e.raio){
        p.atSet.add(e);e.vida-=p.dano;e.flash=FLASH_D;
        const ka=Math.atan2(e.y-J.y,e.x-J.x),kf=260*(1-e.kbR);e.kbX=Math.cos(ka)*kf;e.kbY=Math.sin(ka)*kf;
        cP(e.x,e.y,6,{cor:p.cor,vMin:40,vMax:110,vidaMin:0.1,vidaMax:0.3});
        if(p.elemento&&e.status){
          switch(p.elemento){case'freeze':e.status.freeze=Math.max(e.status.freeze,3);break;case'fire':e.status.fire=Math.max(e.status.fire,3);break;case'poison':e.status.poison=Math.max(e.status.poison,5);break;}
          const eC=p.elemento==='freeze'?'#60c0ff':p.elemento==='fire'?'#ff6020':'#40ff40';
          cP(e.x,e.y,6,{cor:eC,vMin:30,vMax:80,vidaMin:0.1,vidaMax:0.3});
        }
        hitT=HITLAG*0.5;proj.splice(i,1);hit=true;break;
      }
    }

function dEntidades(){const lista=[];if(J.vivo)lista.push({t:'j',y:J.y});for(const e of ini)lista.push({t:'i',y:e.y,r:e});for(const s of sombras)lista.push({t:'s',y:s.y,r:s});lista.sort((a,b)=>a.y-b.y);for(const ent of lista){if(ent.t==='j')dJogSprite();else if(ent.t==='i')dIniSprite(ent.r);else if(ent.t==='s')dSombraSprite(ent.r);}}
function dDashTrail(){if(!J.dashTr.length)return;for(let i=0;i<J.dashTr.length;i++){const t=J.dashTr[i],al=((i+1)/(J.dashTr.length+1))*0.35;ctx.save();ctx.translate(Math.round(t.x),Math.round(t.y));ctx.globalAlpha=al;ctx.fillStyle=cfg().corTrail;rAr(-10,-7,20,20,3);ctx.fill();ctx.beginPath();ctx.arc(0,-11,9,0,6.283);ctx.fill();ctx.restore();}}

function cCorpoMago(bob,dash){ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(0,15,11,5,0,0,6.283);ctx.fill();ctx.fillStyle=dash?'#1a1838':'#4a2a7a';ctx.beginPath();ctx.moveTo(-9,-4+bob);ctx.lineTo(9,-4+bob);ctx.lineTo(13,14+bob);ctx.lineTo(-13,14+bob);ctx.closePath();ctx.fill();ctx.fillStyle=dash?'#221848':'#5a3a8a';ctx.fillRect(-7,-2+bob,14,8);ctx.fillStyle=dash?'#181430':'#3a1a5a';ctx.fillRect(-12,-1+bob,4,9);ctx.fillRect(8,-1+bob,4,9);ctx.fillStyle='#6a4a1a';ctx.fillRect(-8,6+bob,16,2);ctx.fillStyle=dash?'#221848':'#6a4a9a';ctx.beginPath();ctx.arc(0,-10+bob,8,0,6.283);ctx.fill();ctx.fillStyle=dash?'#1a1438':'#5a3a8a';ctx.beginPath();ctx.moveTo(-7,-10+bob);ctx.lineTo(0,-32+bob);ctx.lineTo(7,-10+bob);ctx.closePath();ctx.fill();ctx.fillStyle=dash?'#161030':'#4a2a7a';ctx.beginPath();ctx.ellipse(0,-10+bob,10,3,0,0,6.283);ctx.fill();ctx.fillStyle='#c0f0ff';ctx.fillRect(-3,-12+bob,2,2);ctx.fillRect(2,-12+bob,2,2);}

  switch(e.tipo){case'SLIME':dSlime(e,f);break;case'ESQUELETO':dEsq(e,f);break;case'MORCEGO':dMorcego(e,f);break;case'CAVALEIRO_NEGRO':dBoss(e,f);break;}if(e.vida<e.vidaMax)dBV(e);if(e.stunT>0){ctx.font='12px monospace';ctx.textAlign='center';ctx.fillStyle='#ff0';ctx.fillText('★',0,-e.raio-18);}ctx.restore();}
function dSlime(e,fl){const bn=Math.sin(e.anim*4.5)*2.5,sq=1+Math.sin(e.anim*4.5)*0.09;ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(0,11,11,4,0,0,6.283);ctx.fill();ctx.fillStyle=fl?'#fff':'#4a8a3a';ctx.beginPath();ctx.ellipse(0,bn,12*sq,10/sq,0,0,6.283);ctx.fill();if(!fl){const ao=Math.atan2(J.y-e.y,J.x-e.x);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-2+bn,3.2,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(4,-2+bn,3.2,0,6.283);ctx.fill();ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(-4+Math.cos(ao)*1.5,-2+bn+Math.sin(ao)*1.5,1.6,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(4+Math.cos(ao)*1.5,-2+bn+Math.sin(ao)*1.5,1.6,0,6.283);ctx.fill();}}
function dEsq(e,fl){const bn=Math.sin(e.anim*6.5)*1.5,c=fl?'#fff':'#e8e0d0';ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(0,13,9,4,0,0,6.283);ctx.fill();ctx.fillStyle=c;ctx.fillRect(-9,0+bn,3.5,9);ctx.fillRect(5.5,0+bn,3.5,9);ctx.fillRect(-5.5,-3+bn,11,14);ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-7+bn,7.5,0,6.283);ctx.fill();if(!fl){ctx.fillStyle='#cc3030';ctx.beginPath();ctx.arc(-3,-8+bn,1.1,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(3,-8+bn,1.1,0,6.283);ctx.fill();}}
function dMorcego(e,fl){const wf=Math.sin(e.anim*e.freqA)*0.65,ca=fl?'#fff':'#7a5a8a';ctx.fillStyle=ca;ctx.save();ctx.rotate(wf);ctx.beginPath();ctx.ellipse(-11,-1,11,5.5,-0.3,0,6.283);ctx.fill();ctx.restore();ctx.save();ctx.rotate(-wf);ctx.beginPath();ctx.ellipse(11,-1,11,5.5,0.3,0,6.283);ctx.fill();ctx.restore();ctx.fillStyle=fl?'#fff':'#5a3a6a';ctx.beginPath();ctx.arc(0,0,6.5,0,6.283);ctx.fill();if(!fl){ctx.fillStyle='#ff4040';ctx.beginPath();ctx.arc(-2.2,-2,1.8,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(2.2,-2,1.8,0,6.283);ctx.fill();}}
function dBoss(e,fl){const c1=fl?'#fff':'#22223a',c2=fl?'#eee':'#3a2a4a',cO=fl?'#fff':'#cc2222';if(!fl){ctx.save();let aA=0.12+Math.sin(e.anim*3)*0.04;if(e.est==='preparando'){const u=1-e.tEst/e.dPrep;aA=0.15+u*0.2+Math.sin(e.anim*(8+u*15))*0.08;}ctx.globalAlpha=aA;const gr=ctx.createRadialGradient(0,0,8,0,0,38);gr.addColorStop(0,'#cc2222');gr.addColorStop(1,'transparent');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,38,0,6.283);ctx.fill();ctx.restore();}ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(0,22,20,7,0,0,6.283);ctx.fill();ctx.fillStyle=c1;ctx.fillRect(-18,-4,6,16);ctx.fillRect(12,-4,6,16);rAr(-15,-10,30,30,4);ctx.fill();ctx.fillStyle=c2;rAr(-11,-6,22,8,2);ctx.fill();ctx.fillStyle='#1a1a2a';ctx.fillRect(-12,10,24,3);ctx.fillStyle=c1;ctx.beginPath();ctx.arc(0,-17,13,0,6.283);ctx.fill();ctx.fillStyle=cO;ctx.fillRect(-6,-19,4,3.5);ctx.fillRect(2,-19,4,3.5);if(e.est==='preparando'&&!fl){const u=1-e.tEst/e.dPrep;ctx.save();ctx.globalAlpha=0.15+u*0.25+Math.sin(e.anim*12)*0.1;ctx.strokeStyle='#ff3030';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,20,e.rSmash,0,6.283);ctx.stroke();ctx.restore();}let aE;switch(e.est){case'perseguindo':aE=Math.sin(e.anim*2)*0.25;break;case'preparando':aE=-0.5+Math.sin(e.anim*(8+(1-e.tEst/e.dPrep)*20))*(0.1+(1-e.tEst/e.dPrep)*0.25);break;case'atacando':aE=-0.5+(1-e.smT/e.dAtk)*2.2;break;case'recuperacao':aE=1.7+Math.sin(e.anim*4)*0.03;break;}ctx.save();ctx.rotate(aE);ctx.fillStyle=fl?'#fff':(e.est==='preparando'?'#8a1818':'#7a1818');ctx.fillRect(-2.5,-54,5,38);ctx.beginPath();ctx.moveTo(-2.5,-54);ctx.lineTo(0,-60);ctx.lineTo(2.5,-54);ctx.fill();ctx.fillStyle='#2a2a2a';ctx.fillRect(-9,-18,18,4.5);ctx.restore();}
function dBV(e){const w=e.chefe?56:20,h=e.chefe?5:3,y=-e.raio-12;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-w/2,y,w,h);const prop=e.vida/e.vidaMax;ctx.fillStyle=prop>0.5?'#4a4':prop>0.25?'#aa4':'#a44';ctx.fillRect(-w/2,y,w*prop,h);}

// ═══════════════════════════════════════
//  UI
// ═══════════════════════════════════════
function dUI(){dVida();dMoedasUI();dBarraEsp();dBarraEsp2();dDashUI();dInfoPersonagem();dEscudoUI();if(eJogo==='jogando'){dInfoOnda();dNomeSala();dIndSaida();if(eSala==='trans')dTransicao();dBarraChefe();}if(eJogo==='gameover')dGameOver();if(eJogo==='vitoria')dVitoria();}
function dVida(){const c=cfg(),pul=J.vida<=2?Math.sin(Date.now()*0.006)*0.15:0;for(let i=0;i<c.vidaMaxima;i++){const x=18+i*20,y=18,cheio=i<J.vida;ctx.save();if(cheio&&J.vida<=2){const sc=1+pul;ctx.translate(x+7,y+7);ctx.scale(sc,sc);ctx.translate(-(x+7),-(y+7));}dCoracao(x,y,14,cheio);ctx.restore();}ctx.font='12px monospace';ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillText('Score: '+score,18,46);}
function dCoracao(x,y,tam,cheio){ctx.save();ctx.translate(x,y);const s=tam/12;ctx.scale(s,s);ctx.fillStyle=cheio?'#e84040':'#2a1818';ctx.beginPath();ctx.arc(-3,-3.5,4.8,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(3,-3.5,4.8,0,6.283);ctx.fill();ctx.beginPath();ctx.moveTo(-7.8,-1);ctx.lineTo(0,9.5);ctx.lineTo(7.8,-1);ctx.fill();ctx.restore();}
function dMoedasUI(){const x=160,y=34;ctx.fillStyle='#d4a843';ctx.beginPath();ctx.arc(x,y,5,0,6.283);ctx.fill();ctx.fillStyle='#a08020';ctx.beginPath();ctx.arc(x,y,2.5,0,6.283);ctx.fill();ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.fillStyle='#d4a843';ctx.fillText(moedasJogador,x+10,y+4);}
function dBarraEsp(){const c=cfg(),x=18,y=52,w=120,h=8,prop=J.espCarga/c.especialCarga,cheio=prop>=1;ctx.fillStyle='rgba(0,0,0,0.4)';rAr(x-1,y-1,w+2,h+2,3);ctx.fill();ctx.fillStyle='#1a1a1a';rAr(x,y,w,h,2);ctx.fill();const gr=ctx.createLinearGradient(x,y,x+w*prop,y);if(cheio){gr.addColorStop(0,'#f0c020');gr.addColorStop(1,'#e8a010');}else{gr.addColorStop(0,'#4a6a90');gr.addColorStop(1,'#3a5570');}ctx.fillStyle=gr;rAr(x,y,Math.max(4,w*prop),h,2);ctx.fill();if(cheio){ctx.save();ctx.globalAlpha=0.25+Math.sin(Date.now()*0.008)*0.15;ctx.fillStyle='#fff';rAr(x,y,w,h,2);ctx.fill();ctx.restore();}if(J.espAtivo){ctx.fillStyle='rgba(0,0,0,0.3)';rAr(x,y,w,h,2);ctx.fill();ctx.fillStyle=J.pTipo==='arqueiro'?'#60ff60':'#f0c020';rAr(x,y,Math.max(4,w*(J.espTimer/c.especialDuracao)),h,2);ctx.fill();}if(J.invis){ctx.fillStyle='rgba(0,0,0,0.3)';rAr(x,y,w,h,2);ctx.fill();ctx.fillStyle='#8888cc';rAr(x,y,Math.max(4,w*(J.espTimer/c.especialDuracao)),h,2);ctx.fill();}ctx.font='10px monospace';ctx.textAlign='left';ctx.fillStyle=cheio?'#f0c020':'rgba(255,255,255,0.3)';ctx.fillText(J.espAtivo?(J.pTipo==='arqueiro'?'ELEMENTAL':'ESPECIAL!'):J.invis?'INVISÍVEL':cheio?'[MOUSE2] ESP1':'ESP1',x,y+h+12);}
function dBarraEsp2(){const esp2c=ESP2_CONFIG[J.pTipo];if(!esp2c)return;const nr=esp2c.nivelReq||5;if(niveis[J.pTipo]<nr)return;const x=18,y=82,w=120,h=8,prop=esp2Carga/esp2c.carga,cheio=prop>=1;ctx.fillStyle='rgba(0,0,0,0.4)';rAr(x-1,y-1,w+2,h+2,3);ctx.fill();ctx.fillStyle='#1a1a1a';rAr(x,y,w,h,2);ctx.fill();const gr=ctx.createLinearGradient(x,y,x+w*Math.min(1,prop),y);if(cheio){gr.addColorStop(0,'#ff4040');gr.addColorStop(1,'#cc2020');}else{gr.addColorStop(0,'#6a3a3a');gr.addColorStop(1,'#4a2a2a');}ctx.fillStyle=gr;rAr(x,y,Math.max(4,w*Math.min(1,prop)),h,2);ctx.fill();if(cheio){ctx.save();ctx.globalAlpha=0.25+Math.sin(Date.now()*0.008)*0.15;ctx.fillStyle='#ff4040';rAr(x,y,w,h,2);ctx.fill();ctx.restore();}if(esp2Ativo&&esp2c.duracao){ctx.fillStyle='rgba(0,0,0,0.3)';rAr(x,y,w,h,2);ctx.fill();ctx.fillStyle='#ff6060';rAr(x,y,Math.max(4,w*(esp2Timer/esp2c.duracao)),h,2);ctx.fill();}ctx.font='10px monospace';ctx.textAlign='left';ctx.fillStyle=cheio?'#ff4040':'rgba(255,255,255,0.3)';ctx.fillText(esp2Ativo?esp2c.nome.toUpperCase():(cheio?'[SHIFT] ESP2':'ESP2'),x,y+h+12);}
function dDashUI(){const pronto=J.dashCD<=0&&J.dashT<=0,x=18,y=108;ctx.font='10px monospace';ctx.textAlign='left';if(pronto){ctx.fillStyle='#8ac4ff';ctx.fillText('DASH [SPACE]',x,y);}else{const prop=1-J.dashCD/DASH_CD;ctx.fillStyle='rgba(138,196,255,0.3)';ctx.fillText('DASH',x,y);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x+34,y-7,50,8);ctx.fillStyle='#4a7aaa';ctx.fillRect(x+34,y-7,50*prop,8);}}
function dInfoPersonagem(){const c=cfg();ctx.font='bold 11px monospace';ctx.textAlign='right';ctx.fillStyle='rgba(200,180,120,0.5)';ctx.fillText(c.nome+' Nv.'+niveis[J.pTipo],SL-18,28);}
function dEscudoUI(){if(!J.escudo||J.pTipo!=='barbaro')return;for(let i=0;i<cfg().maxEscudo;i++){const x=18+i*14,y=122;ctx.fillStyle=i<J.escudo?'#4488ff':'#1a1a30';ctx.beginPath();ctx.arc(x+5,y,5,0,6.283);ctx.fill();}}
function dInfoOnda(){const s=sRef();ctx.font='13px monospace';ctx.textAlign='right';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('Wave '+(wI+1)+'/'+s.waves.length,SL-18,46);if(ini.length>0){ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillText(ini.length+' restantes',SL-18,64);}}
function dNomeSala(){if(tNome<=0)return;let al;if(tNome>2.7)al=(3.2-tNome)/0.5;else if(tNome>0.5)al=1;else al=tNome/0.5;ctx.save();ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillStyle='rgba(190,170,110,'+clamp(al,0,1)+')';ctx.fillText(sRef().nome,SL/2,80);ctx.restore();}
function dTransicao(){if(tTrans<=0)return;const al=clamp(tTrans/0.6,0,1);ctx.save();ctx.fillStyle='rgba(0,0,0,'+al*0.35+')';ctx.fillRect(0,SA/2-40,SL,80);ctx.font='bold 30px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,'+al+')';ctx.fillText('Wave '+(wI+1),SL/2,SA/2);if(sRef().chefe&&wI===sRef().waves.length-1){ctx.font='bold 16px monospace';ctx.fillStyle='rgba(200,60,60,'+al+')';ctx.fillText('— CHEFE —',SL/2,SA/2+28);}ctx.restore();}
function dIndSaida(){if(eSala!=='completa')return;const bn=Math.sin(Date.now()*0.005)*5,sx=SL/2,sy=SA-SP-25+bn;ctx.fillStyle=CPORTA;ctx.beginPath();ctx.moveTo(sx,sy+10);ctx.lineTo(sx-9,sy);ctx.lineTo(sx+9,sy);ctx.fill();ctx.font='11px monospace';ctx.textAlign='center';ctx.fillStyle='rgba(200,160,60,0.6)';ctx.fillText('Saída',sx,sy-8);}
function dBarraChefe(){const ch=ini.find(i=>i.chefe);if(!ch)return;const w=320,h=14,x=(SL-w)/2,y=SA-46;ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#1a0a0a';ctx.fillRect(x,y,w,h);const gr=ctx.createLinearGradient(x,y,x+w*(ch.vida/ch.vidaMax),y);gr.addColorStop(0,'#cc2222');gr.addColorStop(1,'#881111');ctx.fillStyle=gr;ctx.fillRect(x,y,w*(ch.vida/ch.vidaMax),h);ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillStyle='#cc4444';ctx.fillText('Cavaleiro Negro',SL/2,y-6);}
function dGameOver(){ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,SL,SA);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 46px monospace';ctx.fillStyle='#c83030';ctx.fillText('FIM DE JOGO',SL/2,SA/2-35);ctx.font='16px monospace';ctx.fillStyle='#888';ctx.fillText('Pontuação: '+score+' | Moedas: '+moedasJogador,SL/2,SA/2+15);ctx.fillStyle='#666';ctx.fillText('Pressione R para reiniciar',SL/2,SA/2+45);}
function dVitoria(){ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,SL,SA);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 46px monospace';ctx.fillStyle='#d4a843';ctx.fillText('VITÓRIA!',SL/2,SA/2-35);ctx.font='16px monospace';ctx.fillStyle='#aaa';ctx.fillText('Pontuação: '+score+' | Moedas: '+moedasJogador,SL/2,SA/2+15);ctx.fillStyle='#666';ctx.fillText('Pressione R para jogar novamente',SL/2,SA/2+45);}
function dMenu(){ctx.fillStyle='#080c14';ctx.fillRect(0,0,SL,SA);dP();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 52px monospace';ctx.fillStyle='#c8a030';ctx.fillText('DREAD BLADE',SL/2,SA/2-80);ctx.font='16px monospace';ctx.fillStyle='#8a7020';ctx.fillText('Escolha seu guerreiro. Sobreviva à masmorra.',SL/2,SA/2-35);ctx.fillStyle='#a0a8b4';ctx.fillRect(SL/2-1.5,SA/2+5,3,45);ctx.fillStyle='#d4a843';ctx.fillRect(SL/2-7,SA/2+3,14,4);ctx.font='15px monospace';ctx.fillStyle='#777';ctx.fillText('Pressione ESPAÇO para começar',SL/2,SA/2+80);}

// ═══════════════════════════════════════
//  RESETAR — FUNÇÃO ÚNICA E COMPLETA
// ═══════════════════════════════════════
function resetar(){
  sI=0;wI=0;eSala='trans';tTrans=2;tNome=3.2;score=0;hitT=0;fadeA=1;
  ini.length=0;part.length=0;rochas.length=0;proj.length=0;raios.length=0;rachaduras.length=0;sombras.length=0;moedasEnt.length=0;
  J.pTipo='guerreiro';J.x=SALAO.spawnX;J.y=SALAO.spawnY;J.dx=0;J.dy=0;J.angEsp=-Math.PI/2;
  J.vida=PERSONAGENS.guerreiro.vidaMaxima;
  J.atkT=0;J.atkCD=0;J.attacking=false;J.invT=0;J.stunT=0;
  J.kbX=0;J.kbY=0;J.anim=0;J.atSet=null;J.vivo=true;
  J.espCarga=0;J.espAtivo=false;J.espTimer=0;J.invis=false;J.proxAtkMult=1;J.escudo=0;
  J.charging=false;J.chargeTimer=0;J.spinning=false;J.spinT=0;J.spinAng=0;J.spinHT=0;
  J.comboActive=false;J.comboIndex=0;J.comboTimer=0;J.comboTypes=null;
  J.dmgMult=1;J.narrowArc=false;J.shockwaveT=0;J.esp2SubT=0;
  J.dashCD=0;J.dashT=0;J.dashDX=0;J.dashDY=0;J.dashTr=[];
  esp2Carga=0;esp2Ativo=false;esp2Timer=0;moedasJogador=0;
  for(const k in niveis)niveis[k]=1;
  cam.x=J.x;cam.y=J.y;cam.ox=0;cam.oy=0;cam.skT=0;
  npcPerto=null;upgradePerto=false;eJogo='selecao';
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
let uT=0;
function gameLoop(ts){const dt=Math.min((ts-uT)/1000,0.05);uT=ts;atualizar(dt);render();lc();requestAnimationFrame(gameLoop);}

function atualizar(dt){
  fadeA=Math.max(0,fadeA-dt*2.2);
  switch(eJogo){
    case'menu':uP(dt);uMoedas(dt);if(Math.random()<0.15)cP(rand(100,SL-100),rand(100,SA-100),1,{cor:'#c8a030',vMin:5,vMax:20,vidaMin:0.8,vidaMax:2,tMin:1,tMax:3,fric:0.99});if(ck('Space')||ck('Enter'))resetar();break;
    case'selecao':uJogador(dt);uProj(dt);uP(dt);uMoedas(dt);uCam(dt);uNPCs();if(dst(J.x,J.y,SL/2,SA-SP/2)<38)iniDungeon();break;
    case'jogando':if(hitT>0){hitT-=dt;break;}uJogador(dt);uIni(dt);uProj(dt);uRaios(dt);uRochas(dt);uRachaduras(dt);uSombras(dt);uP(dt);uMoedas(dt);uCam(dt);colEspada();uOndas(dt);if(!J.vivo)eJogo='gameover';break;
    case'gameover':uP(dt);uMoedas(dt);if(ck('KeyR'))resetar();break;
    case'vitoria':uP(dt);uMoedas(dt);if(ck('KeyR'))eJogo='menu';break;
  }
}

function render(){
  ctx.clearRect(0,0,SL,SA);
  if(eJogo==='menu'){dMenu();return;}
  ctx.save();aCam();dAmbiente();
  if(eJogo==='selecao'){dMesa();dNPCs();dUpgradeStation();}
  dEntidades();dProj();dRaios();dRochas();dRachaduras();dMoedas();dP();
  ctx.restore();
  dUI();
  if(eJogo==='selecao'){dPainelNPC();dUpgradePanel();}
  if(fadeA>0){ctx.fillStyle='rgba(8,12,20,'+clamp(fadeA,0,1)+')';ctx.fillRect(0,0,SL,SA);}
}
requestAnimationFrame(gameLoop);
</script>
