<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ember</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Georgia',serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
canvas{display:block;max-width:100vw;max-height:100vh;cursor:pointer;border-radius:4px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800;
const H = 500;
canvas.width = W;
canvas.height = H;

function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioStarted = false;
function ensureAudio() { if (!audioStarted) { audioCtx.resume(); audioStarted = true; } }

function playTone(freq, duration, type = 'sine', vol = 0.08, glideTo = null) {
    ensureAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
}

function playFireCrackle(duration = 0.3) {
    ensureAudio();
    const t = audioCtx.currentTime;
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        const envelope = 1 - (i / bufferSize);
        data[i] = (Math.random() * 2 - 1) * envelope * 0.06;
        if (i > 1) data[i] = data[i] * 0.5 + data[i - 1] * 0.5;
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 800 + Math.random() * 2000;
    filter.Q.value = 0.5;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    source.start(t);
}

function playWhoosh() {
    ensureAudio();
    const t = audioCtx.currentTime;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.25);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        const envelope = Math.sin((i / bufferSize) * Math.PI);
        data[i] = (Math.random() * 2 - 1) * envelope * 0.04;
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300, t);
    filter.frequency.linearRampToValueAtTime(1200, t + 0.25);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.07, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    source.start(t);
}

function playIgnite() {
    playTone(220, 0.15, 'triangle', 0.1, 440);
    playTone(330, 0.2, 'sine', 0.06, 660);
    playFireCrackle(0.4);
    setTimeout(() => playFireCrackle(0.35), 100);
}

function playLowHeat() {
    playTone(80, 0.5, 'sine', 0.04);
    setTimeout(() => playTone(90, 0.4, 'sine', 0.03), 300);
}

function playGameOver() {
    playTone(180, 0.3, 'triangle', 0.08, 60);
    setTimeout(() => playTone(120, 0.6, 'sine', 0.06, 40), 200);
}

function playScoreTick() {
    playTone(880, 0.08, 'sine', 0.04);
}

const STATE = { MENU: 'menu', PLAYING: 'playing', GAMEOVER: 'gameover' };
let gameState = STATE.MENU;
let score = 0;
let bestScore = parseInt(localStorage.getItem('emberBest') || '0');
let distanceTraveled = 0;
let heatSourcesFound = 0;
let comboCount = 0;
let comboTimer = 0;
let screenShake = 0;
let transitionAlpha = 0;
let transitionTarget = 0;

const player = {
    x: 180,
    y: H * 0.5,
    vx: 0,
    vy: 0,
    heat: 1.0,
    maxHeat: 1.0,
    glowPulse: 0,
    trailTimer: 0,
    alive: true,
    radius: 5
};

const world = {
    scrollX: 0,
    scrollSpeed: 60,
    baseSpeed: 60,
    maxSpeed: 160,
    terrainPoints: [],
    heatSources: [],
    particles: [],
    fireflies: [],
    clouds: [],
    stars: [],
    windForce: 0,
    windTarget: 0,
    windChangeTimer: 0,
    gustTimer: 0,
    gustStrength: 0,
    thermalZones: [],
    beaconX: 8000,
    beaconVisible: false,
    beaconAlpha: 0
};

function generateStarField() {
    world.stars = [];
    for (let i = 0; i < 120; i++) {
        world.stars.push({
            x: Math.random() * W,
            y: Math.random() * H * 0.7,
            brightness: 0.2 + Math.random() * 0.8,
            twinkle: Math.random() * Math.PI * 2,
            twinkleSpeed: 1 + Math.random() * 3
        });
    }
}

function generateTerrain() {
    world.terrainPoints = [];
    const totalLength = world.beaconX + 2000;
    const step = 25;
    const points = Math.floor(totalLength / step);
    let height = H * 0.58;
    for (let i = 0; i < points; i++) {
        const x = i * step;
        const progress = x / totalLength;
        const baseH = H * 0.55 + Math.sin(x * 0.003) * 30 + Math.sin(x * 0.007 + 1) * 25 + Math.sin(x * 0.015 + 3) * 18;
        const variation = Math.sin(x * 0.04) * 8 + Math.sin(x * 0.09) * 5 + Math.sin(x * 0.02 + 2) * 10;
        const cliff = progress > 0.65 ? Math.max(0, (progress - 0.65) * 120) : 0;
        height = baseH + variation - cliff;
        height = Math.max(H * 0.35, Math.min(H * 0.72, height));
        world.terrainPoints.push({ x, y: height });
    }
}

function getGroundY(worldX) {
    const pts = world.terrainPoints;
    if (pts.length === 0) return H * 0.6;
    const step = 25;
    const idx = Math.floor(worldX / step);
    if (idx < 0) return pts[0].y;
    if (idx >= pts.length - 1) return pts[pts.length - 1].y;
    const t = (worldX - pts[idx].x) / step;
    return pts[idx].y + (pts[idx + 1].y - pts[idx].y) * t;
}

function generateHeatSources() {
    world.heatSources = [];
    const totalLength = world.beaconX + 2000;
    const count = 60;
    const positions = [];
    for (let i = 0; i < count; i++) {
        const frac = i / count;
        const x = 400 + frac * totalLength * 0.85 + (Math.random() - 0.5) * 200;
        positions.push(x);
    }
    positions.sort((a, b) => a - b);
    const minSpacing = 90;
    const filtered = [positions[0]];
    for (let i = 1; i < positions.length; i++) {
        if (positions[i] - filtered[filtered.length - 1] >= minSpacing) {
            filtered.push(positions[i]);
        }
    }
    for (const wx of filtered) {
        const gy = getGroundY(wx);
        const typeRand = Math.random();
        let type, yOffset, size;
        if (typeRand < 0.55) {
            type = 'campfire';
            yOffset = -12;
            size = 14 + Math.random() * 10;
        } else if (typeRand < 0.8) {
            type = 'lantern';
            yOffset = -40 - Math.random() * 60;
            size = 8 + Math.random() * 6;
        } else if (typeRand < 0.93) {
            type = 'torch';
            yOffset = -20 - Math.random() * 30;
            size = 6 + Math.random() * 8;
        } else {
            type = 'bonfire';
            yOffset = -8;
            size = 22 + Math.random() * 14;
        }
        world.heatSources.push({
            x: wx,
            y: gy + yOffset,
            type: type,
            size: size,
            heatValue: type === 'bonfire' ? 0.55 : type === 'campfire' ? 0.32 : type === 'lantern' ? 0.22 : 0.18,
            collected: false,
            pulsePhase: Math.random() * Math.PI * 2
        });
    }
}

function generateThermalZones() {
    world.thermalZones = [];
    const totalLength = world.beaconX + 2000;
    for (let i = 0; i < 35; i++) {
        world.thermalZones.push({
            x: 500 + Math.random() * totalLength * 0.9,
            width: 60 + Math.random() * 160,
            strength: 0.6 + Math.random() * 1.4,
            y: H * 0.1 + Math.random() * H * 0.5
        });
    }
    world.thermalZones.sort((a, b) => a.x - b.x);
}

function generateClouds() {
    world.clouds = [];
    const totalLength = world.beaconX + 2000;
    for (let i = 0; i < 40; i++) {
        world.clouds.push({
            x: Math.random() * totalLength,
            y: 20 + Math.random() * H * 0.45,
            width: 40 + Math.random() * 100,
            alpha: 0.06 + Math.random() * 0.1,
            speed: 8 + Math.random() * 20
        });
    }
}

function generateFireflies() {
    world.fireflies = [];
    const totalLength = world.beaconX + 2000;
    for (let i = 0; i < 50; i++) {
        world.fireflies.push({
            x: Math.random() * totalLength,
            y: H * 0.15 + Math.random() * H * 0.65,
            phase: Math.random() * Math.PI * 2,
            speed: 0.02 + Math.random() * 0.06,
            amplitude: 15 + Math.random() * 40,
            alpha: 0
        });
    }
}

function resetGame() {
    player.x = 180;
    player.y = H * 0.45;
    player.vx = 0;
    player.vy = 0;
    player.heat = 1.0;
    player.maxHeat = 1.0;
    player.glowPulse = 0;
    player.trailTimer = 0;
    player.alive = true;
    world.scrollX = 0;
    world.scrollSpeed = world.baseSpeed;
    world.particles = [];
    world.windForce = 0;
    world.windTarget = 0;
    world.windChangeTimer = 0;
    world.gustTimer = 0;
    world.gustStrength = 0;
    world.beaconAlpha = 0;
    score = 0;
    distanceTraveled = 0;
    heatSourcesFound = 0;
    comboCount = 0;
    comboTimer = 0;
    screenShake = 0;
    transitionAlpha = 0;
    transitionTarget = 0;
    generateTerrain();
    generateHeatSources();
    generateThermalZones();
    generateClouds();
    generateFireflies();
    generateStarField();
    for (const hs of world.heatSources) hs.collected = false;
}

function spawnParticles(x, y, count, color, spread, life, sizeRange, upwardBias) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * spread);
        world.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * spd + (upwardBias ? (Math.random() - 0.5) * 20 : 0),
            vy: Math.sin(angle) * spd - (upwardBias ? Math.random() * 60 + 20 : 0),
            life: life * (0.5 + Math.random() * 0.5),
            maxLife: life,
            size: sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]),
            color: color,
            gravity: upwardBias ? -15 : 30
        });
    }
}

function updateParticles(dt) {
    for (let i = world.particles.length - 1; i >= 0; i--) {
        const p = world.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.gravity * dt;
        p.life -= dt;
        if (p.life <= 0) world.particles.splice(i, 1);
    }
}

function getThermalStrength(wx, wy) {
    for (const tz of world.thermalZones) {
        const dx = wx - tz.x;
        if (Math.abs(dx) < tz.width * 0.5 && wy > tz.y - 50 && wy < tz.y + 80) {
            const falloff = 1 - Math.abs(dx) / (tz.width * 0.5);
            return tz.strength * Math.max(0, falloff);
        }
    }
    return 0;
}

function update(dt) {
    if (gameState !== STATE.PLAYING) return;
    if (!player.alive) return;
    dt = Math.min(dt, 0.1);

    distanceTraveled += world.scrollSpeed * dt;
    const difficultyProgress = Math.min(1.0, distanceTraveled / world.beaconX);
    world.scrollSpeed = world.baseSpeed + difficultyProgress * (world.maxSpeed - world.baseSpeed);
    player.maxHeat = 1.0 - difficultyProgress * 0.25;
    if (player.heat > player.maxHeat) player.heat = player.maxHeat;

    world.scrollX += world.scrollSpeed * dt;
    player.x = 180;

    world.windChangeTimer -= dt;
    if (world.windChangeTimer <= 0) {
        world.windTarget = (Math.random() - 0.5) * 50;
        world.windChangeTimer = 3 + Math.random() * 6;
    }
    world.windForce += (world.windTarget - world.windForce) * dt * 0.7;

    world.gustTimer -= dt;
    if (world.gustTimer <= 0) {
        if (Math.random() < 0.3) {
            world.gustStrength = (Math.random() - 0.5) * 120;
            world.gustTimer = 0.6 + Math.random() * 1.5;
        } else {
            world.gustStrength = 0;
            world.gustTimer = 2 + Math.random() * 5;
        }
    }
    let gustEase = 1;
    if (world.gustTimer < 0.3) gustEase = world.gustTimer / 0.3;
    if (world.gustTimer > 1.2 && world.gustStrength !== 0) gustEase = Math.max(0, (1.5 - world.gustTimer) / 0.3);

    const thermalStr = getThermalStrength(world.scrollX + player.x, player.y);
    const windEffect = world.windForce + world.gustStrength * gustEase;

    const inputUp = inputActive;
    const liftForce = inputUp ? 220 : 0;
    const thermalLift = thermalStr * 180;

    player.vy += (liftForce + thermalLift - 50) * dt;
    player.vy += windEffect * dt * 0.3;
    player.vy *= Math.pow(0.92, dt * 60);
    player.vx += windEffect * dt * 0.5;
    player.vx *= Math.pow(0.90, dt * 60);

    player.y += player.vy * dt;
    player.x += player.vx * dt;

    player.x = Math.max(30, Math.min(W - 30, player.x));
    player.y = Math.max(20, Math.min(H - 20, player.y));

    const groundY = getGroundY(world.scrollX + player.x);
    if (player.y > groundY - 8) {
        player.y = groundY - 8;
        player.vy = Math.min(player.vy, -20);
        if (player.vy > 30) {
            spawnParticles(player.x, player.y, 5, '#ff9944', 30, 0.4, [1, 3], true);
            screenShake = Math.max(screenShake, 3);
        }
    }

    player.heat -= (0.028 + difficultyProgress * 0.02) * dt;
    if (inputUp) player.heat -= 0.012 * dt;

    const playerWX = world.scrollX + player.x;
    const playerWY = player.y;

    for (const hs of world.heatSources) {
        if (hs.collected) continue;
        const dx = playerWX - hs.x;
        const dy = playerWY - hs.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const collectRadius = hs.size + 14;
        if (dist < collectRadius) {
            hs.collected = true;
            player.heat = Math.min(player.maxHeat, player.heat + hs.heatValue);
            heatSourcesFound++;
            comboCount++;
            comboTimer = 2.5;
            const bonusPoints = Math.floor(hs.heatValue * 100 * (1 + comboCount * 0.5));
            score += bonusPoints;
            spawnParticles(player.x, player.y, 25, '#ffcc66', 80, 0.7, [2, 6], true);
            spawnParticles(player.x, player.y, 12, '#ffffff', 60, 0.4, [1, 3], true);
            screenShake = Math.max(screenShake, 4 + comboCount);
            playIgnite();
            if (comboCount > 1 && comboCount % 5 === 0) {
                playTone(660 + comboCount * 20, 0.25, 'sine', 0.07, 880);
            }
        }
    }

    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;

    if (player.heat <= 0) {
        player.heat = 0;
        player.alive = false;
        spawnParticles(player.x, player.y, 40, '#884422', 100, 1.2, [2, 8], true);
        spawnParticles(player.x, player.y, 20, '#331100', 70, 0.9, [3, 10], true);
        screenShake = 8;
        playGameOver();
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem
