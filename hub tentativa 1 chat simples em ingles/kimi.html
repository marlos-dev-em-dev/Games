<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RESONANT FRACTURE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
html,body {
  background:#020202;
  color:#e0f0f0;
  font-family:'Courier New', Courier, monospace;
  overflow:hidden;
  width:100%; height:100%;
}
canvas {
  display:block;
  position:absolute;
  top:0; left:0;
}
/* CRT overlay */
#crt {
  position:fixed; inset:0; pointer-events:none; z-index:10;
  background:
    linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
    linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.02), rgba(0,0,255,0.04));
  background-size: 100% 2px, 3px 100%;
  box-shadow: inset 0 0 120px rgba(0,0,0,0.9);
}
.ui-layer {
  position:absolute; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.75);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.ui-layer.active { opacity:1; pointer-events:auto; }
h1 { font-size:3.8rem; text-shadow:0 0 25px #0ff, 0 0 5px #0ff; letter-spacing:.25em; margin-bottom:.2em; text-align:center; }
h2 { font-size:2rem; color:#0ff; text-shadow:0 0 15px #0ff; margin-bottom:1rem; letter-spacing:.15em; }
button {
  background:transparent; border:2px solid #0ff; color:#0ff;
  padding:14px 42px; font-family:inherit; font-size:1.15rem; cursor:pointer; margin:.5rem;
  text-transform:uppercase; transition:.2s;
}
button:hover:not(:disabled) { background:#0ff; color:#000; box-shadow:0 0 25px #0ff; }
button:disabled { border-color:#555; color:#555; cursor:default; }
.tuning-grid { display:flex; gap:18px; margin:18px 0; flex-wrap:wrap; justify-content:center; }
.tuning-card {
  border:1px solid #0aa; padding:16px; width:220px; cursor:pointer;
  transition:.2s; text-align:center;
}
.tuning-card:hover:not(.locked) { border-color:#0ff; box-shadow:0 0 15px rgba(0,255,255,.3); transform:translateY(-2px); }
.tuning-card.selected { background:rgba(0,255,255,.12); border-color:#0ff; }
.tuning-card.locked { border-color:#333; color:#666; cursor:default; filter:grayscale(1); }
.tuning-card .t-name { font-size:1.05rem; font-weight:bold; color:#0ff; margin-bottom:6px; }
.tuning-card .t-desc { font-size:.8rem; color:#aaa; }
.shop-grid { display:flex; gap:20px; margin:20px; flex-wrap:wrap; justify-content:center; }
.shop-card {
  border:1px solid #555; padding:18px; width:240px; text-align:center; background:rgba(0,0,0,.5);
}
.shop-card .s-name { color:#f0f; font-weight:bold; margin-bottom:6px; text-shadow:0 0 8px #f0f; }
.shop-card .s-desc { color:#bbb; font-size:.85rem; margin-bottom:10px; }
.shop-card .s-cost { color:#0ff; margin-bottom:10px; }
.meta-text { color:#777; font-size:.85rem; margin-top:12px; max-width:600px; text-align:center; line-height:1.5; }
.log-entry { color:#888; font-style:italic; font-size:.9rem; margin-top:8px; }
#hud { position:absolute; inset:0; z-index:5; pointer-events:none; display:none; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="crt"></div>

<div id="hud">
  <!-- canvas draws the HUD -->
</div>

<div id="menuOverlay" class="ui-layer active">
  <h1>RESONANT FRACTURE</h1>
  <p style="color:#0aa; margin-bottom:18px; font-size:.95rem; letter-spacing:.15em;">YOU ARE THE ECHO. THEY ARE THE BULLET.</p>
  <div class="tuning-grid" id="tuningBox"></div>
  <button onclick="startGame()">INITIATE RUN</button>
  <p class="meta-text">WASD to thrust • MOUSE to aim • LMB to place ECHO • SPACE to DETONATE oldest echo</p>
  <p class="meta-text" id="metaDisplay"></p>
</div>

<div id="shopOverlay" class="ui-layer">
  <h2>∎ REPHASE ∎</h2>
  <p style="color:#aaa; margin-bottom:10px;">RESONANCE: <span id="shopMoney" style="color:#0ff;"></span></p>
  <div class="shop-grid" id="shopGrid"></div>
  <button onclick="closeShop(false)">SKIP (+10 HP)</button>
</div>

<div id="gameOverOverlay" class="ui-layer">
  <h2>SIGNAL LOST</h2>
  <p style="font-size:1.2rem; margin:10px;">WAVE REACHED: <span id="endWave" style="color:#0ff; font-size:1.5rem;"></span></p>
  <p style="font-size:1rem; margin:10px; color:#888;">DATA CACHE GAINED: <span id="endData" style="color:#f0f;"></span></p>
  <button onclick="returnToMenu()">RETURN TO VOID</button>
</div>

<div id="victoryOverlay" class="ui-layer">
  <h2>RESONANCE ACHIEVED</h2>
  <p class="meta-text">The fracture speaks. You have become its grammar.</p>
  <p class="log-entry" id="victoryLog"></p>
  <p style="font-size:1rem; margin:10px; color:#888;">DATA CACHE: <span id="vicData" style="color:#f0f;"></span></p>
  <button onclick="returnToMenu()">RETURN</button>
</div>

<script>
/* ============================================================
   RESONANT FRACTURE
   A single-file momentum arena game.
   ============================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

/* ---------- STORAGE ---------- */
const LS = {
  get:(k,v)=>{ const d=localStorage.getItem('rf_'+k); return d!==null?JSON.parse(d):v; },
  set:(k,v)=>localStorage.setItem('rf_'+k,JSON.stringify(v))
};
let bestWave = LS.get('bestWave',0);
let totalAnomalies = LS.get('totalAnomalies',0);
let anomaliesFound = new Set(LS.get('anomaliesSet',[]));
let metaMoney = LS.get('metaMoney',0);

/* ---------- AUDIO ---------- */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio(){ if(!audioCtx){ audioCtx=new AudioCtx(); } if(audioCtx.state==='suspended') audioCtx.resume(); }
function sfx(type){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  if(type==='place'){
    o.type='sawtooth'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(110,t+0.12);
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.12);
    o.start(t); o.stop(t+0.12);
  } else if(type==='absorb'){
    o.type='sine'; o.frequency.setValueAtTime(700,t); o.frequency.linearRampToValueAtTime(1300,t+0.04);
    g.gain.setValueAtTime(0.08,t); g.gain.linearRampToValueAtTime(0.01,t+0.04);
    o.start(t); o.stop(t+0.04);
  } else if(type==='explode'){
    o.type='square'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(30,t+0.35);
    g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.35);
    f.type='lowpass'; f.frequency.setValueAtTime(1200,t); f.frequency.linearRampToValueAtTime(100,t+0.35);
    o.start(t); o.stop(t+0.35);
  } else if(type==='hit'){
    o.type='sine'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(40,t+0.14);
    g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.14);
    o.start(t); o.stop(t+0.14);
  } else if(type==='pickup'){
    o.type='triangle'; o.frequency.setValueAtTime(330,t); o.frequency.linearRampToValueAtTime(880,t+0.12);
    g.gain.setValueAtTime(0.15,t); g.gain.linearRampToValueAtTime(0.01,t+0.12);
    o.start(t); o.stop(t+0.12);
  } else if(type==='deny'){
    o.type='sawtooth'; o.frequency.setValueAtTime(100,t); o.frequency.linearRampToValueAtTime(60,t+0.15);
    g.gain.setValueAtTime(0.15,t); g.gain.linearRampToValueAtTime(0.01,t+0.15);
    o.start(t); o.stop(t+0.15);
  }
}

/* ---------- INPUT ---------- */
const keys = {};
const mouse = {x:0,y:0,down:false};
window.addEventListener('keydown',e=>{ keys[e.code]=true; ensureAudio(); });
window.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
window.addEventListener('mousedown',()=>mouse.down=true);
window.addEventListener('mouseup',()=>mouse.down=false);

/* ---------- UTILS ---------- */
let RID=0;
const rand=(a,b)=>Math.random()*(b-a)+a;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
function bound(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

/* ---------- STATE ---------- */
let state = 'MENU'; // MENU PLAYING SHOP GAMEOVER VICTORY
let entities = {enemies:[], bullets:[], ghosts:[], items:[], particles:[], texts:[]};
let player, wave=1, maxWave=8, waveClearTimer=0, anomalySpawned=false;
let runMoney=0, runAnomalies=0;
let shake=0, hitstop=0, slowmo=0;
let ghostTimeBonus=0, ghostPullMult=1;
let chainReaction=false, overclockMult=2, vampEcho=false;
let selectedTuning='resonant';

/* ---------- CLASSES ---------- */
class Particle{
  constructor(x,y,vx,vy,life,color,sz){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.life=life; this.maxLife=life; this.color=color; this.sz=sz; this.dead=false;
  }
  update(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt; this.life-=dt;
    if(this.life<=0) this.dead=true;
  }
  draw(ctx){
    ctx.globalAlpha = Math.max(0,this.life/this.maxLife);
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.sz*ctx.globalAlpha,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
}

class FloatingText{
  constructor(x,y,text,color){
    this.x=x; this.y=y; this.text=text; this.color=color; this.life=1.0; this.dead=false; this.vy=-30;
  }
  update(dt){ this.y+=this.vy*dt; this.life-=dt; if(this.life<=0) this.dead=true; }
  draw(ctx){
    ctx.globalAlpha=this.life;
    ctx.fillStyle=this.color; ctx.font='bold 14px Courier New'; ctx.textAlign='center';
    ctx.fillText(this.text,this.x,this.y);
    ctx.globalAlpha=1;
  }
}

class Bullet{
  constructor(x,y,vx,vy,dmg,enemy=true,color){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.dmg=dmg; this.enemy=enemy; this.color=color||'#fff'; this.r=3.5; this.dead=false;
    this.trail=[]; this.age=0;
  }
  update(dt){
    this.age+=dt;
    this.trail.push({x:this.x,y:this.y}); if(this.trail.length>8) this.trail.shift();
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.dead=true;
  }
  draw(ctx){
    ctx.strokeStyle=this.color; ctx.lineWidth=2;
    ctx.beginPath(); for(let i=0;i<this.trail.length;i++){ const p=this.trail[i]; if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
    ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
  }
}

class Ghost{
  constructor(x,y,aimAngle){
    this.x=x; this.y=y; this.dead=false;
    this.r=12; this.charge=0; this.maxCharge=15;
    this.life=(3.0+ghostTimeBonus)*(player.ghostLifeMult||1);
    this.maxLife=this.life;
    this.state='forming'; this.explodeTimer=0;
    const speed = (player.ghostDrift===false)?0:90;
    this.vx=Math.cos(aimAngle)*speed; this.vy=Math.sin(aimAngle)*speed;
    this.formTime=0.18;
    this.over=false;
  }
  update(dt){
    if(this.state==='forming'){
      this.x+=this.vx*dt; this.y+=this.vy*dt; this.formTime-=dt;
      if(this.formTime<=0) this.state='active';
    } else if(this.state==='active'){
      this.life-=dt;
      if(this.life<=0) this.explode();
      // pull bullets
      for(let b of entities.bullets){
        if(b.dead||!b.enemy) continue;
        const d=dist(this,b);
        if(d<this.r+160*ghostPullMult){
          const a=angle(b,this);
          const pull=220*ghostPullMult;
          b.vx+=Math.cos(a)*pull*dt; b.vy+=Math.sin(a)*pull*dt;
        }
        if(d<this.r+b.r+2){
          b.dead=true; this.charge++; this.r+=0.6; this.life+=0.06; sfx('absorb');
          if(this.charge>=this.maxCharge) this.over=true;
        }
      }
      // void pull enemies
      if(player.voidPull){
        for(let e of entities.enemies){
          if(e.dead||e.type==='boss') continue;
          const d=dist(this,e);
          if(d<this.r+180){
            const a=angle(e,this);
            e.x+=Math.cos(a)*50*dt; e.y+=Math.sin(a)*50*dt;
          }
        }
      }
    } else if(this.state==='exploding'){
      this.explodeTimer+=dt; if(this.explodeTimer>0.15) this.dead=true;
    }
  }
  explode(){
    if(this.state==='exploding') return;
    this.state='exploding'; this.explodeTimer=0;
    let dmg=22+this.charge*9; let rad=this.r*2.4+this.charge*3.2;
    if(this.over) dmg*=overclockMult;
    let healAmt=0;
    for(let e of entities.enemies){
      if(e.dead) continue; const d=dist(this,e);
      if(d<rad+e.r){
        const falloff=1-bound(d/(rad+e.r),0,1);
        const ed=Math.floor(dmg*falloff);
        e.takeDamage(ed); healAmt+=ed;
        if(chainReaction){
          // boost nearby ghosts
          for(let g of entities.ghosts) if(g!==this && !g.dead && g.state==='active' && dist(g,this)<rad){ g.charge+=1; g.life+=0.2; }
        }
      }
    }
    if(vampEcho){ player.hp=Math.min(player.hp+healAmt*0.05, player.maxHp); }
    shake=Math.min(shake+dmg*0.25, 18);
    for(let i=0;i<18;i++){
      const a=rand(0,Math.PI*2), s=rand(80,250);
      entities.particles.push(new Particle(this.x,this.y,Math.cos(a)*s,Math.sin(a)*s,rand(0.3,0.8),this.over?'#ff00ff':'#00ffff',rand(2,5)));
    }
    sfx('explode');
  }
  draw(ctx){
    if(this.state==='exploding'){
      ctx.globalAlpha=1-this.explodeTimer/0.15;
      ctx.fillStyle=this.over?'#ff00ff':'#00ffff';
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r*(1+this.explodeTimer*14),0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; return;
    }
    const flick=Math.sin(performance.now()*0.02)*0.1;
    const r=this.over?255:0, g=this.over?50:200+Math.floor((this.charge/this.maxCharge)*55), b=this.over?255:255;
    ctx.shadowBlur=18; ctx.shadowColor=`rgb(${r},${g},${b})`;
    ctx.strokeStyle=`rgb(${r},${g},${b})`; ctx.lineWidth=2;
    ctx.beginPath();
    const sides=6, t=performance.now()*0.003;
    for(let i=0;i<=sides;i++){
      const a=(Math.PI*2/sides)*i + t;
      const rr=this.r*(0.85+flick) + (i%2?3:0);
      const px=this.x+Math.cos(a)*rr, py=this.y+Math.sin(a)*rr;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
    // inner fill by charge
    ctx.globalAlpha=0.2+(this.charge/this.maxCharge)*0.4;
    ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fill(); ctx.globalAlpha=1;
    // charge arc
    if(this.charge>0){ ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.5,-Math.PI/2,-Math.PI/2+(Math.PI*2)*(this.charge/this.maxCharge)); ctx.stroke(); }
    // pulse ring
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r+6+Math.sin(performance.now()*0.015)*4,0,Math.PI*2); ctx.strokeStyle=`rgba(${r},${g},${b},0.25)`; ctx.lineWidth=1; ctx.stroke();
    ctx.shadowBlur=0;
  }
}

class Item{
  constructor(x,y,type,val){
    this.x=x; this.y=y; this.type=type; // 'money'|'anomaly'
    this.val=val; this.r=7; this.dead=false; this.age=0;
    this.vx=rand(-20,20); this.vy=rand(-20,20);
  }
  update(dt){
    this.age+=dt;
    this.vx*=0.96; this.vy*=0.96;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    const d=dist(this,player);
    if(d<180){ const a=angle(this,player); this.vx+=Math.cos(a)*260*dt; this.vy+=Math.sin(a)*260*dt; }
    if(d<player.r+this.r){
      this.dead=true; sfx('pickup');
      if(this.type==='money'){ runMoney+=this.val; entities.texts.push(new FloatingText(this.x,this.y,'+'+this.val,'#0ff')); }
      else if(this.type==='anomaly'){
        runAnomalies++; player.maxHp+=5; player.hp=Math.min(player.hp+10,player.maxHp);
        entities.texts.push(new FloatingText(this.x,this.y,'ANOMALY DECODED','#f0f'));
      }
    }
  }
  draw(ctx){
    ctx.shadowBlur=12; ctx.shadowColor=this.type==='money'?'#0ff':'#f0f';
    ctx.fillStyle=this.type==='money'?'#0ff':'#f0f';
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r+Math.sin(this.age*4)*2,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
}

class Enemy{
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type; this.dead=false; this.angle=0;
    switch(type){
      case 'drifter': this.hp=50; this.r=14; this.spd=65; this.c='#4f8'; this.score=10; break;
      case 'swarm':   this.hp=18; this.r=8;  this.spd=150;this.c='#fd0'; this.score=6; break;
      case 'turret':  this.hp=110;this.r=18; this.spd=0;  this.c='#f80'; this.score=15; break;
      case 'spinner': this.hp=150;this.r=22; this.spd=45; this.c='#f0f'; this.score=20; break;
      case 'sniper':  this.hp=70; this.r=12; this.spd=35; this.c='#a0f'; this.score=18; break;
      case 'boss':    this.hp=2400;this.r=60;this.spd=40; this.c='#f22'; this.score=300; break;
    }
    this.maxHp=this.hp; this.shoot=rand(0.5,2.5);
  }
  takeDamage(amt){
    this.hp-=amt;
    entities.texts.push(new FloatingText(this.x,this.y-14,Math.floor(amt),'#fff'));
    if(this.hp<=0){
      this.dead=true;
      runMoney+=this.score; metaMoney+=this.score;
      entities.texts.push(new FloatingText(this.x,this.y,'+'+this.score,'#0ff'));
      spawnPoof(this.x,this.y,this.c,14);
      if(this.type!=='boss' && !anomalySpawned && Math.random()<0.04){
        anomalySpawned=true; entities.items.push(new Item(this.x,this.y,'anomaly',1));
      }
    } else { spawnPoof(this.x,this.y,this.c,4); }
  }
  update(dt){
    const d=dist(this,player), a=angle(this,player);
    if(this.type==='drifter'){
      if(d>200){ this.x+=Math.cos(a)*this.spd*dt; this.y+=Math.sin(a)*this.spd*dt; }
      this.shoot-=dt;
      if(this.shoot<=0){ shootBullet(this.x,this.y,a,220,10); this.shoot=1.8; }
    }
    else if(this.type==='swarm'){
      this.x+=Math.cos(a)*this.spd*dt; this.y+=Math.sin(a)*this.spd*dt;
      if(d<this.r+player.r){ player.takeDamage(8); this.dead=true; spawnPoof(this.x,this.y,this.c,8); }
    }
    else if(this.type==='turret'){
      this.shoot-=dt;
      if(this.shoot<=0){ for(let i=-1;i<=1;i++) shootBullet(this.x,this.y,a+i*0.35,190,8); this.shoot=2.2; }
    }
    else if(this.type==='spinner'){
      this.angle+=dt*2.2;
      this.x+=Math.cos(this.angle*0.7)*this.spd*dt;
      this.y+=Math.sin(this.angle)*this.spd*dt;
      this.shoot-=dt;
      if(this.shoot<=0){ for(let i=0;i<4;i++){ const aa=this.angle+i*(Math.PI/2); shootBullet(this.x,this.y,aa,160,8); } this.shoot=0.9; }
    }
    else if(this.type==='sniper'){
      if(d<300){ this.x-=Math.cos(a)*this.spd*dt; this.y-=Math.sin(a)*this.spd*dt; }
      else if(d>500){ this.x+=Math.cos(a)*this.spd*dt; this.y+=Math.sin(a)*this.spd*dt; }
      this.shoot-=dt;
      if(this.shoot<=0){ shootBullet(this.x,this.y,a,420,18,'#f0f'); this.shoot=3.0; }
    }
    else if(this.type==='boss'){
      const cx=canvas.width/2, cy=canvas.height/2;
      const ca=Math.atan2(cy-this.y,cx-this.x);
      this.x+=Math.cos(ca)*this.spd*dt*(this.hp<this.maxHp*0.3?1.6:1);
      this.y+=Math.sin(ca)*this.spd*dt*(this.hp<this.maxHp*0.3?1.6:1);
      this.angle+=dt;
      this.shoot-=dt;
      const count = this.hp>this.maxHp*0.7?8 : this.hp>this.maxHp*0.3?12:18;
      const iv = this.hp>this.maxHp*0.3?2.0:0.9;
      if(this.shoot<=0){
        const base=this.angle;
        for(let i=0;i<count;i++){ const aa=base+(Math.PI*2/count)*i; shootBullet(this.x,this.y,aa,140,12,'#f55'); }
        if(this.hp<this.maxHp*0.5 && Math.random()<0.4){
          for(let k=0;k<3;k++) entities.enemies.push(new Enemy(this.x+rand(-40,40),this.y+rand(-40,40),'swarm'));
        }
        this.shoot=iv;
      }
    }
    // soft bound
    this.x=bound(this.x,this.r,canvas.width-this.r); this.y=bound(this.y,this.r,canvas.height-this.r);
  }
  draw(ctx){
    ctx.shadowBlur=14; ctx.shadowColor=this.c; ctx.strokeStyle=this.c; ctx.fillStyle='#000'; ctx.lineWidth=2.5;
    ctx.beginPath();
    if(this.type==='drifter'){
      const a=angle(this,player);
      ctx.moveTo(this.x+Math.cos(a)*this.r, this.y+Math.sin(a)*this.r);
      ctx.lineTo(this.x+Math.cos(a+2.4)*this.r, this.y+Math.sin(a+2.4)*this.r);
      ctx.lineTo(this.x+Math.cos(a-2.4)*this.r, this.y+Math.sin(a-2.4)*this.r);
    } else if(this.type==='swarm'){
      ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    } else if(this.type==='turret'){
      ctx.rect(this.x-this.r,this.y-this.r,this.r*2,this.r*2);
    } else if(this.type==='spinner'){
      for(let i=0;i<4;i++){ const a=this.angle+i*Math.PI/2; const x=this.x+Math.cos(a)*this.r, y=this.y+Math.sin(a)*this.r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    } else if(this.type==='sniper'){
      ctx.moveTo(this.x,this.y-this.r); ctx.lineTo(this.x+this.r,this.y); ctx.lineTo(this.x,this.y+this.r); ctx.lineTo(this.x-this.r,this.y);
    } else if(this.type==='boss'){
      const pts=10, t=performance.now()*0.001;
      for(let i=0;i<pts*2;i++){ const rr=(i%2===0)?this.r:this.r*0.55; const a=(Math.PI/pts)*i+t; const x=this.x+Math.cos(a)*rr, y=this.y+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    // hp bar
    if(this.hp<this.maxHp && this.type!=='swarm'){
      ctx.fillStyle='#222'; ctx.fillRect(this.x-22,this.y-this.r-12,44,4);
      ctx.fillStyle=this.c; ctx.fillRect(this.x-22,this.y-this.r-12,44*(this.hp/this.maxHp),4);
    }
  }
}

class Player{
  constructor(){
    this.x=canvas.width/2; this.y=canvas.height/2; this.r=8;
    this.maxHp=100; this.hp=100;
    this.vx=0; this.vy=0; this.accel=2000; this.fric=0.88; this.spdCap=380;
    this.aim=0;
    this.ghostAmmo=3; this.maxAmmo=3; this.ammoTimer=0;
    this.shootCd=0; this.fractureCd=0;
    this.iFrames=0; this.flash=0;
    this.speedMult=1; this.ghostLifeMult=1; this.ghostDrift=true; this.voidPull=false;
  }
  takeDamage(amt){
    if(this.iFrames>0||state!=='PLAYING') return;
    this.hp-=amt; this.iFrames=1.0; this.flash=1.0; shake+=6; hitstop=0.12; sfx('hit');
    if(this.hp<=0){ endGame(); }
  }
  update(dt){
    // tuning apply
    let ax=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
    let ay=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);
    const len=Math.hypot(ax,ay)||1;
    ax/=len; ay/=len;
    this.vx+=ax*this.accel*(this.speedMult||1)*dt;
    this.vy-=ay*this.accel*(this.speedMult||1)*dt;
    this.vx*=this.fric; this.vy*=this.fric;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.x=bound(this.x,this.r,canvas.width-this.r);
    this.y=bound(this.y,this.r,canvas.height-this.r);
    this.aim=Math.atan2(mouse.y-this.y,mouse.x-this.x);
    this.ammoTimer+=dt;
    if(this.ghostAmmo<this.maxAmmo && this.ammoTimer>1.4){ this.ghostAmmo++; this.ammoTimer=0; }
    this.shootCd-=dt; this.fractureCd-=dt; this.iFrames-=dt; this.flash-=dt;
    if(mouse.down && this.shootCd<=0 && this.ghostAmmo>0){
      this.ghostAmmo--; this.shootCd=0.28;
      entities.ghosts.push(new Ghost(this.x,this.y,this.aim));
      sfx('place');
    }
    if(keys['Space'] && this.fractureCd<=0){
      for(let g of entities.ghosts){ if(!g.dead && g.state==='active'){ g.explode(); break; } }
      this.fractureCd=0.35;
    }
    // enemy bullet collision
    for(let b of entities.bullets){
      if(b.dead||!b.enemy) continue;
      if(dist(this,b)<this.r+b.r){ b.dead=true; this.takeDamage(b.dmg); }
    }
  }
  draw(ctx){
    if(this.flash>0){ ctx.globalAlpha=0.4+Math.random()*0.6; }
    ctx.shadowBlur=20; ctx.shadowColor='#fff';
    ctx.fillStyle='#fff'; ctx.strokeStyle='#0ff'; ctx.lineWidth=2;
    ctx.beginPath();
    const a=this.aim;
    ctx.moveTo(this.x+Math.cos(a)*this.r*1.8, this.y+Math.sin(a)*this.r*1.8);
    ctx.lineTo(this.x+Math.cos(a+2.3)*this.r, this.y+Math.sin(a+2.3)*this.r);
    ctx.lineTo(this.x+Math.cos(a)*this.r*0.4, this.y+Math.sin(a)*this.r*0.4);
    ctx.lineTo(this.x+Math.cos(a-2.3)*this.r, this.y+Math.sin(a-2.3)*this.r);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    // echo trail
    ctx.globalAlpha=0.15; ctx.fillStyle='#0ff';
    ctx.beginPath(); ctx.arc(this.x-this.vx*0.03,this.y-this.vy*0.03,this.r*0.8,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.08; ctx.beginPath(); ctx.arc(this.x-this.vx*0.06,this.y-this.vy*0.06,this.r*0.6,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ---------- HELPERS ---------- */
function shootBullet(x,y,a,spd,dmg,color){ entities.bullets.push(new Bullet(x,y,Math.cos(a)*spd,Math.sin(a)*spd,dmg,true,color)); }
function spawnPoof(x,y,color,count){
  for(let i=0;i<count;i++){ const a=rand(0,Math.PI*2), s=rand(30,120); entities.particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.2,0.6),color||'#fff',rand(2,4))); }
}

/* ---------- WAVES ---------- */
function startWave(){
  anomalySpawned=false; entities.enemies=[]; entities.bullets=[]; waveClearTimer=0;
  let list=[];
  if(wave===1) list=[{t:'drifter',n:4}];
  else if(wave===2) list=[{t:'drifter',n:3},{t:'swarm',n:8}];
  else if(wave===3) list=[{t:'drifter',n:4},{t:'turret',n:1},{t:'swarm',n:4}];
  else if(wave===4) list=[{t:'turret',n:2},{t:'spinner',n:1},{t:'swarm',n:5}];
  else if(wave===5) list=[{t:'sniper',n:2},{t:'drifter',n:5},{t:'swarm',n:4}];
  else if(wave===6) list=[{t:'turret',n:2},{t:'spinner',n:1},{t:'sniper',n:1},{t:'swarm',n:6}];
  else if(wave===7) list=[{t:'drifter',n:4},{t:'turret',n:2},{t:'spinner',n:2},{t:'sniper',n:2},{t:'swarm',n:8}];
  else if(wave===8) list=[{t:'boss',n:1}];
  for(let g of list){
    for(let i=0;i<g.n;i++){
      const a=rand(0,Math.PI*2), d=Math.max(canvas.width,canvas.height)*0.55;
      entities.enemies.push(new Enemy(canvas.width/2+Math.cos(a)*d, canvas.height/2+Math.sin(a)*d, g.t));
    }
  }
  entities.texts.push(new FloatingText(canvas.width/2,canvas.height/2-60,'WAVE '+wave,'#0ff'));
}

/* ---------- SHOP ---------- */
const UPGRADES = [
  {id:'cap', name:'RESERVE CAPACITY', desc:'+1 Max Ghost', cost:25, once:false, apply:()=>{ player.maxAmmo++; player.ghostAmmo++; }},
  {id:'fold', name:'TEMPORAL FOLD', desc:'Ghosts last +1.5s', cost:30, once:true, apply:()=>{ ghostTimeBonus+=1.5; }},
  {id:'pull', name:'KINETIC PULL', desc:'+35% attract radius', cost:30, once:true, apply:()=>{ ghostPullMult+=0.35; }},
  {id:'vamp', name:'VAMP ECHO', desc:'Explosions heal dmg as HP', cost:45, once:true, apply:()=>{ vampEcho=true; }},
  {id:'chain', name:'CHAIN REACTION', desc:'Explosions charge nearby ghosts', cost:40, once:true, apply:()=>{ chainReaction=true; }},
  {id:'over', name:'OVERCLOCK', desc:'Overcharge multiplier x2', cost:50, once:true, apply:()=>{ overclockMult=2; }},
];
let currentShop=[];
function openShop(){
  state='SHOP'; currentShop=[];
  const pool=UPGRADES.filter(u=>u.once?!playerHasUpgrade(u.id):true).sort(()=>Math.random()-0.5).slice(0,3);
  for(let u of pool) currentShop.push({...u});
  renderShop(); document.getElementById('shopOverlay').classList.add('active');
}
let acquiredIds=[];
function playerHasUpgrade(id){ return acquiredIds.includes(id); }
function renderShop(){
  const g=document.getElementById('shopGrid'); g.innerHTML='';
  document.getElementById('shopMoney').innerText=runMoney;
  for(let u of currentShop){
    const el=document.createElement('div'); el.className='shop-card';
    const afford=runMoney>=u.cost;
    el.innerHTML=`<div class="s-name">${u.name}</div><div class="s-desc">${u.desc}</div><div class="s-cost">$${u.cost}</div><button ${afford?'':'disabled'}>INSTALL</button>`;
    el.querySelector('button').onclick=()=>{
      if(runMoney>=u.cost){ runMoney-=u.cost; u.apply(); if(u.once) acquiredIds.push(u.id); sfx('pickup'); renderShop(); }
      else sfx('deny');
    };
    g.appendChild(el);
  }
}
function closeShop(heal){
  if(heal) player.hp=Math.min(player.hp+10, player.maxHp);
  document.getElementById('shopOverlay').classList.remove('active');
  wave++; if(wave>maxWave){ victory(); } else { state='PLAYING'; startWave(); }
}

/* ---------- META / MENU ---------- */
const TUNINGS = {
  resonant:{name:'RESONANT', desc:'Balanced echo architecture.', unlocked:true, reqWave:0},
  flash:   {name:'FLASH',    desc:'+35% speed. Ghosts fade 30% faster.', unlocked:false, reqWave:3},
  anchor:  {name:'ANCHOR',   desc:'+40% HP. Ghosts placed exactly.', unlocked:false, reqWave:5},
  void:    {name:'VOID',     desc:'Ghosts pull enemies. Start with Chain.', unlocked:false, reqWave:7, reqAnomaly:true}
};
function populateMenu(){
  const box=document.getElementById('tuningBox'); box.innerHTML='';
  // update unlocks
  for(let k in TUNINGS){
    const t=TUNINGS[k];
    if(!t.unlocked){
      if(bestWave>=t.reqWave){ if(!t.reqAnomaly || totalAnomalies>0) t.unlocked=true; }
    }
  }
  for(let k in TUNINGS){
    const t=TUNINGS[k];
    const el=document.createElement('div'); el.className='tuning-card'+(selectedTuning===k?' selected':'')+(t.unlocked?'':' locked');
    el.innerHTML=`<div class="t-name">${t.name}</div><div class="t-desc">${t.desc}${!t.unlocked?`<br><span style="color:#666">[Reach Wave ${t.reqWave}${t.reqAnomaly?' + Decode Anomaly':''}]</span>`:''}</div>`;
    if(t.unlocked){
      el.onclick=()=>{ selectedTuning=k; populateMenu(); };
    }
    box.appendChild(el);
  }
  const d=document.getElementById('metaDisplay');
  d.innerHTML=`BEST WAVE: <span style="color:#0ff">${bestWave}</span> &nbsp;|&nbsp; DATA CACHE: <span style="color:#f0f">${metaMoney}</span> &nbsp;|&nbsp; ANOMALIES: <span style="color:#f0f">${totalAnomalies}</span>`;
}

function applyTuning(){
  const p=player;
  p.speedMult=1; p.ghostLifeMult=1; p.ghostDrift=true; p.voidPull=false;
  if(selectedTuning==='flash'){ p.speedMult=1.35; p.ghostLifeMult=0.7; }
  if(selectedTuning==='anchor'){ p.maxHp=Math.floor(p.maxHp*1.4); p.hp=p.maxHp; p.ghostDrift=false; }
  if(selectedTuning==='void'){ p.voidPull=true; chainReaction=true; }
}

/* ---------- GAME FLOW ---------- */
function startGame(){
  ensureAudio();
  wave=1; runMoney=0; runAnomalies=0; acquiredIds=[]; shake=0; hitstop=0;
  ghostTimeBonus=0; ghostPullMult=1; chainReaction=false; overclockMult=2; vampEcho=false;
  entities={enemies:[], bullets:[], ghosts:[], items:[], particles:[], texts:[]};
  player=new Player(); applyTuning();
  state='PLAYING'; startWave();
  document.getElementById('menuOverlay').classList.remove('active');
  document.getElementById('hud').style.display='block';
}

function endGame(){
  state='GAMEOVER';
  if(wave>bestWave){ bestWave=wave; LS.set('bestWave',bestWave); }
  LS.set('metaMoney',metaMoney);
  document.getElementById('endWave').innerText=wave;
  document.getElementById('endData').innerText=runMoney;
  document.getElementById('gameOverOverlay').classList.add('active');
  document.getElementById('hud').style.display='none';
}

function victory(){
  state='VICTORY';
  if(wave>bestWave) LS.set('bestWave',wave);
  metaMoney+=runMoney; LS.set('metaMoney',metaMoney);
  // anomalies
  if(runAnomalies>0){
    const available=[0,1,2,3,4,5].filter(i=>!anomaliesFound.has(i));
    for(let i=0;i<runAnomalies;i++){
      if(available.length){
        const pick=available.splice(Math.floor(Math.random()*available.length),1)[0];
        anomaliesFound.add(pick);
      }
    }
    totalAnomalies=anomaliesFound.size;
    LS.set('totalAnomalies',totalAnomalies);
    LS.set('anomaliesSet',Array.from(anomaliesFound));
  }
  const logs=[
    "LOG 001: The first echo did not die. It learned.",
    "LOG 019: We built you to hold the silence. You chose noise.",
    "LOG 044: Every explosion is a question. The answer is always yes.",
    "LOG 067: They are not bullets. They are memories of the dead system.",
    "LOG 089: Stillness is a lie the strong tell the broken.",
    "LOG 101: You are the fracture. The fracture is the gate."
  ];
  // pick random undiscovered or random if all discovered
  const idx = Array.from(anomaliesFound).pop() ?? Math.floor(Math.random()*logs.length);
  document.getElementById('victoryLog').innerText = (idx!==undefined?logs[idx]:'') + (runAnomalies===0?'\n\n( No anomalies decoded this run. )':'');
  document.getElementById('vicData').innerText=runMoney;
  document.getElementById('victoryOverlay').classList.add('active');
  document.getElementById('hud').style.display='none';
}

function returnToMenu(){
  document.getElementById('gameOverOverlay').classList.remove('active');
  document.getElementById('victoryOverlay').classList.remove('active');
  document.getElementById('menuOverlay').classList.add('active');
  state='MENU'; populateMenu();
}

/* ---------- MAIN LOOP ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min((now-last)/1000,0.05); last=now;
  if(state==='PLAYING'){
    if(hitstop>0){ hitstop-=dt; dt=0; }
    update(dt);
    draw();
  }
}
requestAnimationFrame(loop);

function update(dt){
  if(slowmo>0){ dt*=0.4; slowmo-=dt; }
  player.update(dt);
  // update arrays
  for(let arr of [entities.enemies, entities.bullets, entities.ghosts, entities.items, entities.particles, entities.texts])
    for(let e of arr) e.update(dt);
  // clean
  for(let k in entities) entities[k]=entities[k].filter(e=>!e.dead);
  // wave clear
  if(entities.enemies.length===0 && waveClearTimer===0 && state==='PLAYING'){ waveClearTimer=1.2; }
  if(waveClearTimer>0){ waveClearTimer-=dt; if(waveClearTimer<=0){ if(wave===maxWave){ victory(); } else { openShop(); } } }
  // decay shake
  shake*=0.88; if(shake<0.2) shake=0;
}

function draw(){
  // bg
  ctx.fillStyle='#030303'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid
  ctx.save();
  ctx.strokeStyle='#0f2222'; ctx.lineWidth=1;
  const gs=70, ox=(mouse.x*0.04)%gs, oy=(mouse.y*0.04)%gs;
  ctx.beginPath();
  for(let x=ox;x<canvas.width;x+=gs){ ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
  for(let y=oy;y<canvas.height;y+=gs){ ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
  ctx.stroke();
  ctx.restore();
  // shake
  if(shake>0){ ctx.save(); ctx.translate(rand(-shake,shake),rand(-shake,shake)); }
  // connections between ghosts
  if(entities.ghosts.length>1){
    ctx.beginPath(); ctx.strokeStyle='rgba(0,255,255,0.12)'; ctx.lineWidth=1;
    for(let i=1;i<entities.ghosts.length;i++){ const a=entities.ghosts[i-1], b=entities.ghosts[i]; if(!a.dead&&!b.dead){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); } }
    ctx.stroke();
  }
  // draw entities
  for(let e of entities.items) e.draw(ctx);
  for(let e of entities.particles) e.draw(ctx);
  for(let e of entities.ghosts) e.draw(ctx);
  for(let e of entities.enemies) e.draw(ctx);
  for(let e of entities.bullets) e.draw(ctx);
  player.draw(ctx);
  for(let e of entities.texts) e.draw(ctx);
  if(shake>0) ctx.restore();
  // HUD
  drawHUD();
}

function drawHUD(){
  // hp bar
  const barW=200, barH=14, bx=30, by=30;
  ctx.fillStyle='#111'; ctx.strokeStyle='#0ff'; ctx.lineWidth=2;
  ctx.fillRect(bx,by,barW,barH); ctx.strokeRect(bx,by,barW,barH);
  const fill=barW*(player.hp/player.maxHp);
  ctx.fillStyle=player.hp<30?'#f00':'#0ff';
  ctx.shadowBlur=10; ctx.shadowColor=ctx.fillStyle;
  ctx.fillRect(bx,by,fill,barH); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='12px Courier New'; ctx.textAlign='left';
  ctx.fillText(`${Math.ceil(player.hp)} / ${player.maxHp}`, bx+8, by+11);
  // resonance
  ctx.textAlign='right';
  ctx.fillStyle='#0ff'; ctx.font='bold 16px Courier New';
  ctx.fillText(`RESONANCE ${runMoney}`, canvas.width-30, 44);
  // wave
  ctx.textAlign='center'; ctx.fillStyle='#aaa'; ctx.font='14px Courier New';
  ctx.fillText(`WAVE ${wave} / ${maxWave}`, canvas.width/2, 40);
  // ghost ammo
  const cx=canvas.width/2, cy=canvas.height-50, sz=10;
  for(let i=0;i<player.maxAmmo;i++){
    ctx.fillStyle=i<player.ghostAmmo?'#0ff':'#0ff2';
    ctx.shadowBlur=i<player.ghostAmmo?10:0; ctx.shadowColor='#0ff';
    ctx.fillRect(cx - (player.maxAmmo*sz*1.4)/2 + i*sz*1.4, cy, sz, sz);
  } ctx.shadowBlur=0;
  // anomaly count during run
  if(runAnomalies>0){
    ctx.textAlign='left'; ctx.fillStyle='#f0f'; ctx.font='13px Courier New';
    ctx.fillText(`ANOMALIES: ${runAnomalies}`, 30, 64);
  }
  // fracture hint
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.font='11px Courier New';
  if(entities.ghosts.some(g=>!g.dead && g.state==='active')){
    ctx.fillText('[SPACE] DETONATE ECHO', canvas.width/2, canvas.height-18);
  }
}

/* ---------- INIT ---------- */
populateMenu();
</script>
