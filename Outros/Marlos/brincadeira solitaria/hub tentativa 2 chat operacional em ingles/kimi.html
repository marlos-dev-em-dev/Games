<div class="grp" id="topbar" style="top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;">
  <div style="pointer-events:none;">
    <div id="pieceTitle" style="color:#f4d98a;font-style:italic;font-size:18px;text-shadow:0 2px 8px #000;"></div>
    <div id="plaque" style="color:#cfc8b4;font-size:12.5px;font-style:italic;margin-top:2px;max-width:46vw;text-shadow:0 1px 4px #000;"></div>
  </div>
  <div class="grp" style="display:flex;gap:6px;align-items:center;">
    <span class="chip" id="tenderChip">tender 0</span>
    <span class="chip" id="lvlChip">evening 1/7</span>
    <button id="muteBtn" title="sound">♪</button>
    <button id="galleryBtn">gallery</button>
  </div>
</div>

<div class="grp" id="critbar" style="top:74px;right:12px;width:150px;display:flex;flex-direction:column;gap:6px;"></div>

<div class="grp" style="left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;">
  <button id="undoBtn">undo</button>
  <button id="redoBtn">redo</button>
  <button id="resetBtn">reset piece</button>
</div>

<div class="grp" style="right:12px;bottom:12px;">
  <button id="mintBtn" style="font-size:15px;padding:11px 16px;border-color:#d8b356;color:#f4d98a;">mint this hour</button>
</div>

<div class="grp" style="left:12px;top:74px;max-width:230px;pointer-events:none;">
  <div id="statusLine" style="color:#9ca3b5;font-style:italic;font-size:13px;text-shadow:0 1px 4px #000;line-height:1.4;"></div>
  <div id="tutor" style="color:#f0e6c8;font-style:italic;font-size:13.5px;margin-top:10px;text-shadow:0 1px 6px #000;line-height:1.5;transition:opacity .5s;"></div>
</div>

<div id="ops"></div>

<div class="grp" id="sheetWrap" style="inset:0;display:none;background:rgba(0,0,0,.25);">
  <div id="sheet" style="display:block;">
    <h3 id="sheetName"></h3>
    <div class="row">
      <div class="col"><div id="flavList"></div></div>
      <div class="col"><div id="featList"></div></div>
    </div>
    <button id="sheetClose" style="margin-top:12px;">done</button>
  </div>
</div>

<div id="galOverlay"></div>
