<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Architect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 15px 20px;
            background: rgba(20, 25, 45, 0.8);
            border-bottom: 2px solid rgba(100, 150, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        #title {
            font-size: 24px;
            font-weight: bold;
            color: #64d5ff;
            text-shadow: 0 0 10px rgba(100, 213, 255, 0.5);
        }

        .stat-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .stat-value {
            font-weight: bold;
            color: #64d5ff;
        }

        .stat-label {
            color: #a0a0a0;
        }

        #canvas {
            flex: 1;
            display: block;
            background: radial-gradient(ellipse at center, rgba(15, 20, 40, 0.9) 0%, rgba(5, 10, 25, 0.95) 100%);
            cursor: crosshair;
        }

        #footer {
            padding: 10px 20px;
            background: rgba(20, 25, 45, 0.8);
            border-top: 2px solid rgba(100, 150, 255, 0.3);
            font-size: 12px;
            color: #808080;
            text-align: center;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            border: 2px solid rgba(100, 150, 255, 0.5);
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
            text-align: center;
        }

        .modal-content h2 {
            color: #64d5ff;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .modal-content p {
            color: #c0c0c0;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #64d5ff 0%, #4a9fd8 100%);
            border: none;
            color: #0a0e27;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(100, 150, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: rgba(100, 150, 255, 0.2);
            color: #64d5ff;
            border: 1px solid rgba(100, 150, 255, 0.5);
        }

        .secondary-btn:hover {
            background: rgba(100, 150, 255, 0.3);
        }

        #tutorialOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .tutorial-box {
            position: fixed;
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            border: 2px solid rgba(100, 213, 255, 0.8);
            border-radius: 10px;
            padding: 20px;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(100, 213, 255, 0.5);
            z-index: 1001;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.6;
        }

        .tutorial-box h3 {
            color: #64d5ff;
            margin-bottom: 10px;
        }

        .tutorial-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="header">
            <div id="title">⚡ Flux Architect</div>
            <div class="stat-group">
                <div class="stat">
                    <span class="stat-label">Nível:</span>
                    <span class="stat-value" id="levelStat">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Cristais:</span>
                    <span class="stat-value" id="crystalStat">10</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Essência:</span>
                    <span class="stat-value" id="essenceStat">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Consciência:</span>
                    <span class="stat-value" id="consciousnessBar">0%</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Ciclo:</span>
                    <span class="stat-value" id="cycleStat">Dia</span>
                </div>
            </div>
            <button onclick="togglePause()">⏸ Pausa</button>
        </div>
        <canvas id="canvas"></canvas>
        <div id="footer">
            Clique para construir nós | Arraste para conectar | Espaço para deletar | Números para tipos | P para pausar
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Bem-vindo</h2>
            <p id="modalText"></p>
            <div class="modal-buttons">
                <button id="modalBtn1">OK</button>
                <button id="modalBtn2" class="secondary-btn" style="display:none;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="tutorialOverlay"></div>

    <script>
        // ============ GAME STATE ============
        const gameState = {
            paused: false,
            level: 1,
            crystals: 10,
            essence: 0,
            consciousness: 0,
            dayNightCycle: 0,
            isDaytime: true,
            score: 0,
            nodes: [],
            connections: [],
            fluxons: [],
            selectedNode: null,
            draggingFrom: null,
            buildMode: 'generator',
            nodeIdCounter: 0,
            connectionIdCounter: 0,
            fluxonIdCounter: 0,
            eventTimer: 0,
            eventInterval: 300,
            levelObjectives: [],
            completedObjectives: 0,
            tutorialStep: 0,
            gameTime: 0,
            nodeTypes: {
                generator: { name: 'Gerador', color: '#ff6b6b', cost: 3, production: 2 },
                consumer: { name: 'Consumidor', color: '#4ecdc4', cost: 2, consumption: 1 },
                storage: { name: 'Armazenamento', color: '#ffe66d', cost: 4, capacity: 10 },
                transmuter: { name: 'Transmutador', color: '#a8e6cf', cost: 5, conversion: 1 },
                special: { name: 'Especial', color: '#c7ceea', cost: 8, ability: 'teleport' }
            }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // ============ CANVAS SETUP ============
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 100;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============ NODE CLASS ============
        class Node {
            constructor(x, y, type) {
                this.id = gameState.nodeIdCounter++;
                this.x = x;
                this.y = y;
                this.type = type;
                this.radius = 25;
                this.energy = 0;
                this.maxEnergy = gameState.nodeTypes[type].capacity || 20;
                this.health = 100;
                this.active = true;
                this.production = gameState.nodeTypes[type].production || 0;
                this.consumption = gameState.nodeTypes[type].consumption || 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                if (!this.active) return;

                // Production
                if (this.type === 'generator') {
                    const dayBonus = gameState.isDaytime ? 1.5 : 0.5;
                    this.energy = Math.min(this.maxEnergy, this.energy + this.production * dayBonus * 0.016);
                }

                // Consumption
                if (this.type === 'consumer') {
                    if (this.energy >= this.consumption * 0.016) {
                        this.energy -= this.consumption * 0.016;
                        gameState.essence += 0.1;
                        gameState.consciousness += 0.05;
                    } else {
                        this.health -= 0.5;
                    }
                }

                // Storage overheating
                if (this.type === 'storage' && this.energy > this.maxEnergy * 0.9) {
                    this.health -= 0.2;
                }

                // Transmuter conversion
                if (this.type === 'transmuter') {
                    if (this.energy > 1) {
                        this.energy -= 0.5;
                        gameState.essence += 0.2;
                    }
                }

                this.pulsePhase += 0.05;
                if (this.health <= 0) this.active = false;
            }

            draw() {
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                const color = gameState.nodeTypes[this.type].color;
                
                if (this.active) {
                    const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
                    gradient.addColorStop(0, color + Math.floor(255 * pulse).toString(16).padStart(2, '0'));
                    gradient.addColorStop(1, color + '40');
                } else {
                    gradient.addColorStop(0, '#333333');
                    gradient.addColorStop(1, '#111111');
                }

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = this.active ? color : '#555555';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Energy indicator
                const energyPercent = this.energy / this.maxEnergy;
                ctx.fillStyle = `rgba(100, 213, 255, ${energyPercent})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 3, 0, Math.PI * 2 * energyPercent);
                ctx.fill();

                // Selection highlight
                if (gameState.selectedNode === this.id) {
                    ctx.strokeStyle = '#64d5ff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Type icon
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const icons = { generator: '⚡', consumer: '◆', storage: '◼', transmuter: '◇', special: '★' };
                ctx.fillText(icons[this.type], this.x, this.y);
            }

            contains(x, y) {
                const dist = Math.hypot(x - this.x, y - this.y);
                return dist <= this.radius;
            }
        }

        // ============ CONNECTION CLASS ============
        class Connection {
            constructor(fromId, toId) {
                this.id = gameState.connectionIdCounter++;
                this.fromId = fromId;
                this.toId = toId;
                this.flowRate = 1;
                this.open = true;
                this.type = 'normal';
                this.flowParticles = [];
            }

            update() {
                const fromNode = gameState.nodes.find(n => n.id === this.fromId);
                const toNode = gameState.nodes.find(n => n.id === this.toId);

                if (!fromNode || !toNode || !this.open) return;

                const transferAmount = Math.min(fromNode.energy, this.flowRate * 0.016);
                if (transferAmount > 0) {
                    fromNode.energy -= transferAmount;
                    toNode.energy = Math.min(toNode.maxEnergy, toNode.energy + transferAmount);
                }
            }

            draw() {
                const fromNode = gameState.nodes.find(n => n.id === this.fromId);
                const toNode = gameState.nodes.find(n => n.id === this.toId);

                if (!fromNode || !toNode) return;

                const startX = fromNode.x + Math.cos(Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x)) * fromNode.radius;
                const startY = fromNode.y + Math.sin(Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x)) * fromNode.radius;
                const endX = toNode.x - Math.cos(Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x)) * toNode.radius;
                const endY = toNode.y - Math.sin(Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x)) * toNode.radius;

                ctx.strokeStyle = this.open ? 'rgba(100, 213, 255, 0.6)' : 'rgba(100, 100, 100, 0.3)';
                ctx.lineWidth = this.open ? 3 : 2;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Arrow
                const angle = Math.atan2(endY - startY, endX - startX);
                const arrowSize = 10;
                ctx.fillStyle = this.open ? 'rgba(100, 213, 255, 0.8)' : 'rgba(100, 100, 100, 0.5)';
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - arrowSize * Math.cos(angle - Math.PI / 6), endY - arrowSize * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(endX - arrowSize * Math.cos(angle + Math.PI / 6), endY - arrowSize * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            }
        }

        // ============ FLUXON CLASS ============
        class Fluxon {
            constructor(x, y, color) {
                this.id = gameState.fluxonIdCounter++;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3;
                this.color = color;
                this.life = 1;
                this.size = 4;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.life -= 0.01;
            }

            draw() {
                ctx.fillStyle = this.color + Math.floor(255 * this.life).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ============ GAME FUNCTIONS ============
        function initLevel() {
            gameState.nodes = [];
            gameState.connections = [];
            gameState.fluxons = [];
            gameState.selectedNode = null;
            gameState.draggingFrom = null;
            gameState.completedObjectives = 0;

            // Create initial network
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Generator
            const gen = new Node(centerX - 150, centerY, 'generator');
            gameState.nodes.push(gen);

            // Storage
            const storage = new Node(centerX, centerY - 100, 'storage');
            gameState.nodes.push(storage);

            // Consumers
            const consumer1 = new Node(centerX + 150, centerY - 100, 'consumer');
            gameState.nodes.push(consumer1);

            const consumer2 = new Node(centerX + 150, centerY + 100, 'consumer');
            gameState.nodes.push(consumer2);

            // Transmuter
            const transmuter = new Node(centerX, centerY + 100, 'transmuter');
            gameState.nodes.push(transmuter);

            // Create connections
            gameState.connections.push(new Connection(gen.id, storage.id));
            gameState.connections.push(new Connection(storage.id, consumer1.id));
            gameState.connections.push(new Connection(storage.id, consumer2.id));
            gameState.connections.push(new Connection(storage.id, transmuter.id));

            // Set objectives
            gameState.levelObjectives = [
                { description: 'Manter 2 consumidores ativos por 30s', duration: 30, type: 'consumers', target: 2 },
                { description: 'Acumular 100 de Essência', amount: 100, type: 'essence' }
            ];
        }

        function update() {
            if (gameState.paused) return;

            gameState.gameTime += 0.016;

            // Day/Night cycle
            gameState.dayNightCycle += 0.0001;
            if (gameState.dayNightCycle > 1) gameState.dayNightCycle = 0;
            gameState.isDaytime = gameState.dayNightCycle < 0.5;

            // Update nodes
            gameState.nodes.forEach(node => node.update());

            // Update connections
            gameState.connections.forEach(conn => conn.update());

            // Random events
            gameState.eventTimer++;
            if (gameState.eventTimer > gameState.eventInterval) {
                triggerRandomEvent();
                gameState.eventTimer = 0;
                gameState.eventInterval = 200 + Math.random() * 300;
            }

            // Consciousness growth
            gameState.consciousness = Math.min(100, gameState.consciousness);

            // Update UI
            document.getElementById('levelStat').textContent = gameState.level;
            document.getElementById('crystalStat').textContent = Math.floor(gameState.crystals);
            document.getElementById('essenceStat').textContent = Math.floor(gameState.essence);
            document.getElementById('consciousnessBar').textContent = Math.floor(gameState.consciousness) + '%';
            document.getElementById('cycleStat').textContent = gameState.isDaytime ? '☀ Dia' : '🌙 Noite';

            // Check level completion
            checkLevelCompletion();
        }

        function triggerRandomEvent() {
            const eventType = Math.floor(Math.random() * 4);
            switch (eventType) {
                case 0: // Energy surge
                    gameState.nodes.filter(n => n.type === 'generator').forEach(n => {
                        n.production *= 1.3;
                        setTimeout(() => n.production /= 1.3, 5000);
                    });
                    break;
                case 1: // Node failure
                    const randomNode = gameState.nodes[Math.floor(Math.random() * gameState.nodes.length)];
                    if (randomNode && randomNode.type !== 'generator') {
                        randomNode.health -= 20;
                    }
                    break;
                case 2: // Resource discovery
                    gameState.crystals += 2;
                    break;
                case 3: // Efficiency bonus
                    gameState.essence += 5;
                    break;
            }
        }

        function checkLevelCompletion() {
            let allComplete = true;
            gameState.levelObjectives.forEach(obj => {
                if (obj.type === 'essence' && gameState.essence >= obj.amount) {
                    obj.completed = true;
                } else if (obj.type === 'consumers') {
                    const activeConsumers = gameState.nodes.filter(n => n.type === 'consumer' && n.active && n.health > 50).length;
                    if (activeConsumers >= obj.target) {
                        obj.duration -= 0.016;
                        if (obj.duration <= 0) obj.completed = true;
                    }
                }
                if (!obj.completed) allComplete = false;
            });

            if (allComplete && gameState.levelObjectives.length > 0) {
                completeLevelSuccess();
            }
        }

        function completeLevelSuccess() {
            gameState.paused = true;
            gameState.level++;
            gameState.crystals += 10;
            gameState.essence += 50;
            showModal('Nível Completo!', `Parabéns! Você avançou para o Nível ${gameState.level}.\n\n+10 Cristais\n+50 Essência`, 'Próximo Nível', () => {
                gameState.paused = false;
                initLevel();
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw connections
            gameState.connections.forEach(conn => conn.draw());

            // Draw dragging line
            if (gameState.draggingFrom) {
                const fromNode = gameState.nodes.find(n => n.id === gameState.draggingFrom);
                if (fromNode) {
                    ctx.strokeStyle = 'rgba(100, 213, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(fromNode.x, fromNode.y);
                    ctx.lineTo(gameState.mouseX || fromNode.x, gameState.mouseY || fromNode.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // Draw nodes
            gameState.nodes.forEach(node => node.draw());

            // Draw fluxons
            gameState.fluxons = gameState.fluxons.filter(f => f.life > 0);
            gameState.fluxons.forEach(fluxon => {
                fluxon.update();
                fluxon.draw();
            });

            // Draw objectives
            drawObjectives();
        }

        function drawObjectives() {
            let y = 20;
            ctx.fillStyle = 'rgba(100, 213, 255, 0.8)';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            gameState.levelObjectives.forEach(obj => {
                ctx.fillText(`${obj.completed ? '✓' : '○'} ${obj.description}`, 20, y);
                y += 25;
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ============ INPUT HANDLING ============
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const clickedNode = gameState.nodes.find(n => n.contains(x, y));

            if (clickedNode) {
                if (gameState.draggingFrom === null) {
                    gameState.selectedNode = clickedNode.id;
                    gameState.draggingFrom = clickedNode.id;
                } else if (gameState.draggingFrom !== clickedNode.id) {
                    gameState.connections.push(new Connection(gameState.draggingFrom, clickedNode.id));
                    gameState.draggingFrom = null;
                } else {
                    gameState.draggingFrom = null;
                }
            } else {
                if (gameState.draggingFrom === null && gameState.crystals >= gameState.nodeTypes[gameState.buildMode].cost) {
                    const newNode = new Node(x, y, gameState.buildMode);
                    gameState.nodes.push(newNode);
                    gameState.crystals -= gameState.nodeTypes[gameState.buildMode].cost;
                    gameState.selectedNode = newNode.id;
                }
                gameState.draggingFrom = null;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            gameState.mouseX = e.clientX - rect.left;
            gameState.mouseY = e.clientY - rect.top;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState.selectedNode !== null) {
                    gameState.nodes = gameState.nodes.filter(n => n.id !== gameState.selectedNode);
                    gameState.connections = gameState.connections.filter(c => c.fromId !== gameState.selectedNode && c.toId !== gameState.selectedNode);
                    gameState.selectedNode = null;
                }
            }
            if (e.key === 'p' || e.key === 'P') togglePause();
            if (e.key === '1') gameState.buildMode = 'generator';
            if (e.key === '2') gameState.buildMode = 'consumer';
            if (e.key === '3') gameState.buildMode = 'storage';
            if (e.key === '4') gameState.buildMode = 'transmuter';
            if (e.key === '5' && gameState.consciousness >= 50) gameState.buildMode = 'special';
        });

        function togglePause() {
            gameState.paused = !gameState.paused;
            document.querySelector('button').textContent = gameState.paused ? '▶ Retomar' : '⏸ Pausa';
        }

        // ============ MODAL FUNCTIONS ============
        function showModal(title, text, btn1Text, btn1Callback, btn2Text, btn2Callback) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modalBtn1').textContent = btn1Text;
            document.getElementById('modalBtn1').onclick = () => {
                document.getElementById('modal').classList.remove('show');
                if (btn1Callback) btn1Callback();
            };
            if (btn2Text) {
                document.getElementById('modalBtn2').textContent = btn2Text;
                document.getElementById('modalBtn2').style.display = 'block';
                document.getElementById('modalBtn2').onclick = () => {
                    document.getElementById('modal').classList.remove('show');
                    if (btn2Callback) btn2Callback();
                };
            } else {
                document.getElementById('modalBtn2').style.display = 'none';
            }
            document.getElementById('modal').classList.add('show');
        }

        // ============ INITIALIZATION ============
        function startGame() {
            showModal(
                'Bem-vindo ao Flux Architect',
                'Você é um Arquiteto de Fluxo. Sua missão: construir e otimizar uma rede de energia.\n\n1 = Gerador | 2 = Consumidor | 3 = Armazenamento | 4 = Transmutador\n\nClique para construir, arraste para conectar, Espaço para deletar.',
                'Começar',
                () => {
                    initLevel();
                    gameLoop();
                }
            );
        }

        startGame();
    </script>
</body>
