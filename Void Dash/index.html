var MERCHANT_EXCLUSIVE=['turret','fireorbs'];

function findCard(id){for(var i=0;i<allCards.length;i++)if(allCards[i].id===id)return allCards[i];return null;}

function loadData(){
    try{
        var d=JSON.parse(localStorage.getItem('vr_save'));
        if(d){
            coins=d.coins||0;ownedCards=d.cards||defaultOwned.slice();
            enemySeen=d.seen||{};ownedSkins=d.skins||['default','neon_cyan'];
            currentSkin=d.curSkin||'default';maxLevel=d.maxLevel||0;maxWave=d.maxWave||0;
            playerLevel=d.plvl||1;playerXP=d.pxp||0;playerXPMax=d.pxpm||50;
        }else{ownedCards=defaultOwned.slice();}
    }catch(e){ownedCards=defaultOwned.slice();}
    if(ownedSkins.indexOf('neon_cyan')<0)ownedSkins.push('neon_cyan');
    if(currentSkin!=='default'&&ownedSkins.indexOf(currentSkin)<0)currentSkin='default';
    checkCardUnlocks(false);
    checkSkinUnlocks();
}

function saveData(){
    try{
        var obj={coins:coins,cards:ownedCards,seen:enemySeen,skins:ownedSkins,
            curSkin:currentSkin,maxLevel:maxLevel,maxWave:maxWave,
            plvl:playerLevel,pxp:playerXP,pxpm:playerXPMax};
        localStorage.setItem('vr_save',JSON.stringify(obj));
    }catch(e){}
}

function checkSkinUnlocks(){
    var changed=false;
    for(var i=0;i<SKINS_LIST.length;i++){
        var sk=SKINS_LIST[i];
        if(sk.unlock==='wave'&&ownedSkins.indexOf(sk.id)<0&&maxWave>=sk.level){
            ownedSkins.push(sk.id);changed=true;
        }
    }
    if(changed)saveData();
}

function checkCardUnlocks(notify){
    var changed=false;
    for(var id in cardLevelReqs){
        if(MERCHANT_EXCLUSIVE.indexOf(id)>=0)continue;
        if(cardLevelReqs[id]<=playerLevel&&ownedCards.indexOf(id)<0){
            ownedCards.push(id);changed=true;
            if(notify){
                var card=findCard(id);
                if(card)pendingNotifs.push({text:card.name+' unlocked!',col:card.col});
            }
        }
    }
    if(changed)saveData();
}

function addPlayerXP(v){
    if(G.state!=='PLAYING')return;
    playerXP+=v;
    while(playerXP>=playerXPMax){
        playerXP-=playerXPMax;
        playerLevel++;
        playerXPMax=50+(playerLevel-1)*60;
        addNotif('LEVEL UP! Player Level '+playerLevel,CL.gold);
        checkCardUnlocks(true);
        saveData();
    }
}

function getPauseBtnRect(){return{x:cv.width/2-55,y:6,w:110,h:24};}

function lerp(a,b,t){return a+(b-a)*t;}
function dst(a,b,c,d){return Math.hypot(c-a,d-b);}
function ang(a,b,c,d){return Math.atan2(d-b,c-a);}
function rng(a,b){return a+Math.random()*(b-a);}
function rngI(a,b){return Math.floor(rng(a,b+1));}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function hit(a,b,ra,c,d,rb){return dst(a,b,c,d)<ra+rb;}
function isH(x,y,w,h){return inp.mx>x&&inp.mx<x+w&&inp.my>y&&inp.my<y+h;}
function lighten(hex){
    var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
    return'rgb('+Math.min(255,r+40)+','+Math.min(255,g+40)+','+Math.min(255,b+40)+')';
}

var inp={k:{},pk:{},mx:0,my:0,md:false,pmd:false,_jmd:false};
function initInput(){
    addEventListener('keydown',function(e){inp.k[e.code]=true;e.preventDefault();});
    addEventListener('keyup',function(e){inp.k[e.code]=false;});
    addEventListener('mousemove',function(e){inp.mx=e.clientX;inp.my=e.clientY;});
    addEventListener('mousedown',function(e){if(e.button===0)inp.md=true;});
    addEventListener('mouseup',function(e){if(e.button===0)inp.md=false;});
    addEventListener('wheel',function(e){if(G.state==='ENEMY_INDEX')indexScroll=clamp(indexScroll+e.deltaY*0.5,0,Math.max(0,indexMaxScroll));if(G.state==='SKINS')skinScroll=clamp(skinScroll+e.deltaY*0.5,0,Math.max(0,skinMaxScroll));if(G.state==='CARD_SHOP')shopScroll=clamp(shopScroll+e.deltaY*0.5,0,Math.max(0,shopMaxScroll));});
    cv.addEventListener('contextmenu',function(e){e.preventDefault();});
}
function flushInput(){inp._jmd=inp.md&&!inp.pmd;inp.pk=Object.assign({},inp.k);inp.pmd=inp.md;}

function shakeAdd(v){shake.i=Math.max(shake.i,v);}
function shakeUpdate(){
    if(shake.i>0.3){shake.x=(Math.random()-.5)*shake.i*2.2;shake.y=(Math.random()-.5)*shake.i*2.2;shake.rot=(Math.random()-.5)*shake.i*0.003;shake.i*=0.87;}
    else{shake.x=shake.y=shake.rot=shake.i=0;}
}

function vfxHitP(){vfx.dmgFlash=0.7;vfx.chromatic=0.35;}
function vfxExpl(){vfx.chromatic=0.5;vfx.distortion=0.35;}
function vfxBig(){vfx.chromatic=0.3;vfx.distortion=0.2;}
function vfxUpdate(){if(vfx.dmgFlash>0)vfx.dmgFlash*=0.86;if(vfx.chromatic>0)vfx.chromatic*=0.93;if(vfx.distortion>0)vfx.distortion*=0.91;}
function vfxDistort(){
    if(vfx.distortion<0.01)return;
    var s=1+Math.sin(G.time*0.3)*vfx.distortion*0.008,r=Math.sin(G.time*0.23)*vfx.distortion*0.002;
    cx.translate(cv.width/2,cv.height/2);cx.rotate(r);cx.scale(s,s);cx.translate(-cv.width/2,-cv.height/2);
}
function vfxOverlays(){
    if(vfx.dmgFlash>0.01){
        cx.save();cx.globalAlpha=vfx.dmgFlash*0.3;cx.fillStyle='#ff0000';cx.fillRect(0,0,cv.width,cv.height);cx.restore();
        var vg=cx.createRadialGradient(cv.width/2,cv.height/2,cv.height*0.3,cv.width/2,cv.height/2,cv.height*0.72);
        vg.addColorStop(0,'rgba(255,0,0,0)');vg.addColorStop(1,'rgba(180,0,0,'+vfx.dmgFlash*0.35+')');
        cx.fillStyle=vg;cx.fillRect(0,0,cv.width,cv.height);
    }
    if(vfx.chromatic>0.01){
        var ox=Math.round(vfx.chromatic*6);cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=vfx.chromatic*0.1;
        cx.fillStyle='#ff0000';cx.fillRect(ox,0,cv.width,cv.height);
        cx.fillStyle='#0044ff';cx.fillRect(-ox,0,cv.width,cv.height);cx.restore();
    }
}

function emit(x,y,o){
    if(!o)o={};if(pts.length>=800)pts.shift();
    var a=o.a!==undefined?o.a:Math.random()*6.28,sp=o.sp||rng(1.2,4),lf=o.lf||rng(18,38);
    pts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:o.r||rng(1,3),life:lf,max:lf,col:o.c||CL.neonL,dec:o.d!==undefined?o.d:0.95,grav:o.g||0,type:o.t||'dot'});
}
function burst(x,y,n,o){
    if(!o)o={};for(var i=0;i<n;i++){var oo={};for(var k in o)oo[k]=o[k];if(o.a!==undefined)oo.a=o.a+rng(-0.6,0.6);emit(x,y,oo);}
}
function uptPts(){for(var i=pts.length-1;i>=0;i--){var p=pts[i];p.vx*=p.dec;p.vy*=p.dec;p.vy+=p.grav;p.x+=p.vx;p.y+=p.vy;if(--p.life<=0)pts.splice(i,1);}}
function drwPts(){
    for(var i=0;i<pts.length;i++){
        var p=pts[i],a=p.life/p.max;cx.save();
        if(p.type==='smoke'){cx.globalAlpha=a*0.12;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.r*3,0,6.28);cx.fill();}

function uptEnemies(){
    for(var i=enemies.length-1;i>=0;i--){
        var e=enemies[i];if(e.spawn>0){e.spawn--;continue;}
        behave(e);e.x+=e.vx;e.y+=e.vy;e.pulse+=0.08;if(e.hitF>0)e.hitF--;
        if(e.type!=='ghost'){var ed=dst(e.x,e.y,arena.cx,arena.cy);if(ed>arena.r-e.r){var na=ang(arena.cx,arena.cy,e.x,e.y);e.x=arena.cx+Math.cos(na)*(arena.r-e.r);e.y=arena.cy+Math.sin(na)*(arena.r-e.r);}}
        if(hit(e.x,e.y,e.r,P.x,P.y,P.r)){
            var dm=e.type==='dasher'&&e.state==='charge'?1.5:e.type==='void_king'&&e.phase===2&&e.phaseT<=35?1.8:1;
            hurtPlayer(e.dmg*dm);
            if(e.type==='leech')e.hp=Math.min(e.hp+Math.round(e.dmg*0.6),e.maxHp);
            if(e.type==='sapper')P.slowT=90;
            if(e.type==='exploder'){e.hp=0;burst(e.x,e.y,20,{sp:4,r:3,lf:25,c:CL.orange,t:'spark'});addRing(e.x,e.y,{mr:80,sp:5,c:CL.orange,lw:3});shakeAdd(6);vfxExpl();}
            var ka=ang(P.x,P.y,e.x,e.y);e.x+=Math.cos(ka)*30;e.y+=Math.sin(ka)*30;
            if(mods.thornsDmg>0){e.hp-=mods.thornsDmg;e.hitF=6;burst(e.x,e.y,4,{sp:2,r:2,lf:12,c:CL.cyan});}
            if(e.hp<=0){killE(e,i);continue;}
        }
    }
}

function dmgE(e,d){
    if(e.shieldHp>0){var ab=Math.min(e.shieldHp,d);e.shieldHp-=ab;d-=ab;burst(e.x,e.y,4,{sp:2,r:2,lf:12,c:CL.cyan,t:'spark'});if(d<=0){e.hitF=6;return false;}}
    var isCrit=Math.random()<mods.critChance;if(isCrit){d*=2;burst(e.x,e.y,8,{sp:3,r:2,lf:15,c:CL.yellow,t:'spark'});}
    e.hp-=d;e.hitF=6;burst(e.x,e.y,6,{sp:3,r:2,lf:15,c:CL.neonL});
    if(mods.lifeSteal>0){var heal=Math.round(d*mods.lifeSteal);P.hp=Math.min(P.hp+heal,P.maxHp);}
    return e.hp<=0;
}
function killE(e,idx){
    burst(e.x,e.y,22+e.r*2,{sp:5,r:3.5,lf:40,c:e.gc});
    burst(e.x,e.y,12,{sp:4,r:2.5,lf:30,c:e.gc,t:'spark'});
    burst(e.x,e.y,8,{sp:2,r:3,lf:35,c:e.gc,t:'energy'});
    addRing(e.x,e.y,{mr:45+e.r*2,sp:4,c:e.gc,lw:2.5});
    for(var i=0;i<6;i++)emit(e.x,e.y,{sp:rng(0.4,1.2),r:rng(4,9),lf:rng(30,55),c:'#333',t:'smoke',d:0.97,g:-0.02});
    if(e.type==='tank'){burst(e.x,e.y,25,{sp:5,r:4,lf:40,c:e.gc});addRing(e.x,e.y,{mr:100,sp:4,c:e.gc,lw:3});addRing(e.x,e.y,{mr:130,sp:3,c:e.gc,lw:2});shakeAdd(8);vfxExpl();}
    else if(e.type==='dasher'){addRing(e.x,e.y,{mr:70,sp:5,c:e.gc,lw:2});shakeAdd(5);}
    else if(e.type==='shooter'){addRing(e.x,e.y,{mr:60,sp:4,c:e.gc,lw:2});shakeAdd(5);}
    else if(e.type==='phaser'){burst(e.x,e.y,18,{sp:0.5,r:4,lf:25,c:'#fff',t:'energy'});vfxBig();}
    else if(e.type==='void_king'){burst(e.x,e.y,40,{sp:6,r:5,lf:50,c:e.gc});burst(e.x,e.y,30,{sp:4,r:3,lf:40,c:'#fff',t:'energy'});addRing(e.x,e.y,{mr:200,sp:5,c:e.gc,lw:4});shakeAdd(15);vfxExpl();vfxBig();}
    else if(e.type==='exploder'){burst(e.x,e.y,20,{sp:4,r:3,lf:25,c:CL.orange,t:'spark'});addRing(e.x,e.y,{mr:80,sp:5,c:CL.orange,lw:3});shakeAdd(6);}
    else{shakeAdd(5);}

    G.score+=e.sc;spawnCoin(e.x,e.y);addXP(e.xp);

    enemies.splice(idx,1);
}

function drawShape(shape,r){
    cx.beginPath();
    if(shape==='diamond'){cx.moveTo(r,0);cx.lineTo(0,-r*0.7);cx.lineTo(-r*0.8,0);cx.lineTo(0,r*0.7);cx.closePath();}
    else if(shape==='triangle'){for(var i=0;i<3;i++){var a=6.28*i/3-1.57;i===0?cx.moveTo(Math.cos(a)*r,Math.sin(a)*r):cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}cx.closePath();}
    else if(shape==='pentagon'){for(var i=0;i<5;i++){var a=6.28*i/5-1.57;i===0?cx.moveTo(Math.cos(a)*r,Math.sin(a)*r):cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}cx.closePath();}
    else if(shape==='square'){cx.rect(-r*0.7,-r*0.7,r*1.4,r*1.4);}
    else if(shape==='octagon'){for(var i=0;i<8;i++){var a=6.28*i/8;i===0?cx.moveTo(Math.cos(a)*r,Math.sin(a)*r):cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}cx.closePath();}
    else if(shape==='star'){for(var i=0;i<10;i++){var a=6.28*i/10-1.57,rd=i%2===0?r:r*0.45;i===0?cx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd):cx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd);}cx.closePath();}
}

function getSortedCards(){
    return allCards.slice().filter(function(c){
        if(MERCHANT_EXCLUSIVE.indexOf(c.id)>=0&&ownedCards.indexOf(c.id)<0)return false;
        return true;
    }).sort(function(a,b){
        var ra=cardLevelReqs[a.id]!==undefined?cardLevelReqs[a.id]:99;
        var rb=cardLevelReqs[b.id]!==undefined?cardLevelReqs[b.id]:99;
        if(ra!==rb)return ra-rb;
        return a.cost-b.cost;
    });
}

        var req=cardLevelReqs[card.id];
        if(isMerchant){cx.font=Math.round(cw*0.065)+'px monospace';cx.fillStyle=owned?'rgba(74,222,128,0.5)':'rgba(255,255,255,0.18)';cx.fillText('Merchant exclusive',cx2+cw/2,cy2+ch*0.75);}
        else if(req!==undefined&&req>0){cx.font=Math.round(cw*0.065)+'px monospace';cx.fillStyle=playerLevel>=req?'rgba(74,222,128,0.5)':'rgba(255,255,255,0.18)';cx.fillText('Req. Lv.'+req,cx2+cw/2,cy2+ch*0.75);}
        if(owned){cx.font='bold '+Math.round(cw*0.09)+'px monospace';cx.fillStyle=CL.green;cx.fillText('OWNED',cx2+cw/2,cy2+ch*0.9);}
        else if(isMerchant){cx.font='bold '+Math.round(cw*0.08)+'px monospace';cx.fillStyle='rgba(255,255,255,0.25)';cx.fillText('MERCHANT ONLY',cx2+cw/2,cy2+ch*0.9);}
        else if(req!==undefined&&playerLevel<req){cx.font='bold '+Math.round(cw*0.08)+'px monospace';cx.fillStyle='rgba(255,255,255,0.25)';cx.fillText('LOCKED',cx2+cw/2,cy2+ch*0.9);}
        else{cx.font='bold '+Math.round(cw*0.09)+'px monospace';cx.fillStyle=coins>=card.cost?CL.gold:'rgba(255,255,255,0.25)';cx.fillText(card.cost+' coins',cx2+cw/2,cy2+ch*0.9);}
        cx.restore();
    }
    if(shopMaxScroll>0){cx.font='10px monospace';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,0.15)';cx.fillText('Scroll to see more',cv.width/2,cv.height-62);}
    var bH=isH(cv.width/2-60,cv.height-55,120,38);
    cx.fillStyle=bH?'rgba(168,85,247,0.15)':'rgba(168,85,247,0.05)';cx.strokeStyle=CL.neon;cx.lineWidth=1;
    if(bH){cx.shadowColor=CL.neon;cx.shadowBlur=12;}cx.beginPath();cx.rect(cv.width/2-60,cv.height-55,120,38);cx.fill();cx.stroke();cx.shadowBlur=0;
    cx.font='bold 14px monospace';cx.textAlign='center';cx.fillStyle=bH?'#fff':CL.neonL;cx.fillText('BACK',cv.width/2,cv.height-33);
    drwNotifs();cx.restore();
}

function drwCardSelect(){
    cx.save();cx.fillStyle='rgba(0,0,0,0.65)';cx.fillRect(0,0,cv.width,cv.height);
    cx.font='bold 30px monospace';cx.textAlign='center';cx.fillStyle=CL.neonL;cx.shadowColor=CL.neon;cx.shadowBlur=15;cx.fillText('CHOOSE AN UPGRADE',cv.width/2,cv.height/2-170);cx.shadowBlur=0;
    cx.font='13px monospace';cx.fillStyle='rgba(255,255,255,0.3)';cx.fillText('Click a card to select',cv.width/2,cv.height/2-145);
    var cw=180,ch=250,gap=25;var totalW=cw*3+gap*2,startX=(cv.width-totalW)/2,startY=cv.height/2-120;
    selectHover=-1;
    for(var i=0;i<cardChoices.length;i++){if(isH(startX+i*(cw+gap),startY,cw,ch))selectHover=i;}
    for(var i=0;i<cardChoices.length;i++){
        var card=findCard(cardChoices[i]);if(!card)continue;
        var cx2=startX+i*(cw+gap),cy2=startY,hov=i===selectHover;var sc5=hov?1.05:1;
        cx.save();cx.translate(cx2+cw/2,cy2+ch/2);cx.scale(sc5,sc5);cx.translate(-cx2-cw/2,-cy2-ch/2);
        cx.fillStyle=hov?'rgba(168,85,247,0.2)':'rgba(10,10,20,0.8)';cx.strokeStyle=card.col;cx.lineWidth=hov?2.5:1.5;
        if(hov){cx.shadowColor=card.col;cx.shadowBlur=25;}cx.beginPath();cx.rect(cx2,cy2,cw,ch);cx.fill();cx.stroke();cx.shadowBlur=0;
        cx.globalAlpha=0.06;cx.fillStyle=card.col;cx.fillRect(cx2,cy2,cw,ch);cx.globalAlpha=1;
        cx.font='42px monospace';cx.textAlign='center';cx.fillStyle=card.col;cx.shadowColor=card.col;cx.shadowBlur=hov?15:8;cx.fillText(card.icon,cx2+cw/2,cy2+60);cx.shadowBlur=0;
        cx.font='bold 14px monospace';cx.fillStyle='#fff';cx.fillText(card.name,cx2+cw/2,cy2+110);
        cx.strokeStyle='rgba(255,255,255,0.1)';cx.lineWidth=1;cx.beginPath();cx.moveTo(cx2+20,cy2+125);cx.lineTo(cx2+cw-20,cy2+125);cx.stroke();
        cx.font='12px monospace';cx.fillStyle='rgba(255,255,255,0.6)';
        var words=card.desc.split(' '),line='',ly=cy2+150;
        for(var w=0;w<words.length;w++){var test=line+words[w]+' ';if(cx.measureText(test).width>cw-30&&line){cx.fillText(line.trim(),cx2+cw/2,ly);line=words[w]+' ';ly+=16;}else{line=test;}}
        cx.fillText(line.trim(),cx2+cw/2,ly);
        if(hov){cx.font='bold 11px monospace';cx.fillStyle=card.col;cx.fillText('CLICK TO SELECT',cx2+cw/2,cy2+ch-20);}
        cx.restore();
    }
    if(selectHover>=0&&inp._jmd)selectCard(selectHover);
    cx.restore();
}

function startGame(){
    G.state='PLAYING';G.score=0;G.time=0;G.runCoins=0;G.paused=false;
    wave.num=0;wave.queue=[];wave.between=true;wave.delay=80;wave.msg=null;wave.msgT=0;
    enemies=[];bullets=[];eBullets=[];coinDrops=[];bombs=[];turrets=[];fireOrbs=[];pts=[];rings=[];dmgNums=[];
    xp=0;xpMax=80;xpLevel=0;
    runExcludedCards=[];
    merchantBoughtThisRun=[];
    merchant.active=false;merchant.used=false;
    resetMods();activeCards=[];
    initArena();initPlayer();initBG();
    addNotif('Entering the void...','#c084fc');
}
function restartGame(){coins+=G.runCoins;saveData();startGame();}
function goToMenu(){
    coins+=G.runCoins;saveData();G.state='MENU';
    enemies=[];bullets=[];eBullets=[];coinDrops=[];bombs=[];turrets=[];fireOrbs=[];pts=[];rings=[];dmgNums=[];
    merchant.active=false;merchant.used=false;
    checkCardUnlocks(false);checkSkinUnlocks();initBG();
}

function update(){
    G.time++;
    if(G.state==='PLAYING'){
        if(!G.paused){
            var pbr=getPauseBtnRect();
            if(isH(pbr.x,pbr.y,pbr.w,pbr.h)&&inp._jmd)G.paused=true;
        }
    }
    switch(G.state){
        case'MENU':uptTitle();break;
        case'PLAYING':
            if(G.paused)break;
            uptPlayer();uptEnemies();uptBullets();uptEBullets();
            uptCoins();uptBombs();uptWave();uptArena();collisions();
            updateTurrets();updateFireOrbs();updateMerchant();
            break;
        case'CARD_SELECT':break;
        case'MERCHANT_TALK':updateMerchantTalk();break;
        case'DEATH':break;
        case'CARD_SHOP':uptShop();break;
        case'ENEMY_INDEX':uptEnemyIndex();break;
        case'SKINS':uptSkins();break;
        case'CREDITS':uptCredits();break;
    }
    uptPts();uptRings();uptDmgN();uptNotifs();
    shakeUpdate();vfxUpdate();
    if(G.paused&&inp.k.Escape&&!inp.pk.Escape)G.paused=false;
    else if(!G.paused&&G.state==='PLAYING'&&inp.k.Escape&&!inp.pk.Escape)G.paused=true;
    if(pendingNotifs.length>0){addNotif(pendingNotifs[0].text,pendingNotifs[0].col);pendingNotifs.shift();}
}

function draw(){
    cv.width=innerWidth;cv.height=innerHeight;
    cx.save();cx.translate(shake.x,shake.y);cx.rotate(shake.rot);
    vfxDistort();drwBG();

    switch(G.state){
        case'MENU':drwTitle();break;
        case'PLAYING':
            drwArena();drwRings();drawTurrets();drawFireOrbs();
            drwCoins();drwBombs();drwEnemies();drawMerchant();
            drwPlayer();drwBullets();drwEBullets();
            drwPts();drwDmgN();drwHUD();
            if(G.paused)drwPause();
            break;
        case'CARD_SELECT':
            drwArena();drwRings();drawTurrets();drawFireOrbs();
            drwCoins();drwEnemies();drawMerchant();
            drwPlayer();drwBullets();drwEBullets();
            drwPts();drwHUD();drwCardSelect();
            break;
        case'MERCHANT_TALK':
            drwArena();drwRings();drawTurrets();drawFireOrbs();
            drwCoins();drwEnemies();drawMerchant();
            drwPlayer();drwBullets();drwEBullets();
            drwPts();drwHUD();drawMerchantTalk();
            break;
        case'DEATH':drwArena();drwRings();drwEnemies();drwBullets();drwPts();drwDmgN();drwDeath();break;
        case'CARD_SHOP':drwShop();break;
        case'ENEMY_INDEX':drwEnemyIndex();break;
        case'SKINS':drwSkins();break;
        case'CREDITS':drwCredits();break;
    }
    vfxOverlays();cx.restore();
    G._fc++;var now=performance.now();if(now-G._ft>=1000){G.fps=G._fc;G._fc=0;G._ft=now;}
}

function gameLoop(){update();draw();flushInput();requestAnimationFrame(gameLoop);}

function init(){cv.width=innerWidth;cv.height=innerHeight;initInput();loadData();initBG();addEventListener('resize',doResize);gameLoop();}
init();
</script>
</body>
