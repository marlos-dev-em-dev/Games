<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Torre dos Gnomos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh}
canvas{display:block}
</style>
</head>
<body>
<canvas id="G"></canvas>
<script>
(function(){
"use strict";

var cv=document.getElementById('G'),X=cv.getContext('2d');
var T=40,COLS=24,ROWS=16,W=COLS*T,H=ROWS*T;
cv.width=W;cv.height=H;
function resize(){var s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
resize();addEventListener('resize',resize);

var PI=Math.PI,PI2=PI*2;
function rnd(a,b){return Math.random()*(b-a)+a}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dst(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

var keys={};
var mx=W/2,my=H/2,mDown=false,mJustDown=false;
var wWasDown=false,lWasDown=false;
document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
function uM(e){var r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height)}
cv.addEventListener('mousemove',uM);
cv.addEventListener('mousedown',function(e){uM(e);mDown=true;mJustDown=true});
cv.addEventListener('mouseup',function(){mDown=false});
cv.addEventListener('touchstart',function(e){e.preventDefault();uM(e.touches[0]);mDown=true;mJustDown=true},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();uM(e.touches[0])},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();mDown=false},{passive:false});

var state='loading',level=0,gt=0,switchCD=0,active=0;
var gnomes=[],tiles=[],hooks=[],movers=[],tps=[],blocks=[],doorPos=null;
var buttons=[],particles=[],soulFX=null,cloudFX=null;
var paused=false,gardenFlowers=[],transitioning=false,hintAlpha=0;
var powers={dj:false,brk:false};
var PAL={red:'#e63946',blue:'#457b9d',gold:'#ffd700',goldD:'#daa520',wood:'#8b5e3c',woodD:'#5c3a1e'};
var LEVELS=[],loadProgress=0;

/* ========== DEFAULT LEVELS (FALLBACK) ========== */
var DEFAULT_LEVELS=[
{name:"O Começo",hint:"A/D mover · W pular · Espaço troca · Suba no outro gnomo!",
 powers:{dj:false,brk:false},
 map:["                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                    D   "," 1 2               ##   ","GGGGGGGGG   GGGGGGGGGGG","GGGGGGGGG   GGGGGGGGGGG"]},
{name:"O Pulo Duplo",hint:"Bartolomeu ganhou pulo duplo! Pule, solte W, aperte W no ar!",
 powers:{dj:true,brk:false},
 map:["                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                   D    ","                  ###   ","                        "," 1 2                    ","GGGGGGGGGGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGGGGGGGGGG"]},
{name:"O Gancho",hint:"Pule e segure o mouse no gancho! A/D balança, solte para voar!",
 powers:{dj:true,brk:false},
 map:["                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","            h           ","                        "," 1 2               D    ","GGGGGGGGG       GGGGGGGG","GGGGGGGGG       GGGGGGGG"]},
{name:"A Muralha",hint:"Bartas (azul): troque com Espaço e aperte L na muralha!",
 powers:{dj:true,brk:true},
 map:["                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                        ","                   D    ","                   R    ","                   R    ","                   R    "," 1 2               R    ","GGGGGGGGGGGGGGGGGGGGGGGG","GGGGGGGGGGGGGGGGGGGGGGGG"]},
{name:"O Botão",hint:"Um gnomo no botão, outro usa gancho + pulo duplo!",
 powers:{dj:true,brk:true},doorBtn:'a',
 map:["                        ","                        ","                        ","                        ","                        ","                        ","                t  D    ","               qqqq     ","                        ","                        ","         ###            ","                        ","            h           "," 1 2                    ","GGGGGGGGGG    GGGGGGGGG","GGGGGGGGGG    GGGGGGGGG"]},
{name:"Coordenação",hint:"Caixas + botões! Pense antes de agir!",
 powers:{dj:true,brk:true},
 map:["                        ","                        ","                        ","                        ","                        ","            u  x  D     ","           qqqqqqqq     ","                        ","                t       ","               ###      ","                        ","                        ","                        "," 1 2  BB                ","GGGGGGGGG     GGGGGGGGG","GGGGGGGGG     GGGGGGGGG"]}
];

/* ========== LEVEL LOADER ========== */
async function loadLevels(){
  state='loading';LEVELS=[];loadProgress=0;
  for(var i=1;i<=50;i++){
    loadProgress=i;
    try{
      var resp=await fetch('fases/fase'+i+'.json');
      if(!resp.ok)break;
      var data=await resp.json();
      if(!data.map||!Array.isArray(data.map))break;
      LEVELS.push(data);
    }catch(e){break}
  }
  if(LEVELS.length===0){for(var i=0;i<DEFAULT_LEVELS.length;i++)LEVELS.push(DEFAULT_LEVELS[i])}
  state='menu';
}

/* ========== PARSING ========== */
function parseLevel(lvl){
  tiles=[];hooks=[];tps=[];blocks=[];doorPos=null;movers=[];buttons=[];
  var p1=null,p2=null,map=lvl.map;
  for(var r=0;r<map.length;r++){
    tiles[r]=[];var row=map[r]||"";
    for(var c=0;c<row.length;c++){
      var ch=row[c],type=0;
      if(ch==='#')type=1;else if(ch==='G')type=2;else if(ch==='W')type=3;
      else if(ch==='q')type=4;else if(ch==='x')type=5;
      else if(ch==='h')hooks.push({x:c*T+T/2,y:r*T+T/2});
      else if(ch==='a')tps.push({x:c*T,y:r*T,id:'a',cd:0});
      else if(ch==='b')tps.push({x:c*T,y:r*T,id:'b',cd:0});
      else if(ch==='R')blocks.push({x:c*T,y:r*T,w:T,h:T,vx:0,vy:0,type:'cracked',carried:false,carrier:-1,spawnX:c*T,spawnY:r*T});
      else if(ch==='B')blocks.push({x:c*T,y:r*T,w:T,h:T,vx:0,vy:0,type:'solid',carried:false,carrier:-1,spawnX:c*T,spawnY:r*T});
      else if(ch==='t')buttons.push({x:c*T+T/2,y:(r+1)*T,id:'a',pressed:false});
      else if(ch==='u')buttons.push({x:c*T+T/2,y:(r+1)*T,id:'b',pressed:false});
      else if(ch==='D')doorPos={x:c*T,y:r*T,w:T,h:T};
      else if(ch==='1')p1={x:c*T+T/2-10,y:r*T+T-40};
      else if(ch==='2')p2={x:c*T+T/2-10,y:r*T+T-40};
      tiles[r][c]=type;
    }
  }
  powers.dj=lvl.powers?lvl.powers.dj:false;
  powers.brk=lvl.powers?lvl.powers.brk:false;
  if(p1&&p2)gnomes=[mkG(p1.x,p1.y,0),mkG(p2.x,p2.y,1)];
}
function mkG(x,y,id){
  return{x:x,y:y,w:20,h:40,vx:0,vy:0,id:id,facing:1,grounded:false,grabbing:false,
    stone:id!==0,stoneT:0,animT:0,jumpCD:0,hatCol:id===0?PAL.red:PAL.blue,
    name:id===0?'Bartolomeu':'Bartas',swinging:false,swHook:null,swAngle:0,swVel:0,swLen:0,
    djUsed:false,carrying:false,carryBlock:null};
}
function gCen(g){return{x:g.x+g.w/2,y:g.y+g.h/2}}

function addP(x,y,vx,vy,col,sz,life){if(particles.length<400)particles.push({x:x,y:y,vx:vx,vy:vy,col:col,sz:sz,life:life,ml:life})}
function burst(x,y,col,n,sr,szr){for(var i=0;i<n;i++){var a=rnd(0,PI2),s=rnd(sr[0],sr[1]);addP(x,y,Math.cos(a)*s,Math.sin(a)*s,col,rnd(szr[0],szr[1]),rnd(20,50))}}
function startSoulFX(f,t){soulFX={fx:f.x+f.w/2,fy:f.y+f.h/2,tx:t.x+t.w/2,ty:t.y+t.h/2,t:0,dur:35,trail:[]}}
function startCloudFX(cb){cloudFX={t:0,phase:'in',cb:cb,clouds:[]};for(var r=0;r<7;r++)for(var c=0;c<6;c++)cloudFX.clouds.push({x:W+80+c*200+rnd(-40,40),y:r*(H/6)-40+rnd(-30,30),w:rnd(240,380),h:rnd(110,200),spd:rnd(8,14)})}
function updCloudFX(){if(!cloudFX)return;cloudFX.t++;var i;if(cloudFX.phase==='in'){for(i=0;i<cloudFX.clouds.length;i++)cloudFX.clouds[i].x-=cloudFX.clouds[i].spd;if(cloudFX.t>=70){cloudFX.phase='hold';cloudFX.t=0;if(cloudFX.cb)cloudFX.cb()}}else if(cloudFX.phase==='hold'){for(i=0;i<cloudFX.clouds.length;i++)cloudFX.clouds[i].x+=Math.sin(cloudFX.t*0.1)*0.3;if(cloudFX.t>=30){cloudFX.phase='out';cloudFX.t=0}}else if(cloudFX.phase==='out'){for(i=0;i<cloudFX.clouds.length;i++)cloudFX.clouds[i].x-=cloudFX.clouds[i].spd;if(cloudFX.t>=70)cloudFX=null}}

/* ========== BUTTON HELPERS ========== */
function btnPressed(id){for(var i=0;i<buttons.length;i++)if(buttons[i].id===id&&buttons[i].pressed)return true;return false}
function updButtons(){for(var i=0;i<buttons.length;i++){var b=buttons[i];b.pressed=false;for(var g=0;g<gnomes.length;g++){var gn=gnomes[g];if(Math.abs((gn.x+gn.w/2)-b.x)<T*0.7&&Math.abs((gn.y+gn.h)-b.y)<6){b.pressed=true;break}}if(!b.pressed)for(var j=0;j<blocks.length;j++){var bl=blocks[j];if(bl.carried||bl.type!=='solid')continue;if(Math.abs((bl.x+bl.w/2)-b.x)<T*0.7&&Math.abs((bl.y+bl.h)-b.y)<6){b.pressed=true;break}}}}

/* ========== PHYSICS ========== */
function getTile(r,c){if(r<0||r>=ROWS||c<0||c>=COLS)return 0;if(!tiles[r])return 0;var t=tiles[r][c];if(t===4)return btnPressed('a')?1:0;if(t===5)return btnPressed('b')?1:0;return(t===1||t===2||t===3)?t:0}
function isSolid(r,c){return getTile(r,c)>0}
function isHard(r,c){var t=tiles[r]?tiles[r][c]||0:0;return t===1||t===2||t===3}

function groundProbe(obj){
  var cx=obj.x+obj.w/2,col=Math.floor(cx/T),row=Math.floor((obj.y+obj.h+1)/T);
  if(isSolid(row,col))return true;
  for(var i=0;i<blocks.length;i++){var bl=blocks[i];if(bl.carried)continue;if(obj.x+obj.w>bl.x&&obj.x<bl.x+bl.w){var gap=bl.y-(obj.y+obj.h);if(gap>=0&&gap<3)return true}}
  var ot=gnomes[1-obj.id];if(ot&&ot.stone&&obj.x+obj.w>ot.x&&obj.x<ot.x+ot.w){var gap=ot.y-(obj.y+obj.h);if(gap>=0&&gap<3)return true}
  return false;
}
function resolvePhys(obj){
  var onGround=groundProbe(obj);
  if(onGround&&obj.vy>=0&&!obj.grabbing){obj.vy=0;obj.grounded=true}
  else{obj.grounded=false;if(!obj.grabbing)obj.vy+=0.5;else obj.vy*=0.5}
  if(obj.vy>14)obj.vy=14;
  obj.x+=obj.vx;obj.y+=obj.vy;
  if(!obj.grabbing)obj.vx*=0.82;if(Math.abs(obj.vx)<0.15)obj.vx=0;
  var l=Math.floor(obj.x/T),r=Math.floor((obj.x+obj.w)/T),t=Math.floor(obj.y/T),b=Math.floor((obj.y+obj.h)/T);
  for(var row=Math.max(0,t);row<=Math.min(b,ROWS-1);row++)for(var col=Math.max(0,l);col<=Math.min(r,COLS-1);col++){
    if(!isHard(row,col)){if(tiles[row]&&(tiles[row][col]===4||tiles[row][col]===5)){if(!isSolid(row,col))continue}else continue}
    var pl={x:col*T,y:row*T,w:T,h:T};if(!aabb(obj,pl))continue;
    var ox1=obj.x+obj.w-pl.x,ox2=pl.x+pl.w-obj.x,oy1=obj.y+obj.h-pl.y,oy2=pl.y+pl.h-obj.y,pX=Math.min(ox1,ox2),pY=Math.min(oy1,oy2);
    if(pX<pY){if(ox1<ox2)obj.x=pl.x-obj.w;else obj.x=pl.x+pl.w;obj.vx=0}
    else{if(obj.vy>=0){obj.y=pl.y-obj.h;obj.vy=0;obj.grounded=true}else{obj.y=pl.y+pl.h;obj.vy=0}}}
  for(var i=0;i<blocks.length;i++){var bl=blocks[i];if(bl.carried&&bl.carrier===obj.id)continue;if(!aabb(obj,bl))continue;
    var ox1=obj.x+obj.w-bl.x,ox2=bl.x+bl.w-obj.x,oy1=obj.y+obj.h-bl.y,oy2=bl.y+bl.h-obj.y,pX=Math.min(ox1,ox2),pY=Math.min(oy1,oy2);
    if(pX<pY){if(ox1<ox2){obj.x=bl.x-obj.w;if(bl.type!=='cracked')bl.vx+=0.3}else{obj.x=bl.x+bl.w;if(bl.type!=='cracked')bl.vx-=0.3}obj.vx=0}
    else{if(obj.vy>=0){obj.y=bl.y-obj.h;obj.vy=0;obj.grounded=true}else{obj.y=bl.y+bl.h;obj.vy=0}}}
  var ot=gnomes[1-obj.id];
  if(ot&&ot.stone&&ot!==obj&&aabb(obj,ot)){var ox1=obj.x+obj.w-ot.x,ox2=ot.x+ot.w-obj.x,oy1=obj.y+obj.h-ot.y,oy2=ot.y+ot.h-obj.y,pX=Math.min(ox1,ox2),pY=Math.min(oy1,oy2);
    if(pX<pY){if(ox1<ox2)obj.x=ot.x-obj.w;else obj.x=ot.x+ot.w;obj.vx=0}else{if(obj.vy>=0){obj.y=ot.y-obj.h;obj.vy=0;obj.grounded=true}else{obj.y=ot.y+ot.h;obj.vy=0}}}
  obj.x=clamp(obj.x,0,W-obj.w);
}
function resetGPos(g){var map=LEVELS[level].map;for(var r=0;r<map.length;r++){var row=map[r]||"";for(var c=0;c<row.length;c++){if((g.id===0&&row[c]==='1')||(g.id===1&&row[c]==='2')){g.x=c*T+T/2-g.w/2;g.y=r*T+T-g.h;g.vx=0;g.vy=0;g.grounded=false;g.grabbing=false;g.swinging=false;if(g.carrying&&g.carryBlock){g.carryBlock.carried=false;g.carryBlock.carrier=-1;g.carryBlock=null;g.carrying=false}return}}}}

/* ========== GAME UPDATE ========== */
function updateGame(dt){
  if(paused||transitioning)return;gt++;if(switchCD>0)switchCD-=dt;if(hintAlpha>0)hintAlpha-=0.5;
  for(var i=0;i<tps.length;i++)if(tps[i].cd>0)tps[i].cd=Math.max(0,tps[i].cd-dt);
  updButtons();
  var ag=gnomes[active];if(!ag)return;
  var wDown=keys['w']||keys['arrowup']||false,wJustDown=wDown&&!wWasDown;wWasDown=wDown;

  if(keys[' ']&&switchCD<=0){keys[' ']=false;switchCD=600;
    if(ag.swinging){ag.vx=ag.swVel*ag.swLen*Math.cos(ag.swAngle)*0.9;ag.vy=-ag.swVel*ag.swLen*Math.sin(ag.swAngle)*0.9;ag.swinging=false}
    if(ag.carrying&&ag.carryBlock){ag.carryBlock.carried=false;ag.carryBlock.carrier=-1;ag.carryBlock=null;ag.carrying=false}
    ag.grabbing=false;lWasDown=false;var prev=active;active=1-active;
    gnomes[prev].stone=true;gnomes[prev].stoneT=0;gnomes[prev].vx=0;gnomes[prev].vy=0;
    gnomes[active].stone=false;gnomes[active].stoneT=0;
    startSoulFX(gnomes[prev],gnomes[active]);burst(gnomes[prev].x+10,gnomes[prev].y+20,'#fff',8,[1,3],[2,4]);ag=gnomes[active]}

  for(var i=0;i<movers.length;i++){var mk=movers[i];mk.t+=mk.spd*mk.dir*0.01;if(mk.t>1){mk.t=1;mk.dir=-1}if(mk.t<0){mk.t=0;mk.dir=1}mk.x=lerp(mk.sx,mk.ex,mk.t);mk.y=lerp(mk.sy,mk.ey,mk.t)}
  if(!mDown&&ag.swinging){ag.vx=ag.swVel*ag.swLen*Math.cos(ag.swAngle)*0.9;ag.vy=-ag.swVel*ag.swLen*Math.sin(ag.swAngle)*0.9;ag.swinging=false;ag.grabbing=false}
  ag.grabbing=false;

  if(mDown){
    if(ag.swinging&&ag.swHook){ag.grabbing=true}
    else{var gc=gCen(ag),grabbed=false;
      for(var i=0;i<hooks.length;i++){if(dst(gc.x,gc.y,hooks[i].x,hooks[i].y)<55){ag.swinging=true;ag.swHook=hooks[i];ag.grabbing=true;grabbed=true;ag.swLen=Math.max(dst(gc.x,gc.y,hooks[i].x,hooks[i].y),30);ag.swAngle=Math.atan2(gc.x-hooks[i].x,gc.y-hooks[i].y);ag.swVel=clamp(ag.vx*0.015,-0.15,0.15);burst(hooks[i].x,hooks[i].y,'#ffdd44',6,[1,3],[2,3]);break}}
      if(!grabbed){var lc=Math.floor(ag.x/T),rc=Math.floor((ag.x+ag.w)/T),tr=Math.floor(ag.y/T),br=Math.floor((ag.y+ag.h)/T);for(var r=tr;r<=br&&!grabbed;r++)for(var c=lc;c<=rc;c++){if(getTile(r,c)===3){ag.grabbing=true;ag.vy*=0.1;ag.vy+=0.05;grabbed=true;break}}}}
  }

  if(ag.swinging&&ag.swHook&&ag.grabbing){
    var swG=0.012,swD=0.997,swI=0;if(keys['a']||keys['arrowleft'])swI=-0.01;if(keys['d']||keys['arrowright'])swI=0.01;
    ag.swVel+=-swG*Math.sin(ag.swAngle)+swI;ag.swVel*=swD;ag.swVel=clamp(ag.swVel,-0.25,0.25);ag.swAngle+=ag.swVel;
    var hk=ag.swHook;ag.x=hk.x+Math.sin(ag.swAngle)*ag.swLen-ag.w/2;ag.y=hk.y+Math.cos(ag.swAngle)*ag.swLen-ag.h/2;ag.vx=0;ag.vy=0}
  if(wJustDown&&ag.swinging&&ag.jumpCD<=0){ag.vx=ag.swVel*ag.swLen*Math.cos(ag.swAngle)*1.0;ag.vy=-7;ag.swinging=false;ag.grabbing=false;ag.jumpCD=15}

  if(!ag.swinging){
    var dx=0;if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;
    if(dx){ag.vx=dx*3.5;ag.facing=dx}
    if(wJustDown&&ag.jumpCD<=0){
      if(ag.grounded){ag.vy=-9.5;ag.grounded=false;ag.jumpCD=15;ag.djUsed=false;burst(ag.x+ag.w/2,ag.y+ag.h,'#aaffaa',6,[1,3],[2,3])}
      else if(ag.id===0&&powers.dj&&!ag.djUsed){ag.vy=-9.5;ag.djUsed=true;ag.jumpCD=15;burst(ag.x+ag.w/2,ag.y+ag.h,'#ffe566',12,[1,5],[2,5])}}}
  if(ag.jumpCD>0)ag.jumpCD--;

  if(ag.id===1&&powers.brk){var lNow=keys['l']||false;
    if(lNow&&!lWasDown){lWasDown=true;var agc=gCen(ag),brokeStone=false;
      for(var bi=blocks.length-1;bi>=0;bi--){var bl=blocks[bi];if(bl.type==='cracked'&&!bl.carried&&dst(agc.x,agc.y,bl.x+bl.w/2,bl.y+bl.h/2)<60){burst(bl.x+bl.w/2,bl.y+bl.h/2,'#887766',20,[2,5],[3,5]);blocks.splice(bi,1);brokeStone=true;break}}
      if(!brokeStone&&!ag.carrying){for(var bi=0;bi<blocks.length;bi++){var bl=blocks[bi];if(bl.type==='solid'&&!bl.carried&&dst(agc.x,agc.y,bl.x+bl.w/2,bl.y+bl.h/2)<60){bl.carried=true;bl.carrier=ag.id;bl.vx=0;bl.vy=0;ag.carryBlock=bl;ag.carrying=true;burst(bl.x+bl.w/2,bl.y+bl.h/2,'#457b9d',8,[1,3],[2,3]);break}}}}
    if(!lNow&&lWasDown){lWasDown=false;if(ag.carrying&&ag.carryBlock){ag.carryBlock.carried=false;ag.carryBlock.carrier=-1;ag.carryBlock=null;ag.carrying=false}}}
  else{lWasDown=false}

  for(var i=0;i<blocks.length;i++){var bl=blocks[i];if(bl.carried)continue;if(bl.type==='cracked'){bl.vx=0;bl.vy=0;continue}
    bl.vy+=0.4;bl.x+=bl.vx;bl.y+=bl.vy;bl.vx*=0.85;if(bl.vy>12)bl.vy=12;
    var cl=Math.floor(bl.x/T),cr=Math.floor((bl.x+bl.w)/T),ct=Math.floor(bl.y/T),cb=Math.floor((bl.y+bl.h)/T);
    for(var row=Math.max(0,ct);row<=Math.min(cb,ROWS-1);row++)for(var col=Math.max(0,cl);col<=Math.min(cr,COLS-1);col++){if(isSolid(row,col)){var p={x:col*T,y:row*T,w:T,h:T};if(aabb(bl,p)){var ox1=bl.x+bl.w-p.x,ox2=p.x+p.w-bl.x,oy1=bl.y+bl.h-p.y,oy2=p.y+p.h-bl.y;if(Math.min(ox1,ox2)<Math.min(oy1,oy2)){if(ox1<ox2)bl.x=p.x-bl.w;else bl.x=p.x+p.w;bl.vx=0}else{if(bl.vy>=0){bl.y=p.y-bl.h;bl.vy=0}else{bl.y=p.y+p.h;bl.vy=0}}}}}
    bl.x=clamp(bl.x,0,W-bl.w);
    if(bl.y>H+50){for(var gi=0;gi<gnomes.length;gi++){if(gnomes[gi].carryBlock===bl){gnomes[gi].carrying=false;gnomes[gi].carryBlock=null}}bl.x=bl.spawnX;bl.y=bl.spawnY;bl.vx=0;bl.vy=0;bl.carried=false;bl.carrier=-1}}
  for(var i=0;i<gnomes.length;i++){var g=gnomes[i];if(g.carrying&&g.carryBlock){var bl=g.carryBlock;bl.x=lerp(bl.x,g.x+g.w/2-bl.w/2+g.facing*(g.w/2+4),0.25);bl.y=lerp(bl.y,g.y+g.h-bl.h,0.25);bl.vx=0;bl.vy=0}}

  resolvePhys(ag);ag.animT+=Math.abs(ag.vx)>0.3?1:0;if(ag.grounded)ag.djUsed=false;
  for(var i=0;i<gnomes.length;i++){var g=gnomes[i];if(g.y>H+50){if(g.carrying&&g.carryBlock){g.carryBlock.carried=false;g.carryBlock.carrier=-1;g.carryBlock=null;g.carrying=false}burst(g.x+g.w/2,H-20,'#ff3355',15,[2,5],[3,5]);g.swinging=false;g.grabbing=false;resetGPos(g)}}
  for(var i=0;i<tps.length;i++)for(var j=i+1;j<tps.length;j++){if(tps[i].id===tps[j].id){var c1=gCen(ag);
    if(dst(c1.x,c1.y,tps[i].x+T/2,tps[i].y+T/2)<35&&tps[i].cd<=0){ag.x=tps[j].x+T/2-ag.w/2;ag.y=tps[j].y+T-ag.h;tps[i].cd=2000;tps[j].cd=2000;burst(ag.x+10,ag.y+20,'#aa44ff',12,[2,4],[3,5])}
    if(dst(c1.x,c1.y,tps[j].x+T/2,tps[j].y+T/2)<35&&tps[j].cd<=0){ag.x=tps[i].x+T/2-ag.w/2;ag.y=tps[i].y+T-ag.h;tps[i].cd=2000;tps[j].cd=2000;burst(ag.x+10,ag.y+20,'#aa44ff',12,[2,4],[3,5])}}}
  if(doorPos&&!transitioning){var agc=gCen(ag);if(agc.x>doorPos.x&&agc.x<doorPos.x+doorPos.w&&agc.y>doorPos.y&&agc.y<doorPos.y+doorPos.h){
    var canEnter=true;if(LEVELS[level].doorBtn)canEnter=btnPressed(LEVELS[level].doorBtn);
    if(canEnter){transitioning=true;burst(doorPos.x+T/2,doorPos.y+T/2,'#ffd700',20,[2,5],[3,6]);
      if(level<LEVELS.length-1){var nl=level+1;startCloudFX(function(){level=nl;parseLevel(LEVELS[level]);active=0;gnomes[0].stone=false;gnomes[1].stone=true;switchCD=400;transitioning=false;hintAlpha=300})}
      else startCloudFX(function(){state='win';transitioning=false})}}}
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.98;p.life--;if(p.life<=0)particles.splice(i,1)}
  if(soulFX){soulFX.t++;var st=soulFX.t/soulFX.dur;soulFX.cx=lerp(soulFX.fx,soulFX.tx,st);soulFX.cy=lerp(soulFX.fy,soulFX.ty,st)-Math.sin(st*PI)*40;soulFX.trail.push({x:soulFX.cx,y:soulFX.cy,l:15});for(var i=0;i<soulFX.trail.length;i++)soulFX.trail[i].l--;soulFX.trail=soulFX.trail.filter(function(t){return t.l>0});if(soulFX.t>=soulFX.dur)soulFX=null}
  for(var i=0;i<gnomes.length;i++){if(gnomes[i].stone)gnomes[i].stoneT=Math.min(gnomes[i].stoneT+0.03,1)}
}

/* ========== DRAWING ========== */
function drawRR(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath()}
function drawBg(){var sky=X.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5b8fd9');sky.addColorStop(0.5,'#a8d8ea');sky.addColorStop(1,'#d4eac8');X.fillStyle=sky;X.fillRect(0,0,W,H);var t=gt*0.3;for(var i=0;i<5;i++){var cx=((i*250+t*(0.2+i*0.05))%(W+200))-100,cy=40+i*25+Math.sin(i*2)*15;X.fillStyle='rgba(255,255,255,'+(0.4+i*0.05)+')';X.beginPath();X.ellipse(cx,cy,50+i*10,18+i*4,0,0,PI2);X.fill();X.beginPath();X.ellipse(cx-25,cy+5,30+i*6,14+i*3,0,0,PI2);X.fill();X.beginPath();X.ellipse(cx+25,cy+3,35+i*8,15+i*3,0,0,PI2);X.fill()}X.fillStyle='#7ab87a';X.beginPath();X.moveTo(0,H*0.6);for(var x=0;x<=W;x+=20)X.lineTo(x,H*0.55+Math.sin(x*0.008)*30+Math.sin(x*0.015)*15);X.lineTo(W,H);X.lineTo(0,H);X.fill();X.fillStyle='#5ea05e';X.beginPath();X.moveTo(0,H*0.65);for(var x=0;x<=W;x+=20)X.lineTo(x,H*0.62+Math.sin(x*0.01+1)*20+Math.sin(x*0.02)*10);X.lineTo(W,H);X.lineTo(0,H);X.fill()}

function drawTiles(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var raw=tiles[r]?tiles[r][c]:0;if(!raw)continue;var x=c*T,y=r*T;
  if(raw===1||raw===2){X.fillStyle=raw===2?'#5cb85c':'#8a7a6a';X.fillRect(x,y,T,T);if(raw===2){X.fillStyle='#6dce6d';X.fillRect(x,y,T,8);X.fillStyle='#4aad4a';for(var i=0;i<4;i++){var gx=x+5+i*10;X.beginPath();X.moveTo(gx,y+8);X.lineTo(gx+2,y+2);X.lineTo(gx+4,y+8);X.fill()}}X.strokeStyle='rgba(0,0,0,0.15)';X.lineWidth=1;X.strokeRect(x+.5,y+.5,T-1,T/2-1);X.strokeRect(x+T/4,y+T/2,T/2,T/2-1)}
  else if(raw===3){X.fillStyle='#6a8a5a';X.fillRect(x,y,T,T);X.strokeStyle='#3a6a2a';X.lineWidth=2;X.beginPath();X.moveTo(x+T/3,y);X.quadraticCurveTo(x+T/2,y+T/2,x+T/3,y+T);X.stroke();X.beginPath();X.moveTo(x+T*2/3,y);X.quadraticCurveTo(x+T/2,y+T/2,x+T*2/3,y+T);X.stroke()}
  else if(raw===4||raw===5){var active=(raw===4)?btnPressed('a'):btnPressed('b');if(active){X.fillStyle='#88aacc';X.fillRect(x,y,T,T);X.strokeStyle='#aaccee';X.lineWidth=1;X.strokeRect(x+1,y+1,T-2,T-2)}else{X.fillStyle='rgba(100,130,170,0.2)';X.fillRect(x,y,T,T);X.strokeStyle='rgba(100,130,170,0.35)';X.lineWidth=1;X.setLineDash([4,4]);X.strokeRect(x+1,y+1,T-2,T-2);X.setLineDash([])}}}}

function drawButtons(){for(var i=0;i<buttons.length;i++){var b=buttons[i],col=b.id==='a'?'#44aaff':'#ff8844',dim=b.id==='a'?'#226699':'#995533';X.fillStyle=b.pressed?col:dim;X.beginPath();X.ellipse(b.x,b.y,14,6,0,0,PI2);X.fill();X.fillStyle=b.pressed?'#fff':col;X.beginPath();X.ellipse(b.x,b.y-3,10,4,0,0,PI2);X.fill();if(b.pressed){X.fillStyle='rgba(255,255,255,0.12)';X.beginPath();X.ellipse(b.x,b.y,22,10,0,0,PI2);X.fill()}}}

function drawHooksMovers(){var ag=gnomes[active];if(ag&&!ag.stone){var gc=gCen(ag);for(var i=0;i<hooks.length;i++){if(dst(gc.x,gc.y,hooks[i].x,hooks[i].y)<60&&!ag.swinging){X.fillStyle='rgba(255,220,100,0.08)';X.beginPath();X.arc(hooks[i].x,hooks[i].y,55,0,PI2);X.fill()}}}
  for(var i=0;i<hooks.length;i++){var hk=hooks[i];X.fillStyle='#8b7355';X.beginPath();X.arc(hk.x,hk.y,6,0,PI2);X.fill();X.strokeStyle='#6b5335';X.lineWidth=3;X.beginPath();X.moveTo(hk.x,hk.y-20);X.lineTo(hk.x,hk.y);X.stroke();X.strokeStyle='#8b7355';X.lineWidth=4;X.beginPath();X.arc(hk.x,hk.y+2,8,PI*0.2,PI*0.8);X.stroke()}}

function drawRope(){var ag=gnomes[active];if(!ag||!ag.swinging||!ag.swHook)return;var hk=ag.swHook,gc=gCen(ag);X.strokeStyle='rgba(180,150,100,0.6)';X.lineWidth=2.5;X.beginPath();X.moveTo(hk.x,hk.y);X.lineTo(gc.x,gc.y-5);X.stroke()}

function drawTPS(){for(var i=0;i<tps.length;i++){var tp=tps[i],cx=tp.x+T/2,cy=tp.y+T/2,pulse=Math.sin(gt*0.08)*3,onCD=tp.cd>0,col=onCD?'#555':(tp.id==='a'?'#8844ff':'#44aaff');X.fillStyle=col+'30';X.beginPath();X.arc(cx,cy,18+(onCD?0:pulse),0,PI2);X.fill();X.strokeStyle=col;X.lineWidth=3;X.beginPath();X.arc(cx,cy,14+(onCD?0:pulse),0,PI2);X.stroke();X.fillStyle=onCD?'#777':(tp.id==='a'?'#aa66ff':'#66ccff');X.beginPath();X.arc(cx,cy,6,0,PI2);X.fill();X.fillStyle=onCD?'#999':'#fff';X.font='bold 12px Nunito';X.textAlign='center';X.textBaseline='middle';X.fillText(tp.id.toUpperCase(),cx,cy)}}

function drawBlocks(){for(var i=0;i<blocks.length;i++){var bl=blocks[i];if(bl.carried)continue;
  if(bl.type==='cracked'){X.fillStyle='#9a8a7a';drawRR(bl.x+1,bl.y+1,bl.w-2,bl.h-2,4);X.fill();X.strokeStyle='#7a6a5a';X.lineWidth=2;drawRR(bl.x+1,bl.y+1,bl.w-2,bl.h-2,4);X.stroke();X.strokeStyle='rgba(40,30,20,0.6)';X.lineWidth=1.5;X.beginPath();X.moveTo(bl.x+8,bl.y+5);X.lineTo(bl.x+bl.w/2,bl.y+bl.h/2);X.lineTo(bl.x+8,bl.y+bl.h-5);X.stroke();X.beginPath();X.moveTo(bl.x+bl.w-8,bl.y+8);X.lineTo(bl.x+bl.w/2+5,bl.y+bl.h/2);X.stroke()}
  else{X.fillStyle='#b8945a';drawRR(bl.x+1,bl.y+1,bl.w-2,bl.h-2,4);X.fill();X.strokeStyle='#8b6914';X.lineWidth=2;drawRR(bl.x+1,bl.y+1,bl.w-2,bl.h-2,4);X.stroke()}}}

function drawCarriedBlocks(){for(var i=0;i<gnomes.length;i++){var g=gnomes[i];if(g.carrying&&g.carryBlock){var bl=g.carryBlock;X.fillStyle='rgba(68,136,255,0.12)';X.beginPath();X.arc(bl.x+bl.w/2,bl.y+bl.h/2,bl.w*0.7,0,PI2);X.fill();X.fillStyle='#c8a868';drawRR(bl.x+1,bl.y+1,bl.w-2,bl.h-2,4);X.fill();X.strokeStyle=PAL.blue;X.lineWidth=2.5;drawRR(bl.x+1,bl.y+1,bl.w-2,bl.h-2,4);X.stroke()}}}

function drawInteractionHints(){var ag=gnomes[active];if(!ag||ag.id!==1||ag.stone||!powers.brk)return;var agc=gCen(ag);for(var i=0;i<blocks.length;i++){var bl=blocks[i];if(bl.carried)continue;if(dst(agc.x,agc.y,bl.x+bl.w/2,bl.y+bl.h/2)<80){var ix=bl.x+bl.w/2,iy=bl.y-14;X.fillStyle='rgba(100,200,255,0.25)';X.beginPath();X.arc(ix,iy,11,0,PI2);X.fill();X.fillStyle='rgba(255,255,255,0.85)';X.font='bold 10px Nunito';X.textAlign='center';X.textBaseline='middle';X.fillText('L',ix,iy)}}}

function drawDoor(){if(!doorPos)return;var dx=doorPos.x,dy=doorPos.y,locked=LEVELS[level].doorBtn&&!btnPressed(LEVELS[level].doorBtn),glow=Math.sin(gt*0.05)*0.15+0.3;
  X.fillStyle=locked?'rgba(100,100,100,0.2)':'rgba(255,215,0,'+glow+')';X.beginPath();X.arc(dx+T/2,dy+T/2,25,0,PI2);X.fill();
  X.fillStyle=locked?'#666':PAL.goldD;X.fillRect(dx+2,dy+2,T-4,T-4);
  X.fillStyle=locked?'#555':PAL.wood;X.fillRect(dx+5,dy+5,T-10,T-5);
  X.fillStyle=locked?'#777':PAL.gold;X.beginPath();X.arc(dx+T-12,dy+T/2,3,0,PI2);X.fill()}

function drawGnome(g){var gx=Math.round(g.x),gy=Math.round(g.y),cx=gx+g.w/2,by=gy+g.h,f=g.facing,bob=g.grounded?Math.sin(g.animT*0.2)*2:0,stone=g.stone,st=stone?g.stoneT:0;X.save();
  X.fillStyle='rgba(0,0,0,0.2)';X.beginPath();X.ellipse(cx,by+2,12,4,0,0,PI2);X.fill();
  var legOff=Math.sin(g.animT*0.2)*4;
  X.fillStyle=stone?'rgb('+(120-st*40)+','+(110-st*40)+','+(100-st*40)+')':'#5b7553';X.fillRect(cx-8,by-10+bob+legOff*0.3,5,10);X.fillRect(cx+3,by-10+bob-legOff*0.3,5,10);
  X.fillStyle=stone?'rgb('+(80-st*30)+','+(60-st*20)+','+(40-st*15)+')':'#4a3728';X.fillRect(cx-9,by-4+bob+legOff*0.3,7,4);X.fillRect(cx+2,by-4+bob-legOff*0.3,7,4);
  X.fillStyle=stone?'rgb('+(130-st*50)+','+(120-st*50)+','+(110-st*50)+')':'#6b8f5e';drawRR(cx-9,by-28+bob,18,18,3);X.fill();
  if(!stone){X.fillStyle='#8b6914';X.fillRect(cx-9,by-15+bob,18,3)}
  X.fillStyle=stone?'rgb('+(120-st*40)+','+(110-st*40)+','+(100-st*40)+')':'#7a9e6d';X.fillRect(cx-12,by-24+bob,4,12);X.fillRect(cx+8,by-24+bob,4,12);
  X.fillStyle=stone?'rgb('+(160-st*60)+','+(140-st*60)+','+(120-st*50)+')':'#f4c7a0';X.beginPath();X.arc(cx,by-32+bob,9,0,PI2);X.fill();
  if(!stone){X.fillStyle='#2a1a0a';X.beginPath();X.arc(cx-3*f,by-33+bob,1.5,0,PI2);X.fill();X.beginPath();X.arc(cx+2*f,by-33+bob,1.5,0,PI2);X.fill()}
  else{X.fillStyle='rgba(40,40,40,0.5)';X.beginPath();X.arc(cx-3,by-33+bob,1.5,0,PI2);X.fill();X.beginPath();X.arc(cx+3,by-33+bob,1.5,0,PI2);X.fill()}
  var hatCol=stone?'rgb('+(100-st*40+g.id*10)+','+(80-st*30)+','+(80-st*30)+')':g.hatCol;
  X.fillStyle=hatCol;X.beginPath();X.moveTo(cx-11,by-35+bob);X.lineTo(cx+11,by-35+bob);X.lineTo(cx+f*2,by-58+bob);X.closePath();X.fill();
  X.fillStyle=stone?'rgb('+(80-st*30)+','+(70-st*25)+','+(70-st*25)+')':g.id===0?'#b22222':'#2a5577';X.beginPath();X.ellipse(cx,by-35+bob,13,4,0,0,PI2);X.fill();
  X.fillStyle=stone?'#999':'#fff';X.beginPath();X.arc(cx+f*2,by-58+bob,3,0,PI2);X.fill();
  if(stone&&st>0.3){X.strokeStyle='rgba(40,40,40,'+st*0.7+')';X.lineWidth=1.5;X.beginPath();X.moveTo(cx-3,by-26+bob);X.lineTo(cx+1,by-22+bob);X.lineTo(cx-2,by-18+bob);X.stroke()}
  if(g.grabbing){X.strokeStyle='rgba(255,255,100,0.6)';X.lineWidth=2;X.beginPath();X.arc(cx,by-20+bob,15,0,PI2);X.stroke()}
  X.restore()}

function drawParticles(){for(var i=0;i<particles.length;i++){var p=particles[i];X.globalAlpha=p.life/p.ml;X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,p.sz*(p.life/p.ml),0,PI2);X.fill()}X.globalAlpha=1}
function drawSoul(){if(!soulFX)return;for(var i=0;i<soulFX.trail.length;i++){var tr=soulFX.trail[i];X.globalAlpha=tr.l/15*0.5;X.fillStyle='#fff';X.beginPath();X.arc(tr.x,tr.y,3*(tr.l/15),0,PI2);X.fill()}X.globalAlpha=1;var pulse=Math.sin(soulFX.t*0.3)*2;X.fillStyle='rgba(255,255,200,0.8)';X.beginPath();X.arc(soulFX.cx,soulFX.cy,5+pulse,0,PI2);X.fill();X.fillStyle='rgba(255,255,255,0.9)';X.beginPath();X.arc(soulFX.cx,soulFX.cy,3,0,PI2);X.fill()}
function drawCloudFX(){if(!cloudFX)return;if(cloudFX.phase==='in'||cloudFX.phase==='hold'){X.fillStyle='#dde6f0';X.fillRect(0,0,W,H)}X.fillStyle='#eef3f9';for(var i=0;i<cloudFX.clouds.length;i++){var c=cloudFX.clouds[i];X.beginPath();X.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,PI2);X.fill();X.beginPath();X.ellipse(c.x-c.w*0.3,c.y+c.h*0.1,c.w*0.3,c.h*0.4,0,0,PI2);X.fill();X.beginPath();X.ellipse(c.x+c.w*0.3,c.y+c.h*0.05,c.w*0.35,c.h*0.45,0,0,PI2);X.fill()}}

function drawHUD(){if(state!=='playing'||!gnomes.length)return;
  X.fillStyle='rgba(0,0,0,0.4)';drawRR(W/2-120,10,240,32,10);X.fill();X.fillStyle='#fff';X.font='bold 14px Nunito';X.textAlign='center';X.fillText((level+1)+'. '+LEVELS[level].name,W/2,30);
  var ag=gnomes[active];if(ag){X.fillStyle='rgba(0,0,0,0.4)';drawRR(W/2-80,H-48,160,32,10);X.fill();X.fillStyle=ag.hatCol;X.font='bold 13px Nunito';X.textAlign='center';X.fillText('Controlando: '+ag.name,W/2,H-27)}
  X.fillStyle='rgba(0,0,0,0.4)';drawRR(W-50,8,42,28,8);X.fill();X.fillStyle='#fff';X.font='bold 16px Nunito';X.textAlign='center';X.fillText('\u2630',W-29,27);

function drawGame(){drawBg();drawTiles();drawButtons();drawHooksMovers();drawTPS();drawBlocks();drawInteractionHints();drawDoor();for(var i=0;i<gnomes.length;i++)if(gnomes[i].stone)drawGnome(gnomes[i]);for(var i=0;i<gnomes.length;i++)if(!gnomes[i].stone)drawGnome(gnomes[i]);drawCarriedBlocks();drawRope();drawParticles();drawSoul();drawCloudFX();drawHUD()}

function drawLoadingScreen(){
  drawBg();X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(0,0,W,H);
  X.save();X.shadowColor='rgba(255,215,0,0.4)';X.shadowBlur=20;X.fillStyle='#ffd700';X.font='bold 36px Fredoka One';X.textAlign='center';X.fillText('A Torre dos Gnomos',W/2,H/2-40);X.shadowBlur=0;X.restore();
  X.fillStyle='#aaa';X.font='16px Nunito';X.textAlign='center';X.fillText('Carregando fases...',W/2,H/2+10);
  var pct=(Math.sin(gt*0.06)+1)/2;X.fillStyle='#333';drawRR(W/2-120,H/2+35,240,10,5);X.fill();X.fillStyle='#ffd700';drawRR(W/2-120,H/2+35,240*pct,10,5);X.fill();
  if(loadProgress>0){X.fillStyle='#666';X.font='11px Nunito';X.fillText('Procurando fase '+loadProgress+'...',W/2,H/2+65)}}

function drawMenuScreen(){drawBg();X.fillStyle='#5cb85c';X.fillRect(0,H*0.65,W,H*0.35);X.fillStyle='#4a9e4a';X.fillRect(0,H*0.65,W,8);
  if(!gardenFlowers.length)for(var i=0;i<30;i++)gardenFlowers.push({x:rnd(20,W-20),y:rnd(H*0.68,H*0.92),col:['#ff6b8a','#ffaa44','#ff44aa','#ff8844','#aa44ff','#ff4466'][Math.floor(rnd(0,6))],sz:rnd(4,8),stem:rnd(12,25)});
  for(var i=0;i<gardenFlowers.length;i++){var fl=gardenFlowers[i];X.strokeStyle='#3a7a3a';X.lineWidth=2;X.beginPath();X.moveTo(fl.x,fl.y);X.lineTo(fl.x,fl.y-fl.stem);X.stroke();X.fillStyle=fl.col;for(var p=0;p<5;p++){var a=PI2/5*p+gt*0.005;X.beginPath();X.arc(fl.x+Math.cos(a)*fl.sz*0.6,fl.y-fl.stem+Math.sin(a)*fl.sz*0.6,fl.sz*0.5,0,PI2);X.fill()}X.fillStyle='#ffe066';X.beginPath();X.arc(fl.x,fl.y-fl.stem,fl.sz*0.3,0,PI2);X.fill()}
  var titleY=H*0.25;X.save();X.shadowColor='rgba(255,255,255,0.6)';X.shadowBlur=30;X.fillStyle=PAL.red;X.font='bold 52px Fredoka One';X.textAlign='center';X.fillText('A Torre dos Gnomos',W/2,titleY);X.shadowBlur=0;X.restore();
  X.fillStyle='rgba(255,255,255,0.7)';X.font='16px Nunito';X.textAlign='center';X.fillText(LEVELS.length+' fases carregadas',W/2,titleY+30);
  var btns=[{label:'JOGAR',y:H*0.48,active:true}];window._mb=[];
  for(var i=0;i<btns.length;i++){var b=btns[i],bw=200,bx=W/2-bw/2;window._mb.push({x:bx,y:b.y,w:bw,h:44,active:b.active});X.fillStyle=b.active?'rgba(255,255,255,0.1)':'rgba(100,100,100,0.15)';drawRR(bx,b.y,bw,44,12);X.fill();X.strokeStyle=b.active?'rgba(255,255,255,0.4)':'rgba(100,100,100,0.2)';X.lineWidth=2;drawRR(bx,b.y,bw,44,12);X.stroke();X.fillStyle=b.active?'#fff':'rgba(255,255,255,0.35)';X.font='bold 18px Fredoka One';X.textAlign='center';X.fillText(b.label,W/2,b.y+28)}}

function drawPauseMenu(){X.fillStyle='rgba(0,0,0,0.6)';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.font='bold 36px Fredoka One';X.textAlign='center';X.fillText('PAUSADO',W/2,H*0.3);
  var btns=[{label:'Continuar',act:'cont'},{label:'Reiniciar',act:'rest'},{label:'Menu',act:'menu'}];window._pb=[];
  for(var i=0;i<btns.length;i++){var b=btns[i],bw=200,bh=44,bx=W/2-bw/2,by=H*0.4+i*56;window._pb.push({x:bx,y:by,w:bw,h:bh,act:b.act});var hv=mx>bx&&mx<bx+bw&&my>by&&my<by+bh;X.fillStyle=hv?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.08)';drawRR(bx,by,bw,bh,12);X.fill();X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=2;drawRR(bx,by,bw,bh,12);X.stroke();X.fillStyle='#fff';X.font='bold 18px Nunito';X.textAlign='center';X.fillText(b.label,W/2,by+28)}}

function drawWinScreen(){drawBg();X.fillStyle='rgba(0,0,0,0.3)';X.fillRect(0,0,W,H);X.save();X.shadowColor='rgba(255,215,0,0.5)';X.shadowBlur=20;X.fillStyle='#ffd700';X.font='bold 48px Fredoka One';X.textAlign='center';X.fillText('PARABÉNS!',W/2,H*0.35);X.shadowBlur=0;X.restore();X.fillStyle='#fff';X.font='20px Nunito';X.textAlign='center';X.fillText('Bartolomeu e Bartas chegaram ao topo!',W/2,H*0.45);X.font='16px Nunito';X.fillStyle='rgba(255,255,255,0.5)';X.fillText('Clique para voltar ao menu',W/2,H*0.6)}

function handleClick(x,y){
  if(state==='menu'){if(window._mb)for(var i=0;i<window._mb.length;i++){var b=window._mb[i];if(b.active&&x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){state='playing';level=0;transitioning=true;startCloudFX(function(){parseLevel(LEVELS[0]);active=0;gnomes[0].stone=false;gnomes[1].stone=true;hintAlpha=300;switchCD=400;transitioning=false});break}}}
  else if(state==='playing'){if(x>W-50&&x<W-8&&y>8&&y<36){state='paused';paused=true}}
  else if(state==='paused'){if(window._pb)for(var i=0;i<window._pb.length;i++){var b=window._pb[i];if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){if(b.act==='cont'){state='playing';paused=false}else if(b.act==='rest'){state='playing';paused=false;transitioning=true;startCloudFX(function(){parseLevel(LEVELS[level]);active=0;gnomes[0].stone=false;gnomes[1].stone=true;hintAlpha=200;transitioning=false})}else if(b.act==='menu'){state='menu';paused=false;gardenFlowers=[]}break}}}
  else if(state==='win'){state='menu';gardenFlowers=[]}}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(state==='playing'){state='paused';paused=true}else if(state==='paused'){state='playing';paused=false}}});

var lastT=0;
function loop(t){var dt=Math.min(t-lastT,50);lastT=t;
  if(state==='loading'){gt++;drawLoadingScreen()}
  else if(state==='menu'){gt++;drawMenuScreen();if(mJustDown)handleClick(mx,my)}
  else if(state==='playing'){updCloudFX();if(!transitioning)updateGame(dt);drawGame();if(mJustDown)handleClick(mx,my)}
  else if(state==='paused'){drawGame();drawPauseMenu();if(mJustDown)handleClick(mx,my)}
  else if(state==='win'){drawWinScreen();if(mJustDown)handleClick(mx,my)}
  mJustDown=false;requestAnimationFrame(loop)}

/* ========== START ========== */
loadLevels();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
