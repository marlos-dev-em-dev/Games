<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void-Dash</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #06060e;
      --bg-surface: #0c0c1a;
      --purple-dark: #1a0a2e;
      --purple-mid: #6b21a8;
      --purple-bright: #a855f7;
      --purple-glow: #c084fc;
      --purple-neon: #d8b4fe;
      --white: #f0eef5;
      --white-muted: #b8b0c8;
      --text-dim: #5a5270;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--white);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ===== STARFIELD ===== */
    .starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .starfield canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ===== AMBIENT GLOWS ===== */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow--1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(107, 33, 168, 0.15), transparent 70%);
      top: -10%;
      left: -5%;
      animation: drift1 12s ease-in-out infinite alternate;
    }

    .ambient-glow--2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.1), transparent 70%);
      bottom: -10%;
      right: -5%;
      animation: drift2 15s ease-in-out infinite alternate;
    }

    .ambient-glow--3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.08), transparent 70%);
      top: 40%;
      left: 50%;
      animation: drift3 10s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(60px, 40px) scale(1.1); } }
    @keyframes drift2 { to { transform: translate(-50px, -30px) scale(1.15); } }
    @keyframes drift3 { to { transform: translate(-40px, 50px) scale(0.9); } }

    /* ===== OVERLAYS ===== */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px
      );
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(6, 6, 14, 0.7) 100%);
    }

    /* ===== MAIN LAYOUT ===== */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    /* ===== TITLE ===== */
    .title-section {
      text-align: center;
      margin-bottom: 4rem;
      animation: titleReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes titleReveal {
      from { opacity: 0; transform: translateY(-30px) scale(0.95); filter: blur(10px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1;
      user-select: none;
    }

    .title__void {
      color: var(--white);
      text-shadow: 0 0 10px rgba(240,238,245,0.3), 0 0 40px rgba(240,238,245,0.1);
    }

    .title__dash {
      color: var(--purple-bright);
      text-shadow:
        0 0 10px rgba(168,85,247,0.6),
        0 0 30px rgba(168,85,247,0.3),
        0 0 60px rgba(168,85,247,0.15),
        0 0 100px rgba(168,85,247,0.08);
      animation: dashPulse 3s ease-in-out infinite;
    }

    @keyframes dashPulse {
      0%, 100% { text-shadow: 0 0 10px rgba(168,85,247,0.6), 0 0 30px rgba(168,85,247,0.3), 0 0 60px rgba(168,85,247,0.15); }
      50%      { text-shadow: 0 0 15px rgba(168,85,247,0.8), 0 0 40px rgba(168,85,247,0.5), 0 0 80px rgba(168,85,247,0.25), 0 0 120px rgba(168,85,247,0.1); }
    }

    .title__separator {
      display: inline-block;
      width: 3px;
      height: 0.7em;
      background: var(--purple-mid);
      margin: 0 0.15em;
      vertical-align: middle;
      box-shadow: 0 0 8px rgba(107,33,168,0.6);
      animation: separatorBlink 4s ease-in-out infinite;
    }

    @keyframes separatorBlink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0.3; }
    }

    .subtitle {
      font-family: var(--font-body);
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      font-weight: 300;
      color: var(--text-dim);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-top: 1rem;
      animation: subtitleFade 1.5s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes subtitleFade {
      from { opacity: 0; letter-spacing: 1em; }
      to   { opacity: 1; letter-spacing: 0.5em; }
    }

    /* ===== MENU ===== */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .menu__btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(220px, 40vw, 320px);
      padding: 0.9rem 2.5rem;
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white-muted);
      background: linear-gradient(135deg, rgba(26,10,46,0.6), rgba(12,12,26,0.8));
      border: 1px solid rgba(107,33,168,0.25);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      transition: color 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    }

    .menu__btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple-bright), transparent);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 10px rgba(168,85,247,0.5);
    }

    .menu__btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,0.06), transparent);
      transition: left 0.5s ease;
    }

    .menu__btn:hover {
      color: var(--white);
      border-color: rgba(168,85,247,0.6);
      box-shadow: 0 0 15px rgba(168,85,247,0.15), inset 0 0 20px rgba(168,85,247,0.05);
      transform: translateY(-2px);
    }
    .menu__btn:hover::after { width: 80%; }
    .menu__btn:hover::before { left: 100%; }
    .menu__btn:active { transform: translateY(0) scale(0.98); }

    .menu__btn-icon {
      margin-right: 0.8rem;
      font-size: 1.1em;
      opacity: 0.6;
      transition: opacity 0.3s, transform 0.3s;
    }
    .menu__btn:hover .menu__btn-icon { opacity: 1; transform: scale(1.15); }

    .menu__btn--primary {
      background: linear-gradient(135deg, rgba(107,33,168,0.3), rgba(26,10,46,0.8));
      border-color: rgba(168,85,247,0.4);
      color: var(--white);
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      padding: 1.1rem 2.5rem;
    }
    .menu__btn--primary:hover {
      border-color: var(--purple-bright);
      box-shadow: 0 0 25px rgba(168,85,247,0.25), 0 0 60px rgba(168,85,247,0.08), inset 0 0 30px rgba(168,85,247,0.08);
    }

    .menu__btn:nth-child(1) { animation: btnSlide 0.5s 0.5s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
    .menu__btn:nth-child(2) { animation: btnSlide 0.5s 0.65s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
    .menu__btn:nth-child(3) { animation: btnSlide 0.5s 0.8s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
    .menu__btn:nth-child(4) { animation: btnSlide 0.5s 0.95s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }

    @keyframes btnSlide {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ===== CONTROLS CARD ===== */
    .controls-card {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      z-index: 20;
      padding: 1.2rem 1.6rem;
      background: linear-gradient(135deg, rgba(12,12,26,0.85), rgba(26,10,46,0.6));
      border: 1px solid rgba(107,33,168,0.2);
      border-radius: 6px;
      backdrop-filter: blur(12px);
      animation: cardReveal 0.8s 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
      opacity: 0;
      max-width: 280px;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .controls-card__title {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--purple-glow);
      margin-bottom: 0.8rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(107,33,168,0.2);
    }

    .controls-card__list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .controls-card__item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.85rem;
      color: var(--white-muted);
    }

    .controls-card__key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      padding: 0.2rem 0.45rem;
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--purple-neon);
      background: rgba(107,33,168,0.15);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 3px;
      white-space: nowrap;
    }

    .controls-card__action {
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    /* ===== VERSION ===== */
    .version-tag {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 20;
      font-family: var(--font-display);
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      opacity: 0;
      animation: cardReveal 0.8s 1.5s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* ===== DECORATIVE DECAGON ===== */
    .deco-decagon {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      width: clamp(300px, 50vw, 600px);
      height: clamp(300px, 50vw, 600px);
      pointer-events: none;
      opacity: 0.03;
      animation: decoSpin 120s linear infinite;
    }

    .deco-decagon svg { width: 100%; height: 100%; }

    @keyframes decoSpin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 600px) {
      .controls-card { bottom: 1rem; left: 1rem; right: 1rem; max-width: none; }
      .version-tag { display: none; }
    }
  </style>
</head>
<body>

  <!-- STARFIELD -->
  <div class="starfield">
    <canvas id="starCanvas"></canvas>
  </div>

  <!-- AMBIENT GLOWS -->
  <div class="ambient-glow ambient-glow--1"></div>
  <div class="ambient-glow ambient-glow--2"></div>
  <div class="ambient-glow ambient-glow--3"></div>

  <!-- OVERLAYS -->
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- DECORATIVE DECAGON -->
  <div class="deco-decagon">
    <svg viewBox="0 0 200 200" fill="none">
      <polygon points="100,5 155,25 190,72 190,128 155,175 100,195 45,175 10,128 10,72 45,25"
        stroke="rgba(168,85,247,1)" stroke-width="0.5" fill="none"/>
      <polygon points="100,20 145,37 175,78 175,122 145,163 100,180 55,163 25,122 25,78 55,37"
        stroke="rgba(168,85,247,0.5)" stroke-width="0.3" fill="none"/>
    </svg>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main-container">
    <section class="title-section">
      <h1 class="title">
        <span class="title__void">VOID</span><span class="title__separator"></span><span class="title__dash">DASH</span>
      </h1>
      <p class="subtitle">Corrija as rupturas. Sobreviva ao caos temporal.</p>
    </section>

    <nav class="menu" aria-label="Menu principal">
      <button class="menu__btn menu__btn--primary" type="button">
        <span class="menu__btn-icon">&#9654;</span> Jogar
      </button>
      <button class="menu__btn" type="button">
        <span class="menu__btn-icon">&#9830;</span> Cartas
      </button>
      <button class="menu__btn" type="button">
        <span class="menu__btn-icon">&#9679;</span> Jogador
      </button>
      <button class="menu__btn" type="button">
        <span class="menu__btn-icon">&#9733;</span> Mercado
      </button>
    </nav>
  </main>

  <!-- CONTROLS -->
  <aside class="controls-card">
    <h2 class="controls-card__title">Controles</h2>
    <ul class="controls-card__list">
      <li class="controls-card__item">
        <span class="controls-card__key">W A S D</span>
        <span class="controls-card__action">Movimento</span>
      </li>
      <li class="controls-card__item">
        <span class="controls-card__key">Espaço</span>
        <span class="controls-card__action">Dash</span>
      </li>
      <li class="controls-card__item">
        <span class="controls-card__key">Mouse + Clique</span>
        <span class="controls-card__action">Mirar e atirar</span>
      </li>
    </ul>
  </aside>

  <span class="version-tag">v0.1.0 ALPHA</span>

  <!-- ===== STARFIELD + COMETAS SCRIPT ===== -->
  <script>
    (() => {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');

      // ── Config ──
      const STAR_COUNT = 200;
      const COMET_INTERVAL_MIN = 3000;   // ms mínimo entre cometas
      const COMET_INTERVAL_MAX = 7000;   // ms máximo entre cometas
      const COMET_SPEED_MIN = 4;
      const COMET_SPEED_MAX = 8;
      const COMET_TAIL = 80;             // comprimento da cauda

      let W, H;
      let stars = [];
      let comets = [];
      let nextCometTime = 0;

      // ── Resize ──
      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      // ── Criar estrelas ──
      function createStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.5 + 0.3,
            baseAlpha: Math.random() * 0.6 + 0.15,
            pulse: Math.random() * Math.PI * 2,
            pulseSpeed: Math.random() * 0.02 + 0.005,
            // Velocidade de deriva (bem lenta)
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15,
            isPurple: Math.random() > 0.65
          });
        }
      }

      // ── Criar cometa ──
      function spawnComet() {
        // Nasce de uma borda aleatória
        const side = Math.floor(Math.random() * 4);
        let x, y, angle;

        switch (side) {
          case 0: // topo
            x = Math.random() * W;
            y = -20;
            angle = Math.random() * 0.8 + 0.4; // 0.4–1.2 rad (descendo)
            break;
          case 1: // direita
            x = W + 20;
            y = Math.random() * H;
            angle = Math.random() * 0.8 + 2.0; // para esquerda
            break;
          case 2: // baixo
            x = Math.random() * W;
            y = H + 20;
            angle = Math.random() * 0.8 + 3.6; // subindo
            break;
          default: // esquerda
            x = -20;
            y = Math.random() * H;
            angle = Math.random() * 0.8 - 0.4; // para direita
            break;
        }

        const speed = COMET_SPEED_MIN + Math.random() * (COMET_SPEED_MAX - COMET_SPEED_MIN);

        comets.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.003 + Math.random() * 0.004,
          isPurple: Math.random() > 0.4,
          headSize: 2 + Math.random() * 2
        });
      }

      // ── Draw loop ──
      let lastTime = 0;

      function draw(time) {
        const dt = time - lastTime;
        lastTime = time;

        ctx.clearRect(0, 0, W, H);

        // ── Estrelas ──
        for (const s of stars) {
          // Deriva
          s.x += s.vx;
          s.y += s.vy;

          // Wrap around
          if (s.x < -5) s.x = W + 5;
          if (s.x > W + 5) s.x = -5;
          if (s.y < -5) s.y = H + 5;
          if (s.y > H + 5) s.y = -5;

          // Pulse
          s.pulse += s.pulseSpeed;
          const flicker = 0.5 + 0.5 * Math.sin(s.pulse);
          const alpha = s.baseAlpha * flicker;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);

          if (s.isPurple) {
            ctx.fillStyle = `rgba(168, 85, 247, ${alpha})`;
            ctx.shadowColor = 'rgba(168, 85, 247, 0.5)';
            ctx.shadowBlur = 6;
          } else {
            ctx.fillStyle = `rgba(240, 238, 245, ${alpha})`;
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          }

          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // ── Cometas ──
        // Spawn
        if (time >= nextCometTime) {
          spawnComet();
          nextCometTime = time + COMET_INTERVAL_MIN +
            Math.random() * (COMET_INTERVAL_MAX - COMET_INTERVAL_MIN);
        }

        // Update + draw
        for (let i = comets.length - 1; i >= 0; i--) {
          const c = comets[i];
          c.x += c.vx;
          c.y += c.vy;
          c.life -= c.decay;

          if (c.life <= 0 || c.x < -100 || c.x > W + 100 || c.y < -100 || c.y > H + 100) {
            comets.splice(i, 1);
            continue;
          }

          // Cauda (gradiente linear na direção oposta ao movimento)
          const tailX = c.x - (c.vx / Math.hypot(c.vx, c.vy)) * COMET_TAIL;
          const tailY = c.y - (c.vy / Math.hypot(c.vx, c.vy)) * COMET_TAIL;

          const grad = ctx.createLinearGradient(c.x, c.y, tailX, tailY);

          if (c.isPurple) {
            grad.addColorStop(0, `rgba(192, 132, 252, ${c.life * 0.9})`);
            grad.addColorStop(0.3, `rgba(168, 85, 247, ${c.life * 0.5})`);
            grad.addColorStop(1, `rgba(107, 33, 168, 0)`);
          } else {
            grad.addColorStop(0, `rgba(240, 238, 245, ${c.life * 0.95})`);
            grad.addColorStop(0.3, `rgba(200, 195, 220, ${c.life * 0.4})`);
            grad.addColorStop(1, `rgba(150, 140, 180, 0)`);
          }

          // Linha da cauda
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(tailX, tailY);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Cabeça brilhante
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.headSize, 0, Math.PI * 2);
          ctx.fillStyle = c.isPurple
            ? `rgba(216, 180, 254, ${c.life})`
            : `rgba(255, 255, 255, ${c.life})`;
          ctx.shadowColor = c.isPurple
            ? `rgba(168, 85, 247, ${c.life * 0.8})`
            : `rgba(255, 255, 255, ${c.life * 0.6})`;
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        requestAnimationFrame(draw);
      }

      // ── Init ──
      window.addEventListener('resize', () => { resize(); createStars(); });
      resize();
      createStars();
      nextCometTime = performance.now() + 2000; // primeiro cometa após 2s
      requestAnimationFrame(draw);
    })();
  </script>

</body>
</html>
