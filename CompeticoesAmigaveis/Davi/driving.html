<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Realistic 3D Car Physics</title>
    <style>
        body { margin: 0; background: #87ceeb; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #overlay {
            position: absolute; bottom: 40px; left: 40px; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none;
        }
        .gauge-container { display: flex; align-items: flex-end; gap: 20px; }
        .kmh { font-size: 64px; font-weight: 800; line-height: 1; }
        .gear { font-size: 32px; color: #ff3e3e; border: 2px solid #ff3e3e; padding: 5px 15px; border-radius: 8px; }
        #instructions { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.4); color: white; padding: 15px; border-radius: 10px; font-size: 13px; }
        #crash-flash {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(ellipse at center, rgba(255,50,0,0.6) 0%, rgba(255,0,0,0.3) 40%, transparent 70%);
            opacity: 0; transition: opacity 0.08s;
        }
        #crash-flash.show { opacity: 1; }
        #loading {
            position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            background: #2d4a2d; color: white;
            font-family: 'Segoe UI', sans-serif; font-size: 24px;
            transition: opacity 0.5s;
        }
        #loading.hide { opacity: 0; pointer-events: none; }
        .touch-zone { position: fixed; z-index: 4; touch-action: none; opacity: 0; }
        #tz-gas    { right:0; bottom:0; width:50vw; height:45vh; }
        #tz-brake  { left:0;  bottom:0; width:50vw; height:45vh; }
        #tz-left   { left:0;  top:0;    width:50vw; height:50vh; }
        #tz-right  { right:0; top:0;    width:50vw; height:50vh; }
        .gear-btn { position: fixed; z-index: 6; touch-action: none; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); color: #ffcc00; font-size: 24px; font-weight: 800; border-radius: 8px; border: 2px solid #ffcc00; user-select: none; }
        #gear-up   { right: 10px; top: 80px; width: 60px; height: 50px; }
        #gear-down { right: 10px; top: 140px; width: 60px; height: 50px; }
    </style>
</head>
<body>

    <div id="instructions">
        <b>CONTROLS</b><br>
        W / S : Gas - Brake<br>
        A / D : Steering<br>
        SPACE : Handbrake (Drift)<br>
        E / Q : Speed Limit +/-<br>
        R : Reset Vehicle<br>
        C : Change Camera
    </div>

    <div id="crash-flash"></div>
    <div id="loading">🌄 Loading world...</div>

    <div id="overlay">
        <div class="gauge-container">
            <div class="gear" id="gear">N</div>
            <div>
                <div class="kmh" id="speed">0</div>
                <div style="letter-spacing: 3px; font-size: 12px; opacity: 0.8;">KILOMETERS PER HOUR</div>
            </div>
        </div>
        <div id="cam-label" style="position:absolute;bottom:30px;left:30px;font-size:16px;font-weight:600;background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:8px;color:#fff;"></div>
        <div id="speed-limit-label" style="position:absolute;bottom:30px;right:30px;font-size:18px;font-weight:700;background:rgba(0,0,0,0.5);padding:10px 16px;border-radius:10px;color:#ffcc00;border:1px solid rgba(255,204,0,0.3);transition:border-color 0.15s, box-shadow 0.15s;">
            <div style="font-size:10px;color:#aaa;margin-bottom:4px;letter-spacing:2px;">HIZ LIMITI</div>
            <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;">
                <span style="cursor:pointer;user-select:none;font-size:22px;line-height:1;opacity:0.6" id="limit-down">◀</span>
                <span id="speed-limit" style="font-size:30px;font-weight:800;min-width:50px;text-align:center;transition:transform 0.1s;">60</span>
                <span style="font-size:12px;opacity:0.8;">km/h</span>
                <span style="cursor:pointer;user-select:none;font-size:22px;line-height:1;opacity:0.6" id="limit-up">▶</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <script>
        if (typeof window.THREE === 'undefined') {
            document.getElementById('loading').innerHTML = 'Three.js yüklenemedi.<br>Oyunu <b>http://localhost/</b> üzerinden açın.';
            throw new Error('Three.js failed to load');
        }
        const THREE = window.THREE;

        // --- WORLD & LIGHTING ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xaaccff); // Bright sky
        scene.fog = new THREE.Fog(0xaaccff, 100, 500);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Sun & Ambient Light
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        scene.add(hemiLight);

        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(100, 200, 100);
        sun.castShadow = true;
        sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
        sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
        sun.shadow.mapSize.set(4096, 4096);
        scene.add(sun);
        scene.add(sun.target);

        // --- TERRAIN HEIGHT FUNCTION ---
        function getHeight(x, z) {
            return Math.sin(x * 0.005 + 0.3) * Math.cos(z * 0.007 + 0.7) * 5
                 + Math.sin(x * 0.018 + z * 0.014) * 2.5
                 + Math.cos(x * 0.03 - z * 0.025 + 1.2) * 1.2
                 + Math.sin(x * 0.045 + z * 0.038 + 2.0) * 0.6;
        }

        // --- PROCEDURAL INFINITE WORLD (CHUNK SYSTEM) ---
        const CHUNK_SIZE = 60;
        const VIEW_CHUNKS = 4;
        const UNLOAD_CHUNKS = 5;
        const ROAD_SEG_SIZE = 60;
        const ROAD_VIEW_SEGS = 6;
        const ROAD_UNLOAD_SEGS = 7;

        let chunks = new Map();
        let roadChunks = new Map();
        let playerT = 10;
        const obstacles = [];

        function seededRand(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return function() {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            }
        }

        // --- PROCEDURAL TEXTURE GENERATOR ---
        function makeTex(w, h, fn) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            fn(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.anisotropy = 4;
            return t;
        }

        function perlin2D(x, y) {
            const dot = (x*12.9898 + y*78.233) * 43758.5453;
            return (dot - Math.floor(dot)) * 2 - 1;
        }

        function smoothNoise(x, y) {
            const ix = Math.floor(x), iy = Math.floor(y);
            const fx = x - ix, fy = y - iy;
            const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
            const v00 = perlin2D(ix, iy), v10 = perlin2D(ix+1, iy);
            const v01 = perlin2D(ix, iy+1), v11 = perlin2D(ix+1, iy+1);
            const top = v00 + (v10 - v00) * sx, bot = v01 + (v11 - v01) * sx;
            return (top + (bot - top) * sy) * 0.5 + 0.5;
        }

        function fbm(x, y, octaves) {
            let v = 0, amp = 1, freq = 1, max = 0;
            for (let i = 0; i < octaves; i++) { v += smoothNoise(x*freq, y*freq) * amp; max += amp; amp *= 0.5; freq *= 2; }
            return v / max;
        }

        const texGrass = makeTex(256, 256, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = fbm(x*0.04, y*0.04, 4);
                const g = 0.35 + n * 0.35;
                const r = 0.12 + n * 0.1;
                const b = 0.06 + n * 0.12;
                const i = (y*w+x)*4;
                d.data[i]=r*255|0; d.data[i+1]=g*255|0; d.data[i+2]=b*255|0; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texAsphalt = makeTex(256, 256, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = fbm(x*0.08, y*0.08, 3) * 0.12 + Math.random()*0.04;
                const v = 0.22 + n;
                const i = (y*w+x)*4;
                d.data[i]=v*255|0; d.data[i+1]=v*255|0; d.data[i+2]=v*255|0; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texBark = makeTex(128, 256, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = smoothNoise(x*0.06, y*0.04)*0.25 + smoothNoise(x*0.15, y*0.1)*0.12 + Math.random()*0.04;
                const v = 0.3 + n;
                const i = (y*w+x)*4;
                d.data[i]=v*220|0; d.data[i+1]=v*160|0; d.data[i+2]=v*100|0; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texLeaf = makeTex(128, 128, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = fbm(x*0.05, y*0.05, 3);
                const g = 0.35 + n * 0.45;
                const r = 0.08 + n * 0.1;
                const b = 0.04 + n * 0.06;
                const i = (y*w+x)*4;
                d.data[i]=r*255|0; d.data[i+1]=g*255|0; d.data[i+2]=b*255|0; d.data[i+3]=200 + n*55|0;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texRock = makeTex(128, 128, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = fbm(x*0.06, y*0.06, 4);
                const v = 0.45 + n * 0.35;
                const i = (y*w+x)*4;
                d.data[i]=v*255|0; d.data[i+1]=v*255|0; d.data[i+2]=v*255|0; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texBrick = makeTex(256, 128, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            const bh = 24, bw = 48, mg = 2;
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const row = Math.floor(y / (bh+mg));
                const ox = (row%2)*(bw/2+mg/2);
                const lx = (x+ox) % (bw+mg), ly = y % (bh+mg);
                const isM = lx < mg || ly < mg;
                let r, g, b;
                if (isM) { r=160; g=150; b=140; }
                else {
                    const n = fbm(x*0.03, y*0.04, 3);
                    r=160+n*80|0; g=90+n*50|0; b=60+n*40|0;
                }
                const i = (y*w+x)*4;
                d.data[i]=r; d.data[i+1]=g; d.data[i+2]=b; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texRoof = makeTex(256, 128, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = fbm(x*0.04, y*0.05, 3);
                const r = 140 + n*60|0;
                const g = 60 + n*30|0;
                const b = 40 + n*20|0;
                const i = (y*w+x)*4;
                d.data[i]=r; d.data[i+1]=g; d.data[i+2]=b; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        const texTire = makeTex(128, 128, (ctx, w, h) => {
            const d = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const n = fbm(x*0.08, y*0.08, 3)*0.1 + Math.random()*0.03;
                const v = 0.12 + n;
                const i = (y*w+x)*4;
                d.data[i]=v*255|0; d.data[i+1]=v*255|0; d.data[i+2]=v*255|0; d.data[i+3]=255;
            }
            ctx.putImageData(d, 0, 0);
        });

        function disposeGroup(group) {
            group.traverse(child => {
                if (child.isMesh) {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                }
            });
        }

        function getRoadPoint(t) {
            if (t < 0) t = 0;
            const x = t * 0.12 + Math.sin(t * 0.006) * 50 + Math.sin(t * 0.014) * 15 + Math.cos(t * 0.025) * 8;
            const z = t + Math.sin(t * 0.005) * 50 + Math.sin(t * 0.012) * 15 + Math.cos(t * 0.020) * 10;
            return { x, z, y: getHeight(x, z) };
        }

        function distToRoad(x, z) {
            const start = Math.max(0, Math.round(z - 60));
            let minD = Infinity;
            for (let t = start; t <= start + 160; t += 4) {
                const p = getRoadPoint(t);
                const d = (x - p.x) ** 2 + (z - p.z) ** 2;
                if (d < minD) minD = d;
            }
            return Math.sqrt(minD);
        }

        function findClosestT(px, pz, guess) {
            let best = guess, bestD = Infinity;
            for (let dt = -10; dt <= 10; dt += 0.25) {
                const p = getRoadPoint(guess + dt);
                const d = (px - p.x) ** 2 + (pz - p.z) ** 2;
                if (d < bestD) { bestD = d; best = guess + dt; }
            }
            return best;
        }

        // Materials (shared)
        const terrainMat = new THREE.MeshStandardMaterial({ map: texGrass, vertexColors: true, roughness: 0.9, metalness: 0 });
        texGrass.repeat.set(4, 4);
        const roadMat = new THREE.MeshStandardMaterial({ map: texAsphalt, roughness: 0.9, metalness: 0, side: THREE.DoubleSide });
        texAsphalt.repeat.set(1, 30);
        const edgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0, side: THREE.DoubleSide });
        const dashMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0 });

        function terrainChunk(cx, cz) {
            const group = new THREE.Group();
            const gSize = CHUNK_SIZE;
            const res = 20;
            const x0 = cx * gSize, z0 = cz * gSize;

            const geo = new THREE.PlaneGeometry(gSize, gSize, res, res);
            geo.rotateX(-Math.PI / 2);
            const pos = geo.attributes.position;
            const colors = new Float32Array(pos.count * 3);
            for (let i = 0; i < pos.count; i++) {
                const wx = x0 + pos.getX(i), wz = z0 + pos.getZ(i);
                const y = getHeight(wx, wz);
                pos.setXYZ(i, wx, y, wz);
                const h = (y + 7) / 16;
                const noise = Math.sin(wx * 0.1 + wz * 0.12) * 0.04 + Math.sin(wx * 0.23 + wz * 0.17) * 0.02;
                const dirt = Math.sin(wx * 0.05 + wz * 0.06) * 0.5 + 0.5;
                const isDark = Math.sin(wx * 0.07) * Math.cos(wz * 0.09) > 0.3;
                const grassPatch = Math.sin(wx * 0.15 + wz * 0.11) * 0.5 + 0.5;
                colors[i * 3] = 0.06 + h * 0.2 + noise * 0.5 + (grassPatch > 0.7 ? 0.02 : 0);
                colors[i * 3 + 1] = 0.28 + h * 0.45 + noise + (grassPatch > 0.6 ? 0.1 : 0) + (dirt > 0.7 ? -0.08 : 0) + (isDark ? 0.05 : 0);
                colors[i * 3 + 2] = 0.03 + h * 0.1 + noise * 0.2;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            const mesh = new THREE.Mesh(geo, terrainMat);
            mesh.receiveShadow = true;
            group.add(mesh);
            return group;
        }

        // Object factories
        function createTree(x, z) {
            const g = new THREE.Group();
            const y = getHeight(x, z);
            const rand = Math.random;
            const s = (0.5 + rand() * 0.8) * 2.2;
            const bm = texBark.clone(); bm.repeat.set(1, 2);
            const trunkMat = new THREE.MeshStandardMaterial({ map: bm, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.18 * s, 1.2 * s, 7), trunkMat);
            trunk.position.y = y + 0.6 * s; trunk.castShadow = true; g.add(trunk);

            const lm = texLeaf.clone(); lm.repeat.set(0.5, 0.5);
            const leafMat = new THREE.MeshStandardMaterial({ map: lm, roughness: 0.8 });
            const crown = new THREE.Mesh(new THREE.ConeGeometry(1.0 * s, 1.6 * s, 7), leafMat);
            crown.position.y = y + 1.6 * s; crown.castShadow = true; g.add(crown);

            const crown2 = new THREE.Mesh(new THREE.ConeGeometry(0.7 * s, 1.2 * s, 7), leafMat.clone());
            crown2.position.y = y + 2.4 * s; crown2.castShadow = true; g.add(crown2);
            g.position.set(x, 0, z);
            return g;
        }

        function createRock(x, z) {
            const g = new THREE.Group();
            const y = getHeight(x, z);
            const rand = Math.random;
            const sc = 0.4 + rand() * 1.0;
            const rm = texRock.clone(); rm.repeat.set(0.5, 0.5);
            const rockMat = new THREE.MeshStandardMaterial({ map: rm, roughness: 0.9, metalness: 0.05 });
            const geo = new THREE.DodecahedronGeometry(0.4 * sc);
            for (let i = 0; i < geo.attributes.position.count; i++) {
                geo.attributes.position.setXYZ(i,
                    geo.attributes.position.getX(i) * (0.7 + rand() * 0.6),
                    geo.attributes.position.getY(i) * (0.5 + rand() * 0.5),
                    geo.attributes.position.getZ(i) * (0.7 + rand() * 0.6)
                );
            }
            geo.computeVertexNormals();
            const rock = new THREE.Mesh(geo, rockMat);
            rock.position.y = y + 0.1; rock.rotation.set(rand() * 6, rand() * 6, rand() * 6); rock.castShadow = true; g.add(rock);

            if (rand() > 0.4) {
                const small = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15 * sc), rockMat);
                small.position.set((rand() - 0.5) * 0.4 * sc, y + 0.05, (rand() - 0.5) * 0.4 * sc);
                small.rotation.set(rand() * 6, rand() * 6, rand() * 6); g.add(small);
            }
            g.position.set(x, 0, z);
            return g;
        }

        function createBush(x, z) {
            const y = getHeight(x, z);
            const r = 0.4 + Math.random() * 0.5;
            const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.25 + Math.random() * 0.08, 0.5, 0.25 + Math.random() * 0.12), roughness: 0.9 });
            const b = new THREE.Mesh(new THREE.SphereGeometry(r, 5, 5), mat);
            b.position.set(x, y + r * 0.4, z);
            b.scale.y = 0.35;
            b.castShadow = true;
            return b;
        }

        function createHouse(x, z) {
            const g = new THREE.Group();
            const y = getHeight(x, z);
            const r = Math.random;
            const bm = texBrick.clone(); bm.repeat.set(2, 1);
            const rm = texRoof.clone(); rm.repeat.set(1, 1);
            const wallCol = new THREE.Color().setHSL(r()*0.1, 0.1+r()*0.1, 0.5+r()*0.15);
            const roofCol = new THREE.Color().setHSL(r()*0.07, 0.3+r()*0.2, 0.25+r()*0.15);
            const wallMat = new THREE.MeshStandardMaterial({ map: bm, color: wallCol, roughness: 0.85 });
            const roofMat = new THREE.MeshStandardMaterial({ map: rm, color: roofCol, roughness: 0.9 });
            const winMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.1, metalness: 0.3 });
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.9 });
            const s = 2.2 + r() * 0.8;
            const w = 3.0 * s * (0.8 + r() * 0.4);
            const d = 3.0 * s * (0.8 + r() * 0.4);
            const wallH = 1.8 * s;
            const wallCenter = y + wallH / 2;

            // Main wall
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, d), wallMat);
            wall.position.set(x, wallCenter, z); wall.castShadow = true; wall.receiveShadow = true; g.add(wall);

            // Roof
            const roofH = 1.0 * s;
            if (r() > 0.5) {
                const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.7, roofH, 4), roofMat);
                roof.position.set(x, y + wallH + roofH / 2, z); roof.rotation.y = Math.PI / 4; roof.castShadow = true; g.add(roof);
            } else {
                const overhang = 0.3;
                const hw = w / 2 + overhang, hd = d / 2 + overhang;
                const verts = new Float32Array([
                    -hw, 0, -hd,  hw, 0, -hd,  0, roofH, 0,
                     hw, 0, -hd,  hw, 0,  hd,  0, roofH, 0,
                     hw, 0,  hd, -hw, 0,  hd,  0, roofH, 0,
                    -hw, 0,  hd, -hw, 0, -hd,  0, roofH, 0
                ]);
                const roofGeo = new THREE.BufferGeometry();
                roofGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                roofGeo.computeVertexNormals();
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.set(x, y + wallH, z); roof.castShadow = true; g.add(roof);
            }
            const roofPeak = y + wallH + roofH;

            // Door (front face, z+ direction)
            const door = new THREE.Mesh(new THREE.BoxGeometry(0.3 * s, 0.8 * s, 0.05), doorMat);
            door.position.set(x, y + 0.4 * s, z + d / 2 + 0.03);
            g.add(door);

            // Windows
            for (let wi = -1; wi <= 1; wi += 2) {
                const win = new THREE.Mesh(new THREE.BoxGeometry(0.3 * s, 0.35 * s, 0.03), winMat);
                win.position.set(x + wi * w * 0.28, y + wallH * 0.6, z - d / 2 - 0.03);
                g.add(win);
            }

            // Chimney (at roof peak)
            if (r() > 0.4) {
                const ch = 0.5 * s + r() * 0.3 * s;
                const chim = new THREE.Mesh(new THREE.BoxGeometry(0.25 * s, ch, 0.25 * s),
                    new THREE.MeshStandardMaterial({ color: 0x884444, roughness: 0.9 }));
                chim.position.set(x, roofPeak + ch / 2 - 0.05, z);
                g.add(chim);
            }

            return g;
        }

        function populateChunk(cx, cz, group) {
            const x0 = cx * CHUNK_SIZE, z0 = cz * CHUNK_SIZE;
            const rand = seededRand(cx * 100003 + cz * 1000033);
            const r2 = seededRand(cx * 100003 + cz * 1000033 + 1);
            const obs = [];

            const nTrees = 2 + Math.floor(r2() * 3);
            for (let i = 0; i < nTrees; i++) {
                let x, z, att = 0;
                do {
                    x = x0 + rand() * CHUNK_SIZE; z = z0 + rand() * CHUNK_SIZE;
                    if (++att > 30) break;
                } while (distToRoad(x, z) < 25);
                if (att > 30) continue;
                const tree = createTree(x, z);
                group.add(tree);
                const o = { pos: new THREE.Vector3(x, 0, z), radius: 1.0 };
                obstacles.push(o); obs.push(o);
            }

            const nRocks = 1 + Math.floor(r2() * 2);
            for (let i = 0; i < nRocks; i++) {
                let x, z, att = 0;
                do {
                    x = x0 + rand() * CHUNK_SIZE; z = z0 + rand() * CHUNK_SIZE;
                    if (++att > 30) break;
                } while (distToRoad(x, z) < 25);
                if (att > 30) continue;
                const rock = createRock(x, z);
                group.add(rock);
                const o = { pos: new THREE.Vector3(x, 0, z), radius: 0.6 };
                obstacles.push(o); obs.push(o);
            }

            const nBushes = 2 + Math.floor(r2() * 4);
            for (let i = 0; i < nBushes; i++) {
                let x, z, att = 0;
                do {
                    x = x0 + rand() * CHUNK_SIZE; z = z0 + rand() * CHUNK_SIZE;
                    if (++att > 30) break;
                } while (distToRoad(x, z) < 25);
                if (att > 30) continue;
                group.add(createBush(x, z));
            }

            if (r2() > 0.4) {
                let x, z, att = 0;
                do {
                    x = x0 + rand() * CHUNK_SIZE; z = z0 + rand() * CHUNK_SIZE;
                    const d = distToRoad(x, z);
                    if (d >= 12 && d <= 25) break;
                    if (++att > 30) break;
                } while (true);
                if (att <= 80) {
                    const house = createHouse(x, z);
                    group.add(house);
                    const o = { pos: new THREE.Vector3(x, 0, z), radius: 2.0 };
                    obstacles.push(o); obs.push(o);
                }
            }

            group.userData.obstacles = obs;
        }

        function buildRoadSurface(startT, endT, n) {
            const halfW = 4.5, step = (endT - startT) / n;
            const pos = [];
            for (let i = 0; i <= n; i++) {
                const t = startT + i * step;
                const p1 = getRoadPoint(t), p0 = getRoadPoint(t - 0.5), p2 = getRoadPoint(t + 0.5);
                const dx = p2.x - p0.x, dz = p2.z - p0.z;
                const len = Math.sqrt(dx * dx + dz * dz) || 1;
                const nx = -dz / len, nz = dx / len;
                const lx = p1.x + nx * halfW, lz = p1.z + nz * halfW;
                const rx = p1.x - nx * halfW, rz = p1.z - nz * halfW;
                pos.push(lx, getHeight(lx, lz) + 0.06, lz);
                pos.push(rx, getHeight(rx, rz) + 0.06, rz);
            }
            const idx = [];
            for (let i = 0; i < n; i++) {
                const a = i * 2;
                idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.setIndex(idx);
            g.computeVertexNormals();
            return g;
        }

        function buildEdgeStrip(startT, endT, n, offset, width) {
            const step = (endT - startT) / n;
            const pos = [];
            for (let i = 0; i <= n; i++) {
                const t = startT + i * step;
                const p = getRoadPoint(t), p0 = getRoadPoint(t - 0.5), p2 = getRoadPoint(t + 0.5);
                const dx = p2.x - p0.x, dz = p2.z - p0.z;
                const len = Math.sqrt(dx * dx + dz * dz) || 1;
                const nx = -dz / len, nz = dx / len;
                const cx = p.x + nx * offset, cz = p.z + nz * offset;
                const cy = getHeight(cx, cz) + 0.08;
                const px = -nx * width, pz = -nz * width;
                pos.push(cx + px, cy, cz + pz, cx - px, cy, cz - pz);
            }
            const idx = [];
            for (let i = 0; i < n; i++) {
                const a = i * 2;
                idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.setIndex(idx);
            g.computeVertexNormals();
            return g;
        }

        function createRoadSegment(segIdx) {
            const startT = segIdx * ROAD_SEG_SIZE, endT = (segIdx + 1) * ROAD_SEG_SIZE;
            const n = 30;
            const group = new THREE.Group();

            const road = new THREE.Mesh(buildRoadSurface(startT, endT, n), roadMat);
            road.receiveShadow = true;
            group.add(road);

            const e1 = new THREE.Mesh(buildEdgeStrip(startT, endT, n, -4.2, 0.15), edgeMat);
            const e2 = new THREE.Mesh(buildEdgeStrip(startT, endT, n, 4.2, 0.15), edgeMat);
            group.add(e1, e2);

            for (let i = 0; i < 14; i++) {
                const t = startT + (i / 14) * (endT - startT);
                const p = getRoadPoint(t), p0 = getRoadPoint(t - 0.5), p2 = getRoadPoint(t + 0.5);
                const dx = p2.x - p0.x, dz = p2.z - p0.z;
                const sy = getHeight(p.x, p.z) + 0.08;
                const dash = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 1.4), dashMat);
                dash.position.set(p.x, sy, p.z);
                dash.rotation.y = Math.atan2(dx, dz);
                group.add(dash);
            }

            return group;
        }

        function updateWorld(px, pz) {
            const ccx = Math.floor(px / CHUNK_SIZE), ccz = Math.floor(pz / CHUNK_SIZE);

                    if (!chunks.has(key)) {

                        group.userData.obstacles = [];
                        group.userData.populated = false;
                        scene.add(group);
                        chunks.set(key, group);
                        popQueue.push({ cx, cz, group, key });
                    }
                }
            }

            for (const [key, group] of chunks) {
                if (!loaded.has(key)) {
                    const chunkObs = group.userData.obstacles || [];
                    for (const o of chunkObs) {
                        const idx = obstacles.indexOf(o);
                        if (idx !== -1) obstacles.splice(idx, 1);
                    }
                    disposeGroup(group);
                    scene.remove(group);
                    chunks.delete(key);
                }
            }

            }
            if (e.code === 'KeyQ') {
                speedLimit = Math.max(10, speedLimit - 10);
                updateSpeedLimitDisplay();
            }
        };
        window.onkeyup = (e) => keys[e.code] = false;

        // Mobile touch controls
        function setupTouchControls() {
            const overlay = document.createElement('div');
            overlay.id = 'touch-overlay';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:3;touch-action:none;display:none;';
            overlay.addEventListener('touchstart', e => e.preventDefault());
            const zones = ['gas','brake','left','right'];
            zones.forEach(id => {
                const el = document.createElement('div');
                el.id = 'tz-' + id;
                el.className = 'touch-zone';
                overlay.appendChild(el);
            });
            document.body.appendChild(overlay);
            if ('ontouchstart' in window) overlay.style.display = 'block';

            // Gear buttons for mobile
            const gearUp = document.createElement('div');
            gearUp.id = 'gear-up'; gearUp.className = 'gear-btn'; gearUp.innerText = '+';
            const gearDown = document.createElement('div');
            gearDown.id = 'gear-down'; gearDown.className = 'gear-btn'; gearDown.innerText = '-';
            document.body.appendChild(gearUp);
            document.body.appendChild(gearDown);
            gearUp.addEventListener('touchstart', e => { e.preventDefault(); speedLimit = Math.min(400, speedLimit + 10); updateSpeedLimitDisplay(); });
            gearDown.addEventListener('touchstart', e => { e.preventDefault(); speedLimit = Math.max(10, speedLimit - 10); updateSpeedLimitDisplay(); });
            if (!('ontouchstart' in window)) { gearUp.style.display = 'none'; gearDown.style.display = 'none'; }

            const tz_gas = document.getElementById('tz-gas');
            const tz_brake = document.getElementById('tz-brake');
            const tz_left = document.getElementById('tz-left');
            const tz_right = document.getElementById('tz-right');

            function attach(el, key) {
                el.addEventListener('touchstart', e => { e.preventDefault(); window.__touch[key] = true; });
                el.addEventListener('touchend', e => { e.preventDefault(); window.__touch[key] = false; });
                el.addEventListener('touchcancel', e => { window.__touch[key] = false; });
            }
            attach(tz_gas, 'gas');
            attach(tz_brake, 'brake');
            attach(tz_left, 'left');
            attach(tz_right, 'right');

            let lastTap = 0;
            overlay.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTap < 300 && !window.__touch.gas && !window.__touch.brake && !window.__touch.left && !window.__touch.right) {
                    camMode = (camMode + 1) % camLabels.length;
                    document.getElementById('cam-label').innerText = camLabels[camMode];
                }
                lastTap = now;
            });
        }
        setupTouchControls();

        // --- GAME LOOP ---
        function update() {
            // 1. INPUT & POWER
            const touch = window.__touch;
            let throttle = (keys['KeyW'] || keys['ArrowUp'] || (touch && touch.gas)) ? 1 : (keys['KeyS'] || keys['ArrowDown'] || (touch && touch.brake) ? -0.6 : 0);
            let brake = keys['Space'] ? 1 : 0;

            // 2. REALISTIC ENGINE POWER (torque curve)
            const speed = Math.abs(phys.vel);
            const torqueCurve = 1 - speed * 0.8; // Power drops at high speed
            const engineForce = throttle * 0.012 * Math.max(0, torqueCurve);
            // Progressive brake: stronger at speed, soft at low speed
            const brakePressure = brake * Math.min(1, speed * 3 + 0.3);
            const brakeForce = brakePressure * 0.012 * Math.sign(phys.vel);
            const dragForce = phys.vel * speed * 0.0025;
            const totalForce = engineForce - brakeForce - dragForce;

            phys.accel = totalForce;
            phys.vel += phys.accel;
            phys.vel *= 0.990;
            // Speed limit enforcement
            const speedMax = speedLimit / 300;
            if (phys.vel > speedMax) phys.vel = speedMax;
            if (phys.vel < -speedMax) phys.vel = -speedMax;

            // 3. STEERING (speed-sensitive, lagged)
            const steerMax = 0.032 / (1 + speed * 2.5);
            const steerTarget = (keys['KeyA'] || (touch && touch.left) ? 1 : 0) + (keys['KeyD'] || (touch && touch.right) ? -1 : 0);
            phys.steer += (steerTarget * steerMax - phys.steer) * 0.12;

            // 4. LATERAL PHYSICS / DRIFT
            const latAccel = phys.steer * speed * 1.5;
            // Wheel lock when braking + steering → more slide
            if (brake > 0 && Math.abs(phys.steer) > 0.005 && speed > 0.05) {
                phys.drift += (phys.steer * speed * 0.04 - phys.drift) * 0.1;
            }
            const grip = 0.9 / (1 + speed * 0.3);
            if (Math.abs(latAccel) > grip) {
                phys.drift += (latAccel * 0.015 - phys.drift) * 0.06;
            } else {
                phys.drift *= 0.97;
            }
            phys.angle += (phys.steer * speed * 1.4 + phys.drift) * 1.5;

            // 5. POSITION UPDATE
            car.position.x += Math.sin(phys.angle) * phys.vel * SPEED_MULT;
            car.position.z += Math.cos(phys.angle) * phys.vel * SPEED_MULT;
            car.position.y = getHeight(car.position.x, car.position.z) + 0.05;
            car.rotation.y = phys.angle;

            // 6. BODY MOTION (Roll / Pitch)
            const latG = phys.steer * speed * 1.0;
            const accelG = totalForce * 8;
            phys.bodyRoll += (latG - phys.bodyRoll) * 0.04;
            phys.bodyPitch += (-accelG - phys.bodyPitch) * 0.04;

            // 6. TIRE MARKS (drift/brake/spin)
            const driftIntensity = Math.abs(phys.drift);
            if (driftIntensity > 0.02 || (keys['Space'] && Math.abs(phys.vel) > 0.05)) {
                const rl = wheelContact(1.18, -1.3);
                const rr = wheelContact(-1.18, -1.3);
                addMark(rl.x, rl.y, rl.z); addMark(rr.x, rr.y, rr.z);
            }
            if (throttle > 0.3 && Math.abs(phys.vel) < 0.3) {
                const fl = wheelContact(1.18, 1.3);
                const fr = wheelContact(-1.18, 1.3);
                addMark(fl.x, fl.y, fl.z); addMark(fr.x, fr.y, fr.z);
            }
            if (tmDirty) {
                tmGeo.attributes.position.needsUpdate = true;
                tmGeo.setDrawRange(0, tmCount * 6);
                tmDirty = false;
            }

            // World update (chunk loading)
            const px = car.position.x, pz = car.position.z;
            updateWorld(px, pz);
            playerT = findClosestT(px, pz, playerT);
            updateRoad(playerT);

            // Process 4 chunks from queue (prevents freeze)
            for (let i = 0; i < 4 && popQueue.length > 0; i++) {
                const item = popQueue.shift();
                if (!item || chunks.get(item.key) !== item.group) continue;
                populateChunk(item.cx, item.cz, item.group);
                item.group.userData.populated = true;
            }

            // Sun shadow follows the car
            sun.position.set(px + 100, 200, pz + 100);
            sun.target.position.set(px, getHeight(px, pz), pz);
            sun.target.updateMatrixWorld();
            const hs = 150;
            sun.shadow.camera.left = px - hs; sun.shadow.camera.right = px + hs;
            sun.shadow.camera.top = pz + hs; sun.shadow.camera.bottom = pz - hs;
            sun.shadow.camera.updateProjectionMatrix();

            // COLLISION CHECK
            crashCooldown = Math.max(0, crashCooldown - 1);
            if (crashCooldown === 0 && Math.abs(phys.vel) > 0.04) {
                const carPos = car.position;
                for (const obs of obstacles) {
                    const dx = carPos.x - obs.pos.x;
                    const dz = carPos.z - obs.pos.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < obs.radius + 0.6) {
                        crashCooldown = 15;
                        const hitSpeed = Math.abs(phys.vel);
                        phys.vel *= -0.3;
                        phys.drift = 0;
                        const pushAngle = Math.atan2(dx, dz);
                        car.position.x += Math.sin(pushAngle) * 0.3;
                        car.position.z += Math.cos(pushAngle) * 0.3;
                        if (hitSpeed > 0.1) {
                            crashFlash.classList.add('show');
                            setTimeout(() => crashFlash.classList.remove('show'), 100);
                        }
                        break;
                    }
                }
            }

            // 6. BODY PHYSICS (Suspension, tilt, weight transfer)
            const terrainPitch = Math.atan2(getHeight(px, pz - 0.5) - getHeight(px, pz + 0.5), 1.0);
            const terrainRoll = Math.atan2(getHeight(px + 0.5, pz) - getHeight(px - 0.5, pz), 1.0);
            chassis.rotation.x = (phys.bodyPitch * 0.015 + terrainPitch * 0.5) * 1.2;
            chassis.rotation.z = (phys.bodyRoll * 0.02 + terrainRoll * 0.5) * 1.2;

            // Suspension + speed-based vibration
            const shake = crashCooldown > 0 ? 0.3 + Math.random() * 0.3 : speed * 0.03;
            const t = Date.now() * 0.001;
            phys.suspension = (
                Math.sin(t * 15 + 0) * 0.4 +
                Math.sin(t * 23 + 1) * 0.25 +
                Math.sin(t * 37 + 2) * 0.15
            ) * shake;
            chassis.position.y = phys.suspension;

            // 7. WHEEL ANIMATION
            const wRotate = phys.vel * 2.2;
            [wFL, wFR, wRL, wRR].forEach(w => w.children[0].rotation.x += wRotate);
            wFL.rotation.y = phys.steer * 8; // Front wheel direction
            wFR.rotation.y = phys.steer * 8;

            // 8. DYNAMIC CAMERA
            let camDist, camHeight;
            switch (camMode) {
                case 0: // Close (default)
                    camDist = 3 + phys.vel * 2;
                    camHeight = 3.5 + phys.vel * 1.5;
                    break;
                case 1: // Rear (speed-sensitive)
                    camDist = 6 + phys.vel * 3;
                    camHeight = 3 + phys.vel * 1.5;
                    break;
                case 2: // Hood
                    camDist = 1.5;
                    camHeight = 1.2;
                    break;
                case 3: // Far
                    camDist = 20;
                    camHeight = 8;
                    break;
                case 4: // Bird's eye
                    camDist = 0.01;
                    camHeight = 25;
                    break;
                case 5: // Interior
                    camDist = 0.3;
                    camHeight = 1.4;
                    break;
            }
            const camOffset = new THREE.Vector3(
                -Math.sin(phys.angle) * camDist,
                camHeight,
                -Math.cos(phys.angle) * camDist
            );
            if (camMode === 4) {
                camera.position.lerp(new THREE.Vector3(car.position.x, camHeight, car.position.z), 0.06);
                camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 0, 0)));
            } else {
                camera.position.lerp(car.position.clone().add(camOffset), 0.08);
                camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 1, 0)));
            }

            // 9. UI UPDATE
            const speedKmh = Math.abs(Math.round(phys.vel * 300));
            document.getElementById('speed').innerText = speedKmh;
            const gear = speedKmh === 0 ? 'N' : (phys.vel < 0 ? 'R' : Math.ceil(speedKmh / 50));
            document.getElementById('gear').innerText = gear;

            // Reset
            if (keys['KeyR']) {
                const rp = getRoadPoint(playerT);
                car.position.set(rp.x, rp.y + 0.05, rp.z);
                phys.vel = 0;
                phys.angle = 0;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        // Async world loading + game start
        const loadingEl = document.getElementById('loading');
        function processQueueBudget() {
            let count = 0;
            while (popQueue.length > 0 && count < 6) {
                const item = popQueue.shift();
                if (item && chunks.get(item.key) === item.group) {
                    populateChunk(item.cx, item.cz, item.group);
                    item.group.userData.populated = true;
                    count++;
                }
            }
            if (popQueue.length > 0) requestAnimationFrame(processQueueBudget);
        }

        function loadWorld() {
            updateWorld(startPos.x, startPos.z);
            updateRoad(15);
            car.position.set(startPos.x, startPos.y + 0.05, startPos.z);
            scene.add(car);
            // Set camera to correct initial position (avoid underground first frame)
            const initOff = new THREE.Vector3(-Math.sin(phys.angle) * 3, 3.5, -Math.cos(phys.angle) * 3);
            camera.position.copy(car.position.clone().add(initOff));
            camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 1, 0)));
            loadingEl.classList.add('hide');
            setTimeout(() => loadingEl.remove(), 500);
            processQueueBudget();
            animate();
        }
        // Render one frame first (so loading screen shows), then load world
        requestAnimationFrame(() => requestAnimationFrame(loadWorld));
    </script>
</body>
</html>
