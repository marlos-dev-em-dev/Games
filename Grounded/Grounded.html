/* Bouncing title renderer */
function drawBounceTitle(text,baseY,fontSize,spacing){
    X.font=fontSize+'px "Luckiest Guy"';
    const letters=[];
    let totalW=0;
    for(let i=0;i<text.length;i++){const cw=X.measureText(text[i]).width;letters.push({ch:text[i],w:cw});totalW+=cw+(i<text.length-1?spacing:0)}
    let cx=W/2-totalW/2;
    for(let i=0;i<letters.length;i++){
        const l=letters[i];
        const offY=Math.sin(t*.06+i*.5)*14+Math.cos(t*.04+i*.7)*6;
        const offX=Math.sin(t*.08+i*.6)*2;
        const rot=Math.sin(t*.05+i*.4)*.06;
        /* Shadow */
        X.fillStyle='rgba(0,0,0,0.4)';
        X.save();X.translate(cx+l.w/2+2,baseY+offY+4);X.rotate(rot);X.textAlign='center';X.textBaseline='middle';
        X.fillText(l.ch,0,0);X.restore();
        /* Color per letter */
        const hue=(i*30+t*1.2)%360;
        if(i<8)X.fillStyle='#e94560';else X.fillStyle='#ffd700';
        /* Exclamation mark gets special treatment */
        if(l.ch==='!'){X.fillStyle='#ffd700'}
        X.save();X.translate(cx+l.w/2+offX,baseY+offY);X.rotate(rot);X.textAlign='center';X.textBaseline='middle';
        X.fillText(l.ch,0,0);
        /* Outline */
        X.strokeStyle='rgba(0,0,0,0.5)';X.lineWidth=2;X.strokeText(l.ch,0,0);
        X.restore();
        cx+=l.w+spacing;
    }
}

else if(!tr){P.vx=0;P.cr=0;if(K['a']||K['arrowleft']){P.vx=-SP;P.dir=-1}if(K['d']||K['arrowright']){P.vx=SP;P.dir=1}if(K['s']||K['arrowdown'])P.cr=1;if((K['w']||K['arrowup'])&&P.gnd){P.vy=JV;P.gnd=0}if(jp(' ')&&P.gnd)boostVx=P.dir*10;P.fr=P.vx!==0?P.fr+1:0;P.vy+=GR;P.x+=P.vx+boostVx;P.y+=P.vy;boostVx*=.88;if(Math.abs(boostVx)<.3)boostVx=0;const ph=P.cr?32:P.h;if(P.y+ph>FY){P.y=FY-ph;P.vy=0;P.gnd=1}if(P.x<15)P.x=15;if(P.x+P.w>W-15)P.x=W-15-P.w;nearDoor=null;if(cool<=0){const pcx=P.x+P.w/2;for(const d of(DR[rm]||[])){if(Math.abs(pcx-(d.x+d.w/2))<d.w/2+30)nearDoor=d}}if(nearDoor&&jp('q'))tr={a:0,ph:'out',rm:nearDoor.rm,sx:nearDoor.sx};const pcx2=P.x+P.w/2;(PL[rm]||[]).forEach((pl,i)=>{const lcx=pl.ladder.x+pl.ladder.w/2;if(Math.abs(pcx2-lcx)<pl.ladder.w/2+30){showClimbUp={x:lcx,y:FY-10,pl};if(jp('q')){climbing=i;P.y=pl.y-P.h;P.x=pl.ladder.x+5;P.vy=0;boostVx=0;showClimbUp=null}}});if(jp('e')&&!tr)tryInteract();if(jp('1'))sel=0;if(jp('2'))sel=1;if(jp('3'))sel=2}

function tryInteract(){const px=P.x+P.w/2,py=P.y+P.h/2,sItem=inv[sel];for(const n of(NPC[rm]||[])){if(Math.abs(px-n.x)<55){if(n.trade&&sItem===n.trade.give){inv[sel]=n.trade.receive;notify(n.trade.msg);return}if(n.tr){const trigs=Array.isArray(n.tr)?n.tr:[n.tr];const m=trigs.find(tr=>sItem===tr.item);if(m){triggerEnd(m.end);return}}dlg={who:n.name,l:n.dl,i:0};st='DLG';return}}for(const tr of(TR[rm]||[])){if(px>tr.x-20&&px<tr.x+tr.w+20&&py>tr.y-20&&py<tr.y+tr.h+20){if(tr.multi){for(const m of tr.multi){if(sItem===m.item){if(m.end){triggerEnd(m.end);return}if(m.give){inv[sel]=m.give;notify(m.msg);return}}}}else if(sItem===tr.item){triggerEnd(tr.end);return}notify(tr.hint);return}}const items=RI[rm]||[];for(let i=items.length-1;i>=0;i--){const it=items[i];if(Math.abs(px-it.x)<40&&Math.abs(py-it.y)<30){if(it.req&&!inv.includes(it.req)){notify('Precisa de '+IT[it.req].n+' para isso.');return}const emp=inv.indexOf(null);if(emp===-1){notify('Inventário cheio!');return}inv[emp]=it.id;items.splice(i,1);sel=emp;notify('Pegou: '+IT[it.id].n);return}}if(sItem){inv[sel]=null;RI[rm]=RI[rm]||[];RI[rm].push({id:sItem,x:P.x+P.w/2,y:FY-15});notify('Soltou: '+IT[sItem].n)}}
