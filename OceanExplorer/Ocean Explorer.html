<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--mx:50%;--my:50%;--outer:160px;--inner:22px}
body{background:#010a14;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;overflow:hidden}
.scene{position:relative;width:92vw;max-width:1100px;height:600px;border-radius:16px;overflow:hidden;cursor:none;border:1px solid rgba(80,180,255,.06);box-shadow:0 0 80px rgba(0,40,80,.25)}
.scene.admin-glow{box-shadow:0 0 80px rgba(0,40,80,.25),0 0 4px rgba(255,50,50,.4)}
.cursor-dot{position:fixed;width:6px;height:6px;background:rgba(255,255,255,.9);border-radius:50%;pointer-events:none;z-index:999;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,255,255,.4);display:none}
.cursor-dot.admin{background:#ff4040;box-shadow:0 0 12px rgba(255,50,50,.6)}
.scene.shake{animation:shake .35s ease-in-out}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,2px)}}
.hud{position:absolute;top:12px;left:14px;right:14px;z-index:10;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.hud-g{display:flex;align-items:center;gap:8px}
.hud-l{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.2)}
.hud-v{font-size:13px;font-weight:500;color:rgba(255,215,0,.6)}
.hud-s{color:rgba(255,255,255,.08)}
.admin-badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:11;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,60,60,.5);pointer-events:none;opacity:0;transition:opacity .5s}
.admin-badge.show{opacity:1}
.moon-badge{position:absolute;top:12px;right:160px;z-index:11;font-size:14px;pointer-events:none;opacity:0;transition:opacity .5s}
.moon-badge.show{opacity:1}
.hearts{display:flex;gap:4px}
.heart{font-size:15px;transition:transform .3s,opacity .3s,filter .3s;filter:drop-shadow(0 0 4px rgba(255,60,80,.4))}
.heart.lost{opacity:.15;transform:scale(.8);filter:none}
.heart.losing{animation:hBr .5s ease forwards}
@keyframes hBr{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(.8);opacity:.15;filter:none}}
.prog-dots{display:flex;gap:4px}
.pd{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,215,0,.2);background:transparent;transition:all .5s}
.pd.filled{background:#ffd700;border-color:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.5)}
.layer-deep{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#010810,#010c18 50%,#010508);overflow:hidden;transition:background 3s}
.sand-floor{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(180deg,transparent,rgba(50,40,15,.12) 40%,rgba(70,55,20,.2))}
.layer-collect{position:absolute;inset:0;z-index:1;pointer-events:none;-webkit-mask-image:radial-gradient(circle calc(var(--inner) + 15px) at var(--mx) var(--my),black 0%,black 55%,transparent 100%);mask-image:radial-gradient(circle calc(var(--inner) + 15px) at var(--mx) var(--my),black 0%,black 55%,transparent 100%)}
.layer-mid{position:absolute;inset:0;z-index:2;overflow:hidden;-webkit-mask-image:radial-gradient(circle var(--outer) at var(--mx) var(--my),black 0%,black 85%,transparent 100%);mask-image:radial-gradient(circle var(--outer) at var(--mx) var(--my),black 0%,black 85%,transparent 100%)}
.layer-top{position:absolute;inset:0;z-index:3;overflow:hidden;-webkit-mask-image:radial-gradient(circle var(--outer) at var(--mx) var(--my),transparent 0%,transparent 70%,black 100%);mask-image:radial-gradient(circle var(--outer) at var(--mx) var(--my),transparent 0%,transparent 70%,black 100%);transition:opacity 2s}
.ocean-bg{position:absolute;inset:0;background:linear-gradient(180deg,#0a2a4a,#0d3461 20%,#0e3a6b 35%,#0c3060 55%,#081e3d 75%,#05132a)}
.sky{position:absolute;top:0;left:0;right:0;height:160px;background:linear-gradient(180deg,#0a1628,#0d2040 50%,#102d55 85%,#0e3a6b);overflow:hidden;transition:background 3s}
.sky.moonless{background:linear-gradient(180deg,#060e18,#081420 50%,#0a1a30 85%,#0c2040)}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
.moon{position:absolute;top:22px;right:100px;width:40px;height:40px;background:radial-gradient(circle at 35% 35%,#f0e6d0,#d4c8a0);border-radius:50%;box-shadow:0 0 20px rgba(240,230,208,.2);transition:opacity 2s,transform 2s}
.moon.gone{opacity:0;transform:scale(.3) translateY(-30px)}
.moon-glow{position:absolute;top:12px;right:90px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(240,230,208,.08),transparent 70%);pointer-events:none;transition:opacity 2s}
.moon-glow.gone{opacity:0}
.moon-ref{position:absolute;top:150px;right:90px;width:5px;height:200px;background:linear-gradient(180deg,rgba(240,230,208,.06),transparent);filter:blur(3px);animation:refW 4s ease-in-out infinite;transition:opacity 2s}
.moon-ref.gone{opacity:0}
@keyframes refW{0%,100%{transform:scaleX(1)}50%{transform:scaleX(2.5)}}
.moon-collectible{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f5edd5,#c8b880);box-shadow:0 0 20px rgba(240,230,208,.4),0 0 40px rgba(240,230,208,.15)}
.waves{position:absolute;top:140px;left:0;width:200%;height:100px;pointer-events:none}
.wave{position:absolute;width:100%;height:100%}
.wave svg{position:absolute;bottom:0;width:100%;height:100%}
.wave-1{animation:w1 8s linear infinite;opacity:.25}.wave-2{animation:w2 10s linear infinite;opacity:.45;top:8px}.wave-3{animation:w3 12s linear infinite;opacity:.7;top:16px}.wave-4{animation:w4 7s linear infinite;opacity:1;top:22px}
@keyframes w1{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}@keyframes w2{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}@keyframes w3{0%{transform:translateX(-25%)}100%{transform:translateX(-75%)}}@keyframes w4{0%{transform:translateX(-10%)}100%{transform:translateX(-60%)}}
.foam{position:absolute;top:160px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(200,230,255,.06) 15%,transparent 30%,rgba(200,230,255,.04) 50%,transparent 65%,rgba(200,230,255,.07) 85%,transparent);animation:fs 5s ease-in-out infinite}
@keyframes fs{0%,100%{opacity:.5}50%{opacity:1}}
.sw{position:absolute;bottom:0;width:10px;background:linear-gradient(180deg,rgba(18,90,50,.35),rgba(8,50,25,.15));border-radius:50% 50% 0 0;transform-origin:bottom center;animation:swS 3s ease-in-out infinite}
.sw::before{content:'';position:absolute;top:20%;left:-6px;width:22px;height:12px;background:rgba(18,90,50,.2);border-radius:50%;transform:rotate(-20deg)}
@keyframes swS{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.fish{position:absolute;animation-iteration-count:infinite;pointer-events:none}
@keyframes sR{0%{transform:translateX(-100px) scaleX(-1)}100%{transform:translateX(1200px) scaleX(-1)}}
@keyframes sL{0%{transform:translateX(1200px)}100%{transform:translateX(-100px)}}
@keyframes fB{0%,100%{margin-top:0}50%{margin-top:-6px}}
.collectible{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
.coin-c{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd700,#b8860b);border:2px solid #daa520;box-shadow:0 0 15px rgba(255,215,0,.4);animation:coinSp 3s ease-in-out infinite}
.coin-c::after{content:'$';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:rgba(100,70,0,.6)}
@keyframes coinSp{0%,100%{transform:rotateY(0)}25%{transform:rotateY(15deg)}75%{transform:rotateY(-15deg)}}
.bag-c{width:40px;height:45px;position:relative}
.bag-body{width:40px;height:36px;background:linear-gradient(135deg,#8b6914,#6b4f0e);border-radius:6px 6px 8px 8px;border:2px solid #a07818;box-shadow:0 0 15px rgba(160,120,24,.3)}
.bag-top{width:30px;height:10px;background:#d4a017;border-radius:5px 5px 0 0;margin:0 auto;position:relative;top:-2px}
.bag-c::after{content:'$';position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;color:rgba(255,215,0,.7)}
.treasure-c{width:56px;height:44px}
.t-body{position:absolute;bottom:0;width:56px;height:30px;background:linear-gradient(135deg,#c8960c,#8b6914 50%,#6b4f0e);border-radius:4px;border:2px solid #d4a017;box-shadow:0 0 12px rgba(212,160,23,.2)}
.t-body::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:10px;background:radial-gradient(ellipse,#ffd700,#b8860b);border-radius:50%;border:2px solid #daa520}
.t-lid{position:absolute;bottom:28px;left:-2px;width:60px;height:16px;background:linear-gradient(180deg,#d4a017,#a07818);border-radius:5px 5px 0 0;border:2px solid #d4a017;transform-origin:bottom left;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.c-glow{position:absolute;inset:-15px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.15),transparent 70%);animation:cGlo 2s ease-in-out infinite}
@keyframes cGlo{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
.collectible.collected{animation:collPop .5s ease forwards;pointer-events:none}
@keyframes collPop{0%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.ring-o{position:absolute;width:calc(var(--outer)*2);height:calc(var(--outer)*2);border-radius:50%;pointer-events:none;z-index:5;transform:translate(-50%,-50%);left:var(--mx);top:var(--my);border:1px solid rgba(80,200,255,.06);transition:left .08s,top .08s}
.ring-i{position:absolute;width:calc(var(--inner)*2);height:calc(var(--inner)*2);border-radius:50%;pointer-events:none;z-index:5;transform:translate(-50%,-50%);left:var(--mx);top:var(--my);border:1px solid rgba(255,215,0,.12);transition:left .08s,top .08s}
.timer-ring{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);left:var(--mx);top:var(--my);width:calc(var(--inner)*2+14px);height:calc(var(--inner)*2+14px);opacity:0;transition:opacity .3s,left .08s,top .08s}
.timer-ring.active{opacity:1}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke:#ffd700;stroke-width:2;stroke-dasharray:170;stroke-dashoffset:170;stroke-linecap:round}
.egg-hold{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;left:var(--mx);top:var(--my)}
.egg-hold.active{opacity:1}
.egg-hold svg{width:34px;height:34px;transform:rotate(-90deg)}
.egg-hold .eh-bg{fill:none;stroke:rgba(80,180,255,.15);stroke-width:2}
.egg-hold .eh-fill{fill:none;stroke:rgba(80,180,255,.7);stroke-width:2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.hazard{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.h-core{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff4068,#a01838);box-shadow:0 0 16px rgba(255,50,80,.4);animation:hP 1.8s ease-in-out infinite}
@keyframes hP{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.h-tw{position:absolute;bottom:50%;left:calc(50% - 2px);transform-origin:bottom center}
.h-t{width:3px;height:20px;background:linear-gradient(to top,rgba(220,40,70,.5),transparent);border-radius:2px;animation:tW 1.8s ease-in-out infinite}
@keyframes tW{0%,100%{transform:translateX(0)}30%{transform:translateX(3px)}70%{transform:translateX(-3px)}}
.h-zone{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:1px dashed rgba(255,50,80,.08)}
.h-alert-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,50,80,.08),transparent 70%);opacity:0;transition:opacity .3s}
.hazard.alert .h-alert-glow{opacity:1}
.vortex{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3;width:70px;height:70px}
.v-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(80,180,255,.15);animation:vSp linear infinite}
.v-ring:nth-child(1){inset:0;animation-duration:2s}.v-ring:nth-child(2){inset:8px;animation-duration:1.5s;animation-direction:reverse;border-color:rgba(80,180,255,.12)}.v-ring:nth-child(3){inset:16px;animation-duration:1s;border-color:rgba(80,180,255,.08)}
.v-center{position:absolute;top:50%;left:50%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(100,200,255,.4),transparent);box-shadow:0 0 20px rgba(80,180,255,.2)}
@keyframes vSp{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.puffer{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:3;animation:pBre 4s ease-in-out infinite,pFlo 7s ease-in-out infinite}
@keyframes pBre{0%,100%{transform:translate(-50%,-50%) scaleY(1) scaleX(1)}30%{transform:translate(-50%,-50%) scaleY(.92) scaleX(1.05)}60%{transform:translate(-50%,-50%) scaleY(1.05) scaleX(.96)}}
@keyframes pFlo{0%,100%{margin-left:0;margin-top:0}25%{margin-left:3px;margin-top:-2px}50%{margin-left:-2px;margin-top:1px}75%{margin-left:1px;margin-top:-3px}}
.puffer-body{width:28px;height:24px;background:radial-gradient(circle at 40% 35%,#f0c040,#c08020);border-radius:50%;position:relative;transition:all .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 10px rgba(200,160,40,.2)}
.puffer-eye{position:absolute;top:5px;left:6px;width:5px;height:5px;background:white;border-radius:50%}
.puffer-eye::after{content:'';position:absolute;top:1px;left:1.5px;width:2px;height:2px;background:#333;border-radius:50%}
.puffer-inflated .puffer-body{width:52px;height:44px;box-shadow:0 0 25px rgba(200,160,40,.5)}
.puffer-spine{opacity:0;transition:opacity .4s}.puffer-inflated .puffer-spine{opacity:1}
.current-bar{position:absolute;top:50%;z-index:8;pointer-events:none;height:6px;width:0;transition:width .5s,opacity .5s;opacity:0}
.current-bar.left{left:0;background:linear-gradient(90deg,rgba(80,200,255,.4),transparent);border-radius:0 4px 4px 0}
.current-bar.right{right:0;background:linear-gradient(270deg,rgba(80,200,255,.4),transparent);border-radius:4px 0 0 4px}
.current-bar.active{width:250px;opacity:1}
.current-label{position:absolute;top:calc(50% - 22px);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(80,200,255,.4);pointer-events:none;z-index:8;opacity:0;transition:opacity .3s}
.current-label.active{opacity:1}
.current-label.left{left:14px}.current-label.right{right:14px;text-align:right}
.descent-layer{position:absolute;inset:0;z-index:4;overflow:hidden;display:none;pointer-events:none}
.desc-p{position:absolute;border-radius:50%;pointer-events:none;animation:riseUp linear infinite}
@keyframes riseUp{0%{transform:translateY(650px);opacity:0}10%{opacity:var(--mo,.3)}90%{opacity:var(--mo,.2)}100%{transform:translateY(-30px);opacity:0}}
.desc-marker{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;color:rgba(80,180,255,.12);pointer-events:none;animation:riseUp linear infinite;white-space:nowrap}
.eel{position:absolute;height:26px;background:linear-gradient(180deg,#0a3025,#18604a 30%,#124a35 60%,#0a3025);border-top:1px solid rgba(50,255,150,.12);border-bottom:1px solid rgba(50,255,150,.08);box-shadow:0 0 20px rgba(50,255,150,.06),0 2px 6px rgba(0,0,0,.4);animation:eelSw 3s ease-in-out infinite;z-index:2}
.eel-left{left:0;border-radius:4px 14px 14px 4px}.eel-right{right:0;border-radius:14px 4px 4px 14px;animation-delay:.3s}
@keyframes eelSw{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.eel-eye{position:absolute;top:50%;width:9px;height:9px;transform:translateY(-50%);background:radial-gradient(circle at 40% 40%,#60ffbb,#20aa60);border-radius:50%;box-shadow:0 0 8px rgba(50,255,150,.5)}
.eel-left .eel-eye{right:14px}.eel-right .eel-eye{left:14px}
.eel-eye::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;background:#001a10;border-radius:50%}
.eel-spark{position:absolute;top:-5px;width:2px;height:7px;background:#3aff9a;border-radius:1px;box-shadow:0 0 6px rgba(50,255,150,.6);animation:sFl .4s ease infinite}
@keyframes sFl{0%,60%,100%{opacity:0}20%{opacity:.8}}
.golden-trail{position:absolute;width:3px;height:3px;border-radius:50%;pointer-events:none;opacity:.3;transition:opacity 2.5s ease;background:radial-gradient(circle,rgba(255,215,0,.6),rgba(255,215,0,.1))}
.golden-fish-d{position:absolute;pointer-events:none;z-index:5;animation:gFishD 1s ease-in-out infinite}
@keyframes gFishD{0%,100%{transform:rotate(0deg)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
.golden-fish-d svg{display:block;filter:drop-shadow(0 0 6px rgba(255,215,0,.3))}
.sh-deco{position:absolute;pointer-events:none;z-index:3}
.sh-bubble{position:absolute;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle at 30% 30%,rgba(100,220,160,.25),rgba(60,180,120,.05));border:1px solid rgba(100,220,160,.12);animation:shBu 1.8s ease-out forwards}
@keyframes shBu{0%{opacity:.5;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-25px) scale(.4)}}
.trail-dot{position:absolute;border-radius:50%;pointer-events:none;animation:trailFade 2.5s ease forwards;z-index:5}
@keyframes trailFade{0%{opacity:var(--to,.3);transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
.outline-flash{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5;border:2px dashed rgba(255,215,0,.25);border-radius:50%;animation:outlinePulse 1.5s ease forwards}
@keyframes outlinePulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
.abyss-msg{position:absolute;bottom:50px;left:0;right:0;z-index:12;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.5s ease}
.abyss-msg.show{opacity:1}
.abyss-msg span{font-family:'Instrument Serif',serif;font-size:18px;color:rgba(255,80,80,.4);letter-spacing:.1em;font-style:italic}
.gv-pearl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:6;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8dc,#ffd700,#b8860b);box-shadow:0 0 18px rgba(255,215,0,.5);animation:pShimmer 2s ease-in-out infinite}
.gv-pearl.center{width:28px;height:28px;box-shadow:0 0 25px rgba(255,215,0,.6)}
.gv-pearl.locked{opacity:.2;box-shadow:0 0 4px rgba(255,215,0,.15);animation:none}
.gv-pearl.collected{animation:collPop .5s ease forwards}
@keyframes pShimmer{0%,100%{box-shadow:0 0 18px rgba(255,215,0,.5)}50%{box-shadow:0 0 30px rgba(255,215,0,.8)}}
.gv-eel-bar{position:absolute;height:22px;background:linear-gradient(180deg,#0a3025 0%,#18604a 25%,#1a7050 45%,#18604a 65%,#0a3025 100%);border-top:1px solid rgba(50,255,150,.12);border-bottom:1px solid rgba(50,255,150,.08);border-radius:11px 3px 3px 11px;pointer-events:none;z-index:3;box-shadow:0 0 16px rgba(50,255,150,.1);animation:gvEelSw 2.5s ease-in-out infinite}
.gv-eel-bar::after{content:'';position:absolute;right:-12px;top:1px;width:16px;height:20px;background:linear-gradient(135deg,#18604a 30%,#0a3025);border-radius:0 55% 55% 0;border-top:1px solid rgba(50,255,150,.08);border-bottom:1px solid rgba(50,255,150,.06)}
@keyframes gvEelSw{0%,100%{transform:translateY(0)}25%{transform:translateY(-2px)}75%{transform:translateY(2px)}}
.gv-eel-bar .eel-eye{position:absolute;top:50%;left:10px;width:7px;height:7px;transform:translateY(-50%);background:radial-gradient(circle at 40% 40%,#60ffbb,#20aa60);border-radius:50%;box-shadow:0 0 6px rgba(50,255,150,.4)}
.gv-eel-bar .eel-eye::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:3px;background:#001a10;border-radius:50%}
.gv-haz-ball{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff4068,#a01838);box-shadow:0 0 10px rgba(255,50,80,.4)}

}c.fillStyle=s.ok?'rgba(255,255,255,.8)':'rgba(255,255,255,.2)';c.fillText((s.ok?'  ':'  ')+s.lbl,148,sy);sy+=32;});sy+=10;c.textAlign='center';if(S.dmgTaken===0){c.fillStyle='rgba(100,255,150,.08)';c.fillRect(w/2-90,sy-14,180,24);c.strokeStyle='rgba(100,255,150,.3)';c.lineWidth=1;c.strokeRect(w/2-90,sy-14,180,24);c.fillStyle='rgba(100,255,150,.9)';c.font='bold 13px Courier,monospace';c.fillText('NO DAMAGE',w/2,sy+3);}else{c.fillStyle='rgba(255,255,255,.2)';c.font='12px Courier,monospace';c.fillText('Dano recebido: '+S.dmgTaken,w/2,sy+3);}sy+=40;var isPlat=S.eggs[0]&&S.eggs[1]&&S.eggs[2]&&S.dmgTaken===0&&S.won;if(isPlat){c.fillStyle='rgba(232,197,71,.06)';c.beginPath();c.arc(w/2,sy+20,35,0,Math.PI*2);c.fill();c.strokeStyle='rgba(232,197,71,.4)';c.lineWidth=2;c.beginPath();c.arc(w/2,sy+20,28,0,Math.PI*2);c.stroke();c.fillStyle='#e8c547';c.font='bold 16px Georgia,serif';c.fillText('PLATINADO',w/2,sy+15);c.fillStyle='rgba(232,197,71,.5)';c.font='10px Courier,monospace';c.fillText('TODAS AS CONQUISTAS',w/2,sy+32);sy+=70;}if(S.admin){c.fillStyle='rgba(255,60,60,.5)';c.font='10px Courier,monospace';c.fillText('ADMIN MODE',w/2,sy+10);}c.fillStyle='rgba(255,255,255,.08)';c.font='9px Courier,monospace';c.fillText('OBRIGADO POR JOGAR',w/2,h-20);cv.toBlob(function(b){if(!b)return;var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='ocean-explorer-result.png';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},5000);},'image/png');}
