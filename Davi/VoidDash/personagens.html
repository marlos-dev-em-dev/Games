<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void-Dash — Personagens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg-deep: #06060e;
      --bg-surface: #0c0c1a;
      --purple-dark: #1a0a2e;
      --purple-mid: #6b21a8;
      --purple-bright: #a855f7;
      --purple-glow: #c084fc;
      --purple-neon: #d8b4fe;
      --white: #f0eef5;
      --white-muted: #b8b0c8;
      --text-dim: #5a5270;
      --coin-gold: #facc15;
      --coin-gold-dim: #ca8a04;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
      --char-accent: #06b6d4;
      --char-accent-dark: #0e7490;
      --char-accent-glow: rgba(6,182,212,0.5);
      --char-accent-bg: rgba(6,182,212,0.08);
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== STARFIELD ===== */
    .starfield { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .starfield canvas { width: 100%; height: 100%; display: block; }

    /* ===== AMBIENT GLOWS ===== */
    .ambient-glow {
      position: fixed; border-radius: 50%; filter: blur(120px);
      pointer-events: none; z-index: 1;
      transition: background 0.8s;
    }
    .ambient-glow--1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(6,182,212,0.12), transparent 70%);
      top: -10%; left: -5%;
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .ambient-glow--2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(6,182,212,0.08), transparent 70%);
      bottom: -10%; right: -5%;
      animation: drift2 15s ease-in-out infinite alternate;
    }
    .ambient-glow--3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(6,182,212,0.06), transparent 70%);
      top: 40%; left: 50%;
      animation: drift3 10s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(60px,40px) scale(1.1); } }
    @keyframes drift2 { to { transform: translate(-50px,-30px) scale(1.15); } }
    @keyframes drift3 { to { transform: translate(-40px,50px) scale(0.9); } }

    /* ===== OVERLAYS ===== */
    .scanlines {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    .vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(6,6,14,0.7) 100%);
    }

    /* ===== PLAYER STATS ===== */
    .player-stats {
      position: fixed; top: 2rem; right: 2rem; z-index: 20;
      display: flex; flex-direction: column; gap: 0.8rem;
      padding: 1.2rem 1.5rem;
      background: linear-gradient(135deg, rgba(12,12,26,0.85), rgba(26,10,46,0.6));
      border: 1px solid rgba(107,33,168,0.2); border-radius: 6px;
      backdrop-filter: blur(12px); min-width: 200px;
      animation: statsReveal 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    @keyframes statsReveal { from { opacity:0; transform:translateY(-15px); } to { opacity:1; transform:translateY(0); } }

    .player-stats__xp-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:0.45rem; }
    .player-stats__xp-label { font-family:var(--font-display); font-size:0.6rem; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; color:var(--purple-glow); }
    .player-stats__xp-value { font-family:var(--font-display); font-size:0.6rem; font-weight:400; letter-spacing:0.08em; color:var(--white-muted); }
    .player-stats__xp-bar { width:100%; height:6px; background:rgba(107,33,168,0.15); border-radius:3px; overflow:hidden; border:1px solid rgba(107,33,168,0.2); }
    .player-stats__xp-fill { height:100%; width:0%; background:linear-gradient(90deg, var(--purple-mid), var(--purple-bright), var(--purple-glow)); border-radius:3px; transition:width 0.6s cubic-bezier(0.16,1,0.3,1); box-shadow:0 0 8px rgba(168,85,247,0.4); }

    .player-stats__coins { display:flex; align-items:center; gap:0.5rem; padding-top:0.7rem; border-top:1px solid rgba(107,33,168,0.15); }
    .player-stats__coins-icon { display:inline-flex; align-items:center; justify-content:center; width:1.3rem; height:1.3rem; font-size:0.85rem; color:var(--coin-gold); text-shadow:0 0 6px rgba(250,204,21,0.4); flex-shrink:0; }
    .player-stats__coins-label { font-family:var(--font-display); font-size:0.55rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--coin-gold); }
    .player-stats__coins-value { font-family:var(--font-display); font-size:0.7rem; font-weight:700; letter-spacing:0.05em; color:var(--white); margin-left:auto; }

    /* ===== BACK BUTTON ===== */
    .char-back {
      position: fixed; top: 2rem; left: 2rem; z-index: 20;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-family: var(--font-display); font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.2em; color: var(--white-muted);
      background: linear-gradient(135deg, rgba(12,12,26,0.85), rgba(26,10,46,0.6));
      border: 1px solid rgba(107,33,168,0.2); border-radius: 4px;
      cursor: pointer; backdrop-filter: blur(12px);
      transition: color 0.3s, border-color 0.3s, transform 0.2s;
      animation: statsReveal 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    .char-back:hover { color: var(--white); border-color: rgba(168,85,247,0.5); transform: translateX(-3px); }
    .char-back__arrow { transition: transform 0.2s; }
    .char-back:hover .char-back__arrow { transform: translateX(-3px); }

    /* ===== MAIN LAYOUT ===== */
    .char-screen {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 6rem 2rem 3rem;
    }

    /* ===== NAVIGATION ===== */
    .char-nav {
      display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem;
      animation: fadeUp 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .char-nav__arrow {
      display: flex; align-items: center; justify-content: center;
      width: 3rem; height: 3rem; font-size: 2rem; font-weight: 300;
      color: var(--white-muted); background: rgba(12,12,26,0.6);
      border: 1px solid rgba(107,33,168,0.2); border-radius: 50%;
      cursor: pointer; font-family: var(--font-body);
      transition: color 0.3s, border-color 0.3s, transform 0.2s, box-shadow 0.3s;
    }
    .char-nav__arrow:hover {
      color: var(--white); border-color: var(--char-accent);
      box-shadow: 0 0 15px var(--char-accent-glow); transform: scale(1.1);
    }
    .char-nav__arrow:active { transform: scale(0.95); }

    .char-nav__info { text-align: center; min-width: 220px; }
    .char-nav__name {
      font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 900; letter-spacing: 0.15em;
      color: var(--char-accent); text-shadow: 0 0 20px var(--char-accent-glow);
      transition: color 0.4s, text-shadow 0.4s, opacity 0.3s, transform 0.3s;
    }
    .char-nav__name--changing { opacity: 0; transform: translateY(-8px); }
    .char-nav__subtitle {
      font-family: var(--font-body); font-size: 0.85rem; font-weight: 300;
      color: var(--text-dim); letter-spacing: 0.3em; text-transform: uppercase;
      margin-top: 0.3rem; transition: color 0.4s, opacity 0.3s;
    }

    /* ===== CHARACTER DISPLAY ===== */
    .char-display {
      position: relative; width: clamp(200px, 35vw, 280px);
      height: clamp(220px, 38vw, 310px); margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      animation: fadeUp 0.8s 0.55s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    .char-display__glow {
      position: absolute; width: 130%; height: 130%; border-radius: 50%;
      background: radial-gradient(circle, var(--char-accent-glow), transparent 70%);
      filter: blur(50px); opacity: 0.25; transition: background 0.6s; pointer-events: none;
    }
    .char-display__container {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      animation: charFloat 4s ease-in-out infinite;
      transition: opacity 0.3s, transform 0.3s;
    }
    .char-display__container--fading { opacity: 0; transform: scale(0.92); }
    @keyframes charFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }

    .char-svg { width: 100%; height: 100%; }

    .char-display__particles { position: absolute; inset: 0; pointer-events: none; }
    .char-particle {
      position: absolute; top: 50%; left: 50%; border-radius: 50%;
      background: var(--char-accent); box-shadow: 0 0 6px var(--char-accent-glow);
      animation: particleOrbit 8s linear infinite; pointer-events: none;
    }
    @keyframes particleOrbit {
      0% { transform: rotate(0deg) translateX(110px) rotate(0deg); opacity: 0; }
      8% { opacity: 0.6; } 92% { opacity: 0.6; }
      100% { transform: rotate(360deg) translateX(110px) rotate(-360deg); opacity: 0; }
    }

    .char-display__selected-ring {
      position: absolute; inset: -12px; border: 2px solid var(--char-accent);
      border-radius: 50%; opacity: 0; transition: opacity 0.4s;
      box-shadow: 0 0 20px var(--char-accent-glow), inset 0 0 20px var(--char-accent-glow);
      pointer-events: none;
    }
    .char-display__selected-ring--visible { opacity: 0.5; animation: selectedPulse 2.5s ease-in-out infinite; }
    @keyframes selectedPulse { 0%,100% { opacity:0.3; } 50% { opacity:0.6; } }

    .char-display__flash { animation: upgradeFlash 0.5s ease-out; }
    @keyframes upgradeFlash { 0% { filter: brightness(2.5) saturate(1.5); } 100% { filter: brightness(1) saturate(1); } }

    .char-burst-particle {
      position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      border-radius: 50%; background: var(--char-accent);
      box-shadow: 0 0 8px var(--char-accent-glow);
      animation: burstOut 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
      pointer-events: none; z-index: 5;
    }
    @keyframes burstOut {
      0% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
    }

    /* ===== DESCRIPTION ===== */
    .char-desc {
      font-family: var(--font-body); font-size: 1rem; font-weight: 400;
      color: var(--white-muted); text-align: center; max-width: 420px;
      line-height: 1.5; margin-bottom: 1.2rem;
      animation: fadeUp 0.8s 0.65s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }

    /* ===== ATTACK CARD ===== */
    .char-attack {
      width: clamp(280px, 50vw, 420px); padding: 1rem 1.5rem;
      background: linear-gradient(135deg, rgba(12,12,26,0.85), rgba(26,10,46,0.6));
      border: 1px solid rgba(107,33,168,0.2); border-radius: 6px;
      backdrop-filter: blur(12px); margin-bottom: 1.8rem;
      transition: border-color 0.4s;
      animation: fadeUp 0.8s 0.7s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    .char-attack__header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .char-attack__icon { font-size: 1rem; color: var(--char-accent); transition: color 0.4s; }
    .char-attack__name {
      font-family: var(--font-display); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.2em; color: var(--char-accent); text-transform: uppercase;
      transition: color 0.4s;
    }
    .char-attack__desc { font-family: var(--font-body); font-size: 0.9rem; color: var(--text-dim); line-height: 1.4; }

    /* ===== STATS ===== */
    .char-stats {
      width: clamp(280px, 50vw, 420px); display: flex; flex-direction: column;
      gap: 0.7rem; margin-bottom: 1.5rem;
      animation: fadeUp 0.8s 0.8s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    .char-stat { display: flex; align-items: center; gap: 1rem; }
    .char-stat__label {
      font-family: var(--font-display); font-size: 0.5rem; font-weight: 700;
      letter-spacing: 0.15em; color: var(--text-dim); min-width: 80px; text-align: right;
    }
    .char-stat__bar {
      flex: 1; height: 8px; background: rgba(107,33,168,0.12);
      border-radius: 4px; overflow: hidden; border: 1px solid rgba(107,33,168,0.15);
    }
    .char-stat__fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--char-accent-dark), var(--char-accent));
      transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
      box-shadow: 0 0 8px var(--char-accent-glow);
    }
    .char-stat__value {
      font-family: var(--font-display); font-size: 0.6rem; font-weight: 400;
      letter-spacing: 0.05em; color: var(--white-muted); min-width: 32px; text-align: left;
    }

    /* ===== LEVEL ===== */
    .char-level {
      display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 1.8rem;
      animation: fadeUp 0.8s 0.85s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    .char-level__label { font-family:var(--font-display); font-size:0.6rem; font-weight:700; letter-spacing:0.2em; color:var(--text-dim); }
    .char-level__current {
      font-family:var(--font-display); font-size:1.5rem; font-weight:900;
      color:var(--char-accent); text-shadow:0 0 10px var(--char-accent-glow);
      transition: color 0.4s;
    }
    .char-level__current--bump { animation: levelBump 0.4s cubic-bezier(0.16,1,0.3,1); }
    @keyframes levelBump { 0% { transform:scale(1); } 50% { transform:scale(1.3); } 100% { transform:scale(1); } }
    .char-level__sep { font-family:var(--font-display); font-size:0.8rem; color:var(--text-dim); }
    .char-level__max { font-family:var(--font-display); font-size:0.8rem; color:var(--text-dim); }

    /* ===== ACTIONS ===== */
    .char-actions {
      display: flex; gap: 1rem; align-items: center;
      animation: fadeUp 0.8s 0.9s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    .char-actions__select {
      padding: 0.8rem 1.8rem;
      font-family: var(--font-display); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.15em; color: var(--white-muted);
      background: transparent; border: 1px solid rgba(107,33,168,0.3);
      border-radius: 4px; cursor: pointer; transition: all 0.3s;
    }
    .char-actions__select:hover { color:var(--white); border-color:var(--char-accent); box-shadow:0 0 15px var(--char-accent-glow); }
    .char-actions__select--active {
      color: var(--char-accent); border-color: var(--char-accent);
      background: var(--char-accent-bg); pointer-events: none;
    }

    .char-actions__upgrade {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.8rem 1.8rem;
      font-family: var(--font-display); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.15em; color: var(--white);
      background: linear-gradient(135deg, #059669, #10b981);
      border: 1px solid rgba(16,185,129,0.5); border-radius: 4px;
      cursor: pointer; transition: all 0.3s;
    }
    .char-actions__upgrade:hover { box-shadow:0 0 20px rgba(16,185,129,0.3); transform:translateY(-2px); }
    .char-actions__upgrade:active { transform:translateY(0) scale(0.98); }
    .char-actions__upgrade:disabled {
      background: linear-gradient(135deg, rgba(30,30,50,0.6), rgba(20,20,40,0.8));
      border-color: rgba(100,100,120,0.2); color: var(--text-dim);
      cursor: not-allowed; box-shadow: none; transform: none;
    }
    .char-actions__upgrade-cost { color: var(--coin-gold); }
    .char-actions__upgrade:disabled .char-actions__upgrade-cost { color: var(--text-dim); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 4rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 0.7rem 1.5rem;
      background: linear-gradient(135deg, rgba(12,12,26,0.95), rgba(26,10,46,0.9));
      border: 1px solid rgba(107,33,168,0.4); border-radius: 4px;
      font-family: var(--font-display); font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--white-muted); z-index: 100;
      opacity: 0; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
      backdrop-filter: blur(12px); pointer-events: none; white-space: nowrap;
    }
    .toast--visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== VERSION ===== */
    .version-tag {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 20;
      font-family: var(--font-display); font-size: 0.55rem;
      letter-spacing: 0.15em; color: var(--text-dim);
      opacity: 0; animation: statsReveal 0.8s 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .char-screen { padding: 5rem 1.2rem 2rem; }
      .char-nav { gap: 1rem; }
      .char-nav__arrow { width: 2.5rem; height: 2.5rem; font-size: 1.5rem; }
      .char-display { width: 180px; height: 200px; }
      .char-stat__label { min-width: 55px; font-size: 0.45rem; }
      .char-actions { flex-direction: column; width: 100%; max-width: 300px; }
      .char-actions__select, .char-actions__upgrade { width: 100%; justify-content: center; }
      .player-stats { top: 1rem; right: 1rem; min-width: 170px; padding: 1rem 1.2rem; }
      .char-back { top: 1rem; left: 1rem; }
      .version-tag { display: none; }
    }
  </style>
</head>
<body>

  <!-- STARFIELD -->
  <div class="starfield"><canvas id="starCanvas"></canvas></div>

  <!-- AMBIENT GLOWS -->
  <div class="ambient-glow ambient-glow--1"></div>
  <div class="ambient-glow ambient-glow--2"></div>
  <div class="ambient-glow ambient-glow--3"></div>

  <!-- OVERLAYS -->
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- PLAYER STATS -->
  <aside class="player-stats">
    <div class="player-stats__xp">
      <div class="player-stats__xp-header">
        <span class="player-stats__xp-label">XP</span>
        <span class="player-stats__xp-value" id="xpText">0 / 100</span>
      </div>
      <div class="player-stats__xp-bar"><div class="player-stats__xp-fill" id="xpFill"></div></div>
    </div>
    <div class="player-stats__coins">
      <span class="player-stats__coins-icon">◆</span>
      <span class="player-stats__coins-label">Moedas:</span>
      <span class="player-stats__coins-value" id="coinsValue">0</span>
    </div>
  </aside>

  <!-- BACK BUTTON -->
  <button class="char-back" id="backBtn">
    <span class="char-back__arrow">←</span>
    <span>VOLTAR</span>
  </button>

  <!-- CHARACTER SCREEN -->
  <main class="char-screen">

    <!-- NAVIGATION -->
    <div class="char-nav">
      <button class="char-nav__arrow" id="navLeft" aria-label="Anterior">&#8249;</button>
      <div class="char-nav__info">
        <h1 class="char-nav__name" id="charName">PHANTOM</h1>
        <p class="char-nav__subtitle" id="charSubtitle">O Vazio Veloz</p>
      </div>
      <button class="char-nav__arrow" id="navRight" aria-label="Próximo">&#8250;</button>
    </div>

    <!-- CHARACTER DISPLAY -->
    <div class="char-display">
      <div class="char-display__glow" id="charGlow"></div>
      <div class="char-display__container" id="charContainer">
        <svg class="char-svg" id="charSvg" viewBox="0 0 200 220" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="char-display__particles" id="charParticles"></div>
      </div>
      <div class="char-display__selected-ring" id="selectedRing"></div>
    </div>

    <!-- DESCRIPTION -->
    <p class="char-desc" id="charDesc"></p>

    <!-- ATTACK CARD -->
    <div class="char-attack">
      <div class="char-attack__header">
        <span class="char-attack__icon">⚔</span>
        <span class="char-attack__name" id="attackName"></span>
      </div>
      <p class="char-attack__desc" id="attackDesc"></p>
    </div>

    <!-- STATS -->
    <div class="char-stats">
      <div class="char-stat">
        <span class="char-stat__label">FORÇA</span>
        <div class="char-stat__bar"><div class="char-stat__fill" id="strFill"></div></div>
        <span class="char-stat__value" id="strValue">0</span>
      </div>
      <div class="char-stat">
        <span class="char-stat__label">VELOCIDADE</span>
        <div class="char-stat__bar"><div class="char-stat__fill" id="spdFill"></div></div>
        <span class="char-stat__value" id="spdValue">0</span>
      </div>
      <div class="char-stat">
        <span class="char-stat__label">SAÚDE</span>
        <div class="char-stat__bar"><div class="char-stat__fill" id="hpFill"></div></div>
        <span class="char-stat__value" id="hpValue">0</span>
      </div>
    </div>

    <!-- LEVEL -->
    <div class="char-level">
      <span class="char-level__label">NÍVEL</span>
      <span class="char-level__current" id="levelCurrent">1</span>
      <span class="char-level__sep">/</span>
      <span class="char-level__max">10</span>
    </div>

    <!-- ACTIONS -->
    <div class="char-actions">
      <button class="char-actions__select" id="selectBtn">SELECIONAR</button>
      <button class="char-actions__upgrade" id="upgradeBtn">
        MELHORAR
        <span class="char-actions__upgrade-cost" id="upgradeCost">— 60 ◆</span>
      </button>
    </div>
  </main>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <span class="version-tag">v0.1.0 ALPHA</span>

  <script>
    // =============================================
    //  STARFIELD (reutilizado da tela inicial)
    // =============================================
    (() => {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d');
      const STAR_COUNT = 200;
      const COMET_INTERVAL_MIN = 3000, COMET_INTERVAL_MAX = 7000;
      const COMET_SPEED_MIN = 4, COMET_SPEED_MAX = 8, COMET_TAIL = 80;
      let W, H, stars = [], comets = [], nextCometTime = 0;

      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      function createStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random()*W, y: Math.random()*H,
            r: Math.random()*1.5+0.3, baseAlpha: Math.random()*0.6+0.15,
            pulse: Math.random()*Math.PI*2, pulseSpeed: Math.random()*0.02+0.005,
            vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15,
            isPurple: Math.random() > 0.65
          });
        }
      }
      function spawnComet() {
        const side = Math.floor(Math.random()*4);
        let x, y, angle;
        switch(side) {
          case 0: x=Math.random()*W; y=-20; angle=Math.random()*0.8+0.4; break;
          case 1: x=W+20; y=Math.random()*H; angle=Math.random()*0.8+2.0; break;
          case 2: x=Math.random()*W; y=H+20; angle=Math.random()*0.8+3.6; break;
          default: x=-20; y=Math.random()*H; angle=Math.random()*0.8-0.4; break;
        }
        const speed = COMET_SPEED_MIN + Math.random()*(COMET_SPEED_MAX-COMET_SPEED_MIN);
        comets.push({ x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:1, decay:0.003+Math.random()*0.004, isPurple:Math.random()>0.4, headSize:2+Math.random()*2 });
      }
      let lastTime = 0;
      function draw(time) {
        ctx.clearRect(0,0,W,H);
        for (const s of stars) {
          s.x+=s.vx; s.y+=s.vy;
          if(s.x<-5)s.x=W+5; if(s.x>W+5)s.x=-5; if(s.y<-5)s.y=H+5; if(s.y>H+5)s.y=-5;
          s.pulse+=s.pulseSpeed;
          const alpha = s.baseAlpha * (0.5+0.5*Math.sin(s.pulse));
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          if(s.isPurple){ ctx.fillStyle=`rgba(168,85,247,${alpha})`; ctx.shadowColor='rgba(168,85,247,0.5)'; ctx.shadowBlur=6; }
          else { ctx.fillStyle=`rgba(240,238,245,${alpha})`; ctx.shadowColor='transparent'; ctx.shadowBlur=0; }
          ctx.fill(); ctx.shadowBlur=0;
        }
        if(time>=nextCometTime){ spawnComet(); nextCometTime=time+COMET_INTERVAL_MIN+Math.random()*(COMET_INTERVAL_MAX-COMET_INTERVAL_MIN); }
        for(let i=comets.length-1;i>=0;i--){
          const c=comets[i]; c.x+=c.vx; c.y+=c.vy; c.life-=c.decay;
          if(c.life<=0||c.x<-100||c.x>W+100||c.y<-100||c.y>H+100){ comets.splice(i,1); continue; }
          const tailX=c.x-(c.vx/Math.hypot(c.vx,c.vy))*COMET_TAIL, tailY=c.y-(c.vy/Math.hypot(c.vx,c.vy))*COMET_TAIL;
          const grad=ctx.createLinearGradient(c.x,c.y,tailX,tailY);
          if(c.isPurple){ grad.addColorStop(0,`rgba(192,132,252,${c.life*0.9})`); grad.addColorStop(0.3,`rgba(168,85,247,${c.life*0.5})`); grad.addColorStop(1,'rgba(107,33,168,0)'); }
          else { grad.addColorStop(0,`rgba(240,238,245,${c.life*0.95})`); grad.addColorStop(0.3,`rgba(200,195,220,${c.life*0.4})`); grad.addColorStop(1,'rgba(150,140,180,0)'); }
          ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(tailX,tailY); ctx.strokeStyle=grad; ctx.lineWidth=1.5; ctx.stroke();
          ctx.beginPath(); ctx.arc(c.x,c.y,c.headSize,0,Math.PI*2);
          ctx.fillStyle=c.isPurple?`rgba(216,180,254,${c.life})`:`rgba(255,255,255,${c.life})`;
          ctx.shadowColor=c.isPurple?`rgba(168,85,247,${c.life*0.8})`:`rgba(255,255,255,${c.life*0.6})`;
          ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener('resize', ()=>{ resize(); createStars(); });
      resize(); createStars(); nextCometTime=performance.now()+2000; requestAnimationFrame(draw);
    })();

    // =============================================
    //  CHARACTER DATA
    // =============================================
    const CHARACTERS = [
      {
        id: 'phantom', name: 'PHANTOM', subtitle: 'O Vazio Veloz',
        description: 'Guerreiro ágil das dimensões. Corta o espaço-tempo com velocidade letal, deixando rastros de energia pura.',
        attackName: 'Rajada Void', attackDesc: 'Dispara 3 projéteis rápidos em leque que atravessam inimigos em sequência.',
        accent: '#06b6d4', accentDark: '#0e7490',
        accentGlow: 'rgba(6,182,212,0.5)', accentBg: 'rgba(6,182,212,0.08)',
        baseStats: { strength: 3, speed: 8, health: 4 },
        statGrowth: { strength: 0.4, speed: 0.2, health: 0.3 },
        svg: `
          <defs>
            <linearGradient id="cFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
            <filter id="cGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="6 12" opacity="0.3"><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="25s" repeatCount="indefinite"/></circle>
          <circle cx="100" cy="100" r="75" fill="none" stroke="#06b6d4" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"><animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="18s" repeatCount="indefinite"/></circle>
          <g filter="url(#cGlow)">
            <polygon points="100,25 171,77 144,161 56,161 29,77" fill="url(#cFill)" opacity="0.85"/>
            <polygon points="100,50 147,85 129,141 71,141 53,85" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
            <line x1="100" y1="50" x2="100" y2="141" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="53" y1="100" x2="147" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          </g>
          <ellipse cx="100" cy="195" rx="50" ry="8" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.15)" stroke-width="0.5"/>`
      },
      {
        id: 'titan', name: 'TITÃ', subtitle: 'O Colosso Abissal',
        description: 'Gigante do abismo cósmico. Seus golpes abrem fissuras no tecido do espaço, destruindo tudo ao redor.',
        attackName: 'Fissura Cósmica', attackDesc: 'Cria uma onda de choque devastadora que empurra e atordoa inimigos próximos.',
        accent: '#f59e0b', accentDark: '#b45309',
        accentGlow: 'rgba(245,158,11,0.5)', accentBg: 'rgba(245,158,11,0.08)',
        baseStats: { strength: 7, speed: 3, health: 9 },
        statGrowth: { strength: 0.3, speed: 0.3, health: 0.1 },
        svg: `
          <defs>
            <linearGradient id="cFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
            <filter id="cGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="8 4" opacity="0.3"><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="30s" repeatCount="indefinite"/></circle>
          <circle cx="100" cy="100" r="75" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.15"><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="22s" repeatCount="indefinite"/></circle>
          <g filter="url(#cGlow)">
            <polygon points="100,18 172,55 172,145 100,182 28,145 28,55" fill="url(#cFill)" opacity="0.85"/>
            <polygon points="100,42 148,65 148,135 100,158 52,135 52,65" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
            <line x1="100" y1="42" x2="100" y2="158" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="52" y1="100" x2="148" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          </g>
          <ellipse cx="100" cy="200" rx="55" ry="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.15)" stroke-width="0.5"/>`
      },
      {
        id: 'wraith', name: 'REGULAR', subtitle: 'Equilíbrio Dimensional',
        description: 'Entidade que existe entre dimensões. Harmoniza poder e mobilidade em perfeita sintonia cósmica.',
        attackName: 'Pulso Dimensional', attackDesc: 'Libera uma explosão circular de energia que causa dano em área ao redor.',
        accent: '#10b981', accentDark: '#047857',
        accentGlow: 'rgba(16,185,129,0.5)', accentBg: 'rgba(16,185,129,0.08)',
        baseStats: { strength: 5, speed: 5, health: 6 },
        statGrowth: { strength: 0.3, speed: 0.3, health: 0.3 },
        svg: `
          <defs>
            <linearGradient id="cFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/></linearGradient>
            <filter id="cGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="#10b981" stroke-width="0.6" stroke-dasharray="3 9" opacity="0.3"><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/></circle>
          <circle cx="100" cy="100" r="75" fill="none" stroke="#10b981" stroke-width="0.4" stroke-dasharray="2 4" opacity="0.15"><animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite"/></circle>
          <g filter="url(#cGlow)">
            <polygon points="100,15 175,100 100,185 25,100" fill="url(#cFill)" opacity="0.85"/>
            <polygon points="100,45 150,100 100,155 50,100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
            <line x1="100" y1="45" x2="100" y2="155" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="50" y1="100" x2="150" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="100" y1="45" x2="150" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/>
            <line x1="100" y1="45" x2="50" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="0.3"/>
          </g>
          <ellipse cx="100" cy="200" rx="45" ry="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.15)" stroke-width="0.5"/>`
      }
    ];

    const UPGRADE_COSTS = [60, 120, 240, 360, 480, 600, 720, 840, 960];
    const MAX_LEVEL = 10;
    const STAT_BAR_MAX = 10;

    // =============================================
    //  PLAYER STATE
    // =============================================
    let playerCoins = 0;
    let selectedIndex = 0;
    let characterLevels = [1, 1, 1];
    let currentIndex = 0;
    let isTransitioning = false;

    // =============================================
    //  DOM REFS
    // =============================================
    const $ = id => document.getElementById(id);
    const els = {
      charName: $('charName'), charSubtitle: $('charSubtitle'),
      charSvg: $('charSvg'), charContainer: $('charContainer'),
      charParticles: $('charParticles'), charGlow: $('charGlow'),
      selectedRing: $('selectedRing'), charDesc: $('charDesc'),
      attackName: $('attackName'), attackDesc: $('attackDesc'),
      strFill: $('strFill'), spdFill: $('spdFill'), hpFill: $('hpFill'),
      strValue: $('strValue'), spdValue: $('spdValue'), hpValue: $('hpValue'),
      levelCurrent: $('levelCurrent'), selectBtn: $('selectBtn'),
      upgradeBtn: $('upgradeBtn'), upgradeCost: $('upgradeCost'),
      coinsValue: $('coinsValue'), xpText: $('xpText'), xpFill: $('xpFill'),
      toast: $('toast')
    };

    // =============================================
    //  THEME
    // =============================================
    function applyTheme(char) {
      const r = document.documentElement.style;
      r.setProperty('--char-accent', char.accent);
      r.setProperty('--char-accent-dark', char.accentDark);
      r.setProperty('--char-accent-glow', char.accentGlow);
      r.setProperty('--char-accent-bg', char.accentBg);

      const g = document.querySelectorAll('.ambient-glow');
      const dim = char.accentGlow.replace(/[\d.]+\)$/, '0.1)');
      const dim2 = char.accentGlow.replace(/[\d.]+\)$/, '0.07)');
      g[0].style.background = `radial-gradient(circle, ${dim}, transparent 70%)`;
      g[1].style.background = `radial-gradient(circle, ${dim2}, transparent 70%)`;
      g[2].style.background = `radial-gradient(circle, ${dim2}, transparent 70%)`;
    }

    // =============================================
    //  PARTICLES
    // =============================================
    function createParticles() {
      els.charParticles.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'char-particle';
        p.style.animationDelay = `${i * (8 / 8)}s`;
        const size = (2 + Math.random() * 2) + 'px';
        p.style.width = size; p.style.height = size;
        els.charParticles.appendChild(p);
      }
    }

    // =============================================
    //  STAT CALC
    // =============================================
    function getStat(idx, stat) {
      const c = CHARACTERS[idx];
      return c.baseStats[stat] + (characterLevels[idx] - 1) * c.statGrowth[stat];
    }

    // =============================================
    //  UPDATE FUNCTIONS
    // =============================================
    function updateDisplay() {
      const c = CHARACTERS[currentIndex];
      els.charName.textContent = c.name;
      els.charSubtitle.textContent = c.subtitle;
      els.charSvg.innerHTML = c.svg;
      els.charDesc.textContent = c.description;
      els.attackName.textContent = c.attackName;
      els.attackDesc.textContent = c.attackDesc;
      applyTheme(c);
      createParticles();
      updateStats();
      updateLevel();
      updateSelectButton();
      updateUpgradeButton();
      updateSelectedRing();
    }

    function updateStats() {
      const stats = [
        { key: 'strength', fill: els.strFill, val: els.strValue },
        { key: 'speed',    fill: els.spdFill, val: els.spdValue },
        { key: 'health',   fill: els.hpFill,  val: els.hpValue  }
      ];
      stats.forEach(s => {
        const v = getStat(currentIndex, s.key);
        const pct = Math.min((v / STAT_BAR_MAX) * 100, 100);
        s.fill.style.width = pct + '%';
        s.val.textContent = v.toFixed(1);
      });
    }

    function updateLevel() {
      els.levelCurrent.textContent = characterLevels[currentIndex];
    }

    function updateSelectButton() {
      if (selectedIndex === currentIndex) {
        els.selectBtn.textContent = '✓ SELECIONADO';
        els.selectBtn.classList.add('char-actions__select--active');
      } else {
        els.selectBtn.textContent = 'SELECIONAR';
        els.selectBtn.classList.remove('char-actions__select--active');
      }
    }

    function updateSelectedRing() {
      els.selectedRing.classList.toggle('char-display__selected-ring--visible', selectedIndex === currentIndex);
    }

    function updateUpgradeButton() {
      const level = characterLevels[currentIndex];
      if (level >= MAX_LEVEL) {
        els.upgradeBtn.disabled = true;
        els.upgradeCost.textContent = 'NÍVEL MÁXIMO';
      } else {
        const cost = UPGRADE_COSTS[level - 1];
        els.upgradeBtn.disabled = playerCoins < cost;
        els.upgradeCost.textContent = `— ${cost} ◆`;
      }
    }

    function updateCoinsDisplay() {
      els.coinsValue.textContent = playerCoins;
    }

    // =============================================
    //  NAVIGATION
    // =============================================
    function navigateBy(dir) {
      if (isTransitioning) return;
      isTransitioning = true;

      els.charContainer.classList.add('char-display__container--fading');
      els.charName.classList.add('char-nav__name--changing');

      setTimeout(() => {
        currentIndex = (currentIndex + dir + CHARACTERS.length) % CHARACTERS.length;
        updateDisplay();

        els.charContainer.classList.remove('char-display__container--fading');
        els.charName.classList.remove('char-nav__name--changing');

        setTimeout(() => { isTransitioning = false; }, 300);
      }, 300);
    }

    // =============================================
    //  UPGRADE
    // =============================================
    function upgradeCharacter() {
      const level = characterLevels[currentIndex];
      if (level >= MAX_LEVEL) { showToast('Nível máximo atingido'); return; }
      const cost = UPGRADE_COSTS[level - 1];
      if (playerCoins < cost) { showToast('Moedas insuficientes'); return; }

      playerCoins -= cost;
      characterLevels[currentIndex]++;

      updateCoinsDisplay();
      updateStats();
      updateLevel();
      updateUpgradeButton();

      // Level bump animation
      els.levelCurrent.classList.remove('char-level__current--bump');
      void els.levelCurrent.offsetWidth;
      els.levelCurrent.classList.add('char-level__current--bump');

      // Flash
      els.charContainer.classList.add('char-display__flash');
      setTimeout(() => els.charContainer.classList.remove('char-display__flash'), 500);

      // Burst particles
      playBurst();

      showToast(`${CHARACTERS[currentIndex].name} → Nível ${characterLevels[currentIndex]}`);
    }

    function playBurst() {
      const display = document.querySelector('.char-display');
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'char-burst-particle';
        const angle = (i / 12) * Math.PI * 2;
        const dist = 70 + Math.random() * 50;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
        display.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    // =============================================
    //  SELECTION
    // =============================================
    function selectCharacter() {
      if (selectedIndex === currentIndex) { showToast('Personagem já selecionado'); return; }
      selectedIndex = currentIndex;
      updateSelectButton();
      updateSelectedRing();
      showToast(`${CHARACTERS[currentIndex].name} selecionado!`);
    }

    // =============================================
    //  TOAST
    // =============================================
    let toastTimer = null;
    function showToast(msg, dur = 2500) {
      clearTimeout(toastTimer);
      els.toast.textContent = msg;
      els.toast.classList.add('toast--visible');
      toastTimer = setTimeout(() => els.toast.classList.remove('toast--visible'), dur);
    }

    // =============================================
    //  EVENT LISTENERS
    // =============================================
    $('navLeft').addEventListener('click', () => navigateBy(-1));
    $('navRight').addEventListener('click', () => navigateBy(1));
    $('selectBtn').addEventListener('click', selectCharacter);
    $('upgradeBtn').addEventListener('click', upgradeCharacter);
    $('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') navigateBy(-1);
      if (e.key === 'ArrowRight') navigateBy(1);
      if (e.key === 'u' || e.key === 'U') upgradeCharacter();
      if (e.key === 'Enter') selectCharacter();
    });

    // =============================================
    //  INIT
    // =============================================
    updateDisplay();
    updateCoinsDisplay();
  </script>
</body>
</html>
